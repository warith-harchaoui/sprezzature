name: ci

# Runs the deterministic test suite + validator on every push to main and
# every PR. There is no eval suite in this repository any more: those tests
# went to the bricks they belong to when the monorepo was split.

# `on` is quoted because PyYAML's 1.1 mode parses bare `on:` as boolean True;
# GitHub's own parser handles either form. Quoting keeps `yaml.safe_load`
# happy for offline tooling.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint / import-hygiene gate — the AUDIT half of the make/audit paradigm the
  # skills themselves ship (audit: `ruff check`; make: `ruff check --fix`).
  # Fast and dependency-light (ruff only), so it fails a PR quickly before the
  # heavier test matrix runs. Config lives in ruff.toml (E741 ignored as the
  # OKLab lightness `l` is intentional; implicit re-exports use `name as name`).
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint (audit gate)
        run: ruff check .
      - name: Mypy type gate
        # Rule 3 type half. Per-skill-dir (shared private helper module names
        # would collide in a single run); ignore_missing_imports skips the heavy
        # optional backends absent from this light lane. Config in mypy.ini.
        run: ./scripts/run_mypy.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Several guards can only be written here, because this is the only
      # place that sees all nine bricks at once — that a skill's "invoked as"
      # sentence names a console script the brick installs, that the
      # `sprezzature` driver routes to commands the bricks declare, that a
      # requirements-dev.txt is one the brick's own workflow reads. Until this
      # step fetched more than one sibling they ran nowhere but a developer's
      # machine: 57 cases skipped here, and a skip reads like a pass.
      #
      # Only `sprezzature-figures` was cloned, and in full: 112 MB, for the
      # release test, which packages the extracted generators and their faces
      # and refuses to ship "documentation with nothing behind it". The script
      # below fetches all nine with `--filter=blob:none` and a sparse checkout
      # of the paths the guards read, which is 24 MB for the nine — a fifth
      # of what one full clone of figures costs, and it leaves out the 370 MB
      # of elevation rasters in sprezzature-maps that nothing here reads.
      - name: Fetch the sibling bricks
        run: scripts/fetch_siblings.sh

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev requirements + the driver
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # That file is the whole runtime install for this repository now.
          # A loop over the skills' own per-skill requirements files used to
          # follow, for the ones that still shipped model-backed Python
          # scripts. Publish and vision were the last two, and both left —
          # publish to its own repository, vision merged into accessibility —
          # so the loop matched nothing. `shopt -s nullglob` made that silent,
          # and the step went on announcing an install it no longer did.
          # tests/test_this_repo_names_what_it_has.py now fails on a workflow
          # that names a path this repository does not have.
          # The driver itself — installs the `sprezzature` console script so
          # downstream tests can import it.
          pip install ./sprezzature-cli

      - name: Run deterministic test suite
        # Includes tests/test_validate_skill.py (real YAML check on every
        # SKILL.md + negative cases) and tests/test_release_packaging.py
        # (build the tarballs into a tmp dir, verify SHA256SUMS, extract,
        # re-validate each skill). Both run with stdlib + PyYAML and
        # never touch the network — they belong in the default lane.
        run: python -m pytest -q

      - name: Validate every skill (YAML + content gate)
        # Strict YAML frontmatter check on every shipped skill
        # (scripts/validate_skill.py) followed by the sprezzature-ui content
        # quality gate (forbidden framework imports, trademarks,
        # marketing voice). A PR that breaks any SKILL.md's YAML fails
        # here even if pytest somehow does not.
        run: python scripts/validate_all.py

      - name: Audit the five surfaces across the nine bricks
        # The live half of the five-surface contract. The offline half
        # (tests/test_surfaces_contract.py) checks the contract is complete and
        # that the detectors still detect; this one looks at what the nine
        # bricks actually hold, which needs the siblings fetched above.
        #
        # It stayed off this workflow while CI cloned one sibling, and its own
        # docstring said so. The fetch step brings all nine with the package
        # directory the audit reads, so the reason is gone.
        #
        # `--require-checkouts` is the point of running it here: without the
        # flag a brick with no checkout is reported as undecidable and does not
        # fail, which is right on a laptop holding one clone and wrong here. A
        # fetch that came back with eight of nine would otherwise print a column
        # of `?` and exit 0 — a green job asserting the surfaces of a repository
        # it never read.
        run: python scripts/audit_surfaces.py --require-checkouts

      # There is no eval step here any more. The four eval modules left with
      # their bricks when the monorepo was split, and the check that they still
      # imported went with them, into the pre-push hooks of the two repositories
      # that have eval tests now: sprezzature-accessibility and
      # sprezzature-publish. A guard belongs where it can see the thing.
