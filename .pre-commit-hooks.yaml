# Pre-commit hooks manifest for the sprezzature-* skills.
#
# Consumers add the repo to their own ``.pre-commit-config.yaml``:
#
#   repos:
#     - repo: https://github.com/warith-harchaoui/sprezzature
#       rev: v0.16.0
#       hooks:
#         - id: sprezzature-ui-validate-skill
#
# The hooks for the extracted bricks ship with those bricks: see
# sprezzature-accessibility, sprezzature-ux-laws, sprezzature-publish and
# the rest, each of which carries its own .pre-commit-hooks.yaml now.
# What is left here is the two gates that are about this repository: the
# SKILL.md spec validator and the TRIGGERS generator.
#         - id: sprezzature-accessibility-lint
#         - id: sprezzature-ux-laws-audit
#         - id: sprezzature-ui-validate-skill
#
# Every hook is stdlib-only. The two color hooks
# (``sprezzature-colors-contrast`` and ``sprezzature-colors-cvd``) need Pillow;
# they declare it via ``additional_dependencies`` so pre-commit
# installs into its own isolated env.

- id: sprezzature-ui-validate-skill
  name: sprezzature-ui — SKILL.md spec gate
  description: >-
    Validates that each skill's SKILL.md frontmatter conforms to the
    Anthropic skill spec (description under 1024 chars, no XML
    brackets, no reserved name, kebab-case name) and that the skill
    folder is free of forbidden framework imports, marketing voice,
    or a recursive README.md. Pair with ``scripts/validate_all.py``
    for the bundle-wide check.
  entry: python scripts/validate_skill.py
  language: python
  language_version: python3
  files: '/?SKILL\.md$'
  pass_filenames: false
  # Every folder SKILLS.txt names, in its order. Kept honest by
  # tests/test_pre_commit_hooks.py: this list named sprezzature-vision,
  # which merged into sprezzature-accessibility, and omitted
  # sprezzature-maps — so the gate failed on a folder that was gone while
  # never reading the SKILL.md of a brick that was there.
  args: [sprezzature-ui, sprezzature-cli-gui, sprezzature-publish, sprezzature-accessibility, sprezzature-colors, sprezzature-audio, sprezzature-ux-laws, sprezzature-figures, sprezzature-maps]

- id: sprezzature-triggers-sync
  name: sprezzature — TRIGGERS.md sync check
  description: >-
    Enforce that the committed TRIGGERS.md equals the projection of
    every SKILL.md description through ``scripts/build_triggers.py``.
    Fails when a SKILL.md description's trigger phrases change
    without the generator being re-run. Auto-recoverable by running
    ``python scripts/build_triggers.py`` and re-staging.
  entry: python scripts/build_triggers.py --check
  language: python
  language_version: python3
  pass_filenames: false
  files: '(SKILL\.md|TRIGGERS\.md|scripts/build_triggers\.py)$'
  additional_dependencies:
    - PyYAML>=6

