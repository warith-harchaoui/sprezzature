  <style>
    /* Cartes « papier » : les SVG portent un fond blanc, les cartes restent donc
       claires même en thème sombre (le graphique est une feuille). */
    .fm-embed svg { display: block; width: 100%; height: auto; }
    .hit { cursor: default; }
    /* info-bulle riche qui suit le curseur */
    #fmtip { position: fixed; z-index: 60; pointer-events: none; max-width: min(320px, 90vw);
      background: #fff; color: #1f2937; border: 1px solid #e5e7eb; border-radius: 12px;
      box-shadow: 0 6px 24px rgba(20,30,40,.16); padding: .55rem .75rem; font-size: .9rem;
      font-family: Roboto, system-ui, sans-serif; }
    #fmtip[hidden] { display: none; }
    #fmtip .h { font-weight: 700; margin-bottom: .15rem; }
    #fmtip .r { color: #6b7280; line-height: 1.45; }
    /* plein écran natif + repli iOS : la carte remplit l'écran, le SVG se centre */
    [data-fs-target]:fullscreen { background: #fff; display: flex; flex-direction: column; justify-content: center; padding: 2vh 3vw; }
    [data-fs-target][data-fs-pseudo] { position: fixed; inset: 0; z-index: 70; background: #fff; display: flex; flex-direction: column; justify-content: center; padding: 2vh 3vw; overflow: auto; }
    [data-fs-target]:fullscreen .fm-embed, [data-fs-target][data-fs-pseudo] .fm-embed { max-height: 88vh; }
    [data-fs-target]:fullscreen .fm-embed svg, [data-fs-target][data-fs-pseudo] .fm-embed svg { max-height: 88vh; width: 100%; object-fit: contain; }
    .fs-locked { overflow: hidden; }
    /* Sur téléphone, chaque graphique tient dans la largeur (aperçu complet) ;
       le détail se lit en plein écran via le bouton ⤢. Pas de défilement
       latéral caché, qui laissait la moitié droite du graphique hors écran. */
    /* 🏫/🏭 : les deux jeux de panneaux (academic/corporate) sont tous deux
       écrits dans la page (build.py::_dashboard) ; seul l'un des deux est
       affiché, piloté par [data-color-mode] comme le reste du site
       (web/js/color-mode.js). Pas de re-render côté client. */
    .fm-theme-corporate { display: none; }
    [data-color-mode="corporate"] .fm-theme-corporate { display: block; }
    [data-color-mode="corporate"] .fm-theme-academic { display: none; }
  </style>
</head>
