[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature"
version = "1.6.0"
description = "The sprezzature skills: what an agent reads to know when to reach for the tools, and how the house does things."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [{name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"}]
keywords = ["skills", "claude", "opencode", "agent", "sprezzature"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Documentation",
]
dependencies = []

[project.optional-dependencies]
# The tools the skills call. Each installs on its own; this pulls the lot.
all = [
    "sprezzature-figures>=2.7.0",
    # 1.1.0, not 1.0.1: before it, `sprezzature-colors` was not a command —
    # only `sprezzature-colors-contrast` and its three siblings were — and
    # this repository's own SKILL.md tells an agent the tools are "invoked as
    # `sprezzature-colors …`". The floor is what makes that sentence true.
    "sprezzature-colors>=1.1.0",
    # 1.2.0 for the same reason as colors and ux-laws: before it,
    # `sprezzature-accessibility` was not a command — only
    # `sprezzature-accessibility-lint` and its siblings were — while this
    # repository's SKILL.md named it. The floor is what makes that true.
    "sprezzature-accessibility>=1.2.0",
    "sprezzature-audio>=1.4.0",
    "sprezzature-cli-gui>=1.2.0",
    # 1.2.0 for the same reason: `sprezzature-ux-laws` itself only became a
    # command there (1.1.0 installed `sprezzature-ux-laws-audit` alone), and
    # it is the version that first exposed a library surface at all.
    "sprezzature-ux-laws>=1.2.0",
    "sprezzature-maps>=1.0.0",
    # The last two to reach PyPI, on 2026-10-19. Until then `all` installed
    # eight ninths of the suite under a name that promised all of it — the
    # omission was deliberate and documented, which made it defensible and
    # not correct.
    "sprezzature-publish>=1.2.0",
    "sprezzature-ui>=1.0.0",
]
dev = ["pytest>=8.0", "ruff"]

[project.urls]
Homepage = "https://sprezzature.ai"
Repository = "https://github.com/warith-harchaoui/sprezzature"

[project.scripts]
sprezzature-skills = "sprezzature.cli:main"

[tool.setuptools]
packages = ["sprezzature", "sprezzature.skills.sprezzature_ui", "sprezzature.skills.sprezzature_cli_gui", "sprezzature.skills.sprezzature_publish", "sprezzature.skills.sprezzature_accessibility", "sprezzature.skills.sprezzature_colors", "sprezzature.skills.sprezzature_audio", "sprezzature.skills.sprezzature_ux_laws", "sprezzature.skills.sprezzature_figures", "sprezzature.skills.sprezzature_maps"]

[tool.setuptools.package-dir]
"sprezzature.skills.sprezzature_ui" = "sprezzature-ui"
"sprezzature.skills.sprezzature_cli_gui" = "sprezzature-cli-gui"
"sprezzature.skills.sprezzature_publish" = "sprezzature-publish"
"sprezzature.skills.sprezzature_accessibility" = "sprezzature-accessibility"
"sprezzature.skills.sprezzature_colors" = "sprezzature-colors"
"sprezzature.skills.sprezzature_audio" = "sprezzature-audio"
"sprezzature.skills.sprezzature_ux_laws" = "sprezzature-ux-laws"
"sprezzature.skills.sprezzature_figures" = "sprezzature-figures"
"sprezzature.skills.sprezzature_maps" = "sprezzature-maps"

[tool.setuptools.package-data]
"sprezzature.skills.sprezzature_ui" = ["**/*"]
"sprezzature.skills.sprezzature_cli_gui" = ["**/*"]
"sprezzature.skills.sprezzature_publish" = ["**/*"]
"sprezzature.skills.sprezzature_accessibility" = ["**/*"]
"sprezzature.skills.sprezzature_colors" = ["**/*"]
"sprezzature.skills.sprezzature_audio" = ["**/*"]
"sprezzature.skills.sprezzature_ux_laws" = ["**/*"]
"sprezzature.skills.sprezzature_figures" = ["**/*"]
"sprezzature.skills.sprezzature_maps" = ["**/*"]

[tool.setuptools.exclude-package-data]
# The rendered gallery is 74 MB of PNG and SVG that belongs on the website,
# not in a skill an agent reads.
"*" = ["assets/**", "**/__pycache__/**", "**/*.pyc"]
