[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature"
version = "1.8.2"
description = "The sprezzature skills: what an agent reads to know when to reach for the tools, and how the house does things."
readme = "README.md"
# `<3.14` since 2026-11-01, when the extras were folded into the base. The
# ceiling is not this package's own: it arrives through base dependencies that
# declare it at the versions named below. While they sat behind an extra the
# base resolved on 3.14 and a reader who installed nothing optional was not
# refused the interpreter; one `pip install` means the ceiling is the
# package's, so the package declares it rather than handing out
# `ERROR: Could not find a version that satisfies the requirement`.
#
# The hub's own guard dictated this edit, by name and with the fix:
# tests/test_no_brick_promises_a_python_its_dependencies_exclude.py.
requires-python = ">=3.10,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [{name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"}]
keywords = ["skills", "claude", "opencode", "agent", "sprezzature"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Documentation",
]
dependencies = [

    # ------------------------------------------------- une seule installation
    # Folded in from the extras on 2026-11-01. The base was 0
    # dependencies, so `pip install sprezzature` installed almost nothing and
    # did almost nothing: choosing the right extra was a thing a reader had to
    # know before the package could do its job. Across the suite that was 59
    # extras over eleven repositories, six of them with a base of one.
    #
    # The surfaces are not features and they are not optional any more: the
    # HTTP app and the MCP server are two of this package's five front doors,
    # and a door you have to install separately is a door people do not find.
    "sprezzature-figures>=2.9.2",
    "sprezzature-colors>=1.2.3",
    "sprezzature-accessibility>=1.4.3",
    "sprezzature-audio>=1.10.3",
    "sprezzature-cli-gui>=1.5.2",
    "sprezzature-ux-laws>=1.4.2",
    "sprezzature-maps>=1.1.3",
    "sprezzature-video>=0.4.4",
    "sprezzature-publish>=1.5.1",
    "sprezzature-ui>=1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff"]

[project.urls]
Homepage = "https://sprezzature.ai"
Repository = "https://github.com/warith-harchaoui/sprezzature"

[project.scripts]
sprezzature-skills = "sprezzature.cli:main"

[tool.setuptools]
packages = ["sprezzature", "sprezzature.skills.sprezzature_ui", "sprezzature.skills.sprezzature_cli_gui", "sprezzature.skills.sprezzature_publish", "sprezzature.skills.sprezzature_accessibility", "sprezzature.skills.sprezzature_colors", "sprezzature.skills.sprezzature_audio", "sprezzature.skills.sprezzature_ux_laws", "sprezzature.skills.sprezzature_figures", "sprezzature.skills.sprezzature_maps", "sprezzature.skills.sprezzature_video"]

[tool.setuptools.package-dir]
"sprezzature.skills.sprezzature_ui" = "sprezzature-ui"
"sprezzature.skills.sprezzature_cli_gui" = "sprezzature-cli-gui"
"sprezzature.skills.sprezzature_publish" = "sprezzature-publish"
"sprezzature.skills.sprezzature_accessibility" = "sprezzature-accessibility"
"sprezzature.skills.sprezzature_colors" = "sprezzature-colors"
"sprezzature.skills.sprezzature_audio" = "sprezzature-audio"
"sprezzature.skills.sprezzature_ux_laws" = "sprezzature-ux-laws"
"sprezzature.skills.sprezzature_figures" = "sprezzature-figures"
"sprezzature.skills.sprezzature_maps" = "sprezzature-maps"
"sprezzature.skills.sprezzature_video" = "sprezzature-video"

[tool.setuptools.package-data]
"sprezzature.skills.sprezzature_ui" = ["**/*"]
"sprezzature.skills.sprezzature_cli_gui" = ["**/*"]
"sprezzature.skills.sprezzature_publish" = ["**/*"]
"sprezzature.skills.sprezzature_accessibility" = ["**/*"]
"sprezzature.skills.sprezzature_colors" = ["**/*"]
"sprezzature.skills.sprezzature_audio" = ["**/*"]
"sprezzature.skills.sprezzature_ux_laws" = ["**/*"]
"sprezzature.skills.sprezzature_figures" = ["**/*"]
"sprezzature.skills.sprezzature_maps" = ["**/*"]
"sprezzature.skills.sprezzature_video" = ["**/*"]

[tool.setuptools.exclude-package-data]
# The rendered gallery is 74 MB of PNG and SVG that belongs on the website,
# not in a skill an agent reads.
"*" = ["assets/**", "**/__pycache__/**", "**/*.pyc"]
