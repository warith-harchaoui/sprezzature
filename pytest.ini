[pytest]
# Test discovery and runtime config for the front skill.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# No ``-m "not eval"`` any more, and no ``eval`` marker: the LLM-output
# quality suite left with its bricks when the monorepo was split, and lives
# in sprezzature-accessibility and sprezzature-publish now. Deselecting a
# marker nothing carries described something absent — and the CI step built
# on it returned exit 5, "no tests collected", which it read as a failure.
#
# ``--strict-markers`` stays, and is what makes removing the declaration
# safe: a stray ``@pytest.mark.eval`` arriving here would now say so loudly
# rather than being silently deselected.
# No `-q` here, on purpose. `-q` in `addopts` plus the `-q` a human types --
# or the one the pre-push hook passes -- is `-qq`, and at that verbosity pytest
# drops its last line: the run ends on the progress bar with no "N passed" at
# all. Four of the ten repositories were in that state, so `pytest -q` gave a
# verdict in six of them and a silence in four. Failures still printed, so
# nothing was ever wrong; a run that will not say what it did is still the
# wrong default for a suite whose whole argument is that a check must speak.
addopts = -ra --strict-markers
markers =
    network: marks tests that require network access (deselect with '-m "not network"')
    slow: marks tests that take noticeable time to run
