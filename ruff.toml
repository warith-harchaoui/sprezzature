# ruff.toml — lint gate for the sprezzature-* skill scripts (CODING_ALL.md rule 3).
#
# This is the AUDIT side of the make/audit paradigm the skills themselves follow:
#   audit  →  `ruff check .`         (blocking, wired into CI — flags defects)
#   make   →  `ruff check --fix .`   (repairs the auto-fixable subset in place)
#            + `ruff format .`        (formatting; not enforced as a gate yet)
#
# Implicit re-exports (a script surfacing a helper for its tests, e.g.
# `relative_luminance` from `_colors`) are declared with the PEP 484 redundant
# alias form `name as name`, which ruff treats as an explicit re-export — so
# `--fix` never deletes a live re-export (the trap that made a blanket --fix
# unsafe before this config existed).

target-version = "py310"

[lint]
# Pyflakes F plus the curated pycodestyle E/W subset — written out rather
# than inherited from ruff's defaults. The defaults are not a fixed set: the
# 0.16 line widened them to pull in isort, pyupgrade, flake8-comprehensions
# and more, which turned this gate from "all checks passed" into 515 findings
# across the monorepo without a line of code changing. Pinning the tool to
# `<0.16` hid that but left the gate meaning whatever the installed ruff
# thought it meant. Naming the rules makes it mean the same thing everywhere,
# and makes widening it a decision someone takes on purpose.
select = ["E4", "E7", "E9", "F", "W"]

ignore = [
    # E741 — "ambiguous variable name l/I/O". Intentional here: `l` is the
    # OKLab *lightness* channel in sprezzature-colors' colour math (Ottosson's spec
    # names it `l`), and a conventional line variable elsewhere. Renaming it
    # would reduce, not improve, readability in the numerical code.
    "E741",
]
