<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="arc-title arc-desc"><title id="arc-title">One researcher holds two research groups together</title><desc id="arc-desc">Arc diagram of co-authorship in a research lab. Eleven researchers sit on one horizontal line, ordered so the Vision group clusters on the left and the Language group on the right. Each co-authored pairing is an arc rising above the line, its thickness proportional to the number of joint papers. Both groups collaborate densely inside themselves, drawing short low arcs. Only Nadia, in the centre, co-authors with people in both groups: her two long arcs sweeping across the diagram are the single bridge linking the two communities.</desc><style>.arc{transition:stroke-opacity .18s ease,stroke-width .18s ease}#arcs:hover .arc{stroke-opacity:.12}#arcs .arc:hover,#arcs .arc:focus{stroke-opacity:1;stroke-width:9}.arc:focus,.node:focus{outline:none}@media (prefers-contrast: more){
  .arc-vision{stroke:#004CCE;}
  .arc-language{stroke:#993600;}
  .arc-bridge{stroke:#831FAF;}
  .arc{stroke-opacity:1 !important;}
}@media (prefers-contrast: more){
  .node-vision{fill:#004CCE;}
  .node-language{fill:#993600;}
  .node-bridge{fill:#831FAF;}
}@media (forced-colors: active){
  .arc{stroke:CanvasText;}
  .node{fill:CanvasText;}
}@media (prefers-color-scheme: dark){
  [fill="#FFFFFF"]{fill:#0B0B0C;}
  [fill="#1D1D1F"]{fill:#F2F2F7;}
  [fill="#6E6E73"]{fill:#9C9CA3;}
  [style*="multiply"]{mix-blend-mode:screen;}
