<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1066" viewBox="0 0 1280 1066" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="db-title db-desc">
<title id="db-title">Gender pay gap by role: men out-earn women in every job family</title>
<desc id="db-desc">Dumbbell plot of median hourly pay for women (purple) and men (teal) across 10 roles, sorted by the size of the gap. Each row joins the two medians with a segment whose length is the gap. Men earn more in every role; the gap averages 11% and is widest for Sales director at $13 per hour. Illustrative data.</desc>
<style>.row{cursor:pointer}.row .seg{stroke:#6E6E73;stroke-width:5;stroke-linecap:round}.row:hover .rowbg,.row:focus .rowbg{fill:#F0F0F2}.row:hover .seg,.row:focus .seg{stroke:#1D1D1F}.row:hover .dot,.row:focus .dot{stroke:#1D1D1F;stroke-width:2}.row:focus{outline:none}@media (prefers-contrast: more){
  .mk-women{fill:#831FAF;}
}
@media (forced-colors: active){
  .mk-women{fill:CanvasText;}
}@media (prefers-contrast: more){
  .mk-men{fill:#005E8B;}
}
@media (forced-colors: active){
  .mk-men{fill:CanvasText;}
}@media (prefers-color-scheme: dark){
  [fill="#FFFFFF"]{fill:#0B0B0C;}
  [fill="#1D1D1F"]{fill:#F2F2F7;}
  [fill="#6E6E73"]{fill:#9C9CA3;}
  [style*="multiply"]{mix-blend-mode:screen;}
}</style>
