<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="gauge-title gauge-desc"><title id="gauge-title">Web-server CPU load is running hot at the traffic peak</title><desc id="gauge-desc">Radial gauge of web-server CPU load, scaled 0 to 100 percent of capacity across four named zones: Healthy, Busy, Hot, Critical. The needle points to 72 percent, inside the Busy zone.</desc><rect width="1200" height="860" fill="#FFFFFF"/><text x="70" y="82" font-size="34" font-weight="700" fill="#1D1D1F">Web-server CPU load is running hot at the traffic peak</text><text x="70" y="120" font-size="20" fill="#6E6E73">app-07 · 12:40 UTC · 1-minute average · illustrative reading</text><path d="M340.19,710.00 A300.00,300.00 0 1 1 859.81,710.00" fill="none" stroke="#ECECEF" stroke-width="46" stroke-linecap="round"/><style>@media (prefers-contrast: more){
