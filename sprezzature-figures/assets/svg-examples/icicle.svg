<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="ice-t ice-d">
<title id="ice-t">One slow SQL query eats 45% of every checkout</title>
<desc id="ice-d">Icicle / flame graph of one GET /api/checkout request totalling 480 milliseconds. The root bar spans the full width; each row below splits its parent by time. The highlighted warm tower load_cart to fetch_user_orders to run_sql to wait_on_lock is the critical path: wait_on_lock alone is 176 ms, about 37 percent of the request, and run_sql as a whole is 214 ms, about 45 percent. Off-path calls (authenticate, render_response) are shown in muted grey.</desc>
<style>.bar{transition:transform .16s ease, filter .16s ease;transform-box:fill-box;transform-origin:center;cursor:pointer;}.bar:hover,.bar:focus{filter:brightness(1.07);transform:scaleY(1.04);outline:none;}.bar:focus{stroke:#1D1D1F;stroke-width:2.5;}@media (prefers-reduced-motion: reduce){.bar{transition:none;}.bar:hover,.bar:focus{transform:none;}}@media (prefers-contrast: more){.bar{stroke:#1D1D1F;stroke-width:1.6;}[stroke="#E5E5EA"]{stroke:#1D1D1F;stroke-width:1.4;}[fill="#6E6E73"]{fill:#1D1D1F;}}@media (forced-colors: active){.bar{stroke:CanvasText;stroke-width:1.4;forced-color-adjust:auto;}}@media (prefers-color-scheme: dark){
  [fill="#FFFFFF"]{fill:#0B0B0C;}
  [fill="#1D1D1F"]{fill:#F2F2F7;}
  [fill="#6E6E73"]{fill:#9C9CA3;}
  [style*="multiply"]{mix-blend-mode:screen;}
  [stroke="#E5E5EA"]{stroke:#3A3A3E;}[fill="#9A9AA0"]{fill:#8B8B92;}.bar:focus{stroke:#F2F2F7;}
}</style>
