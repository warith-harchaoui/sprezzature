<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="mosaic-t mosaic-d">
<title id="mosaic-t">On phones, wallets have overtaken cards</title>
<desc id="mosaic-d">Marimekko mosaic: column widths are each device's share of all online checkouts (Mobile widest at 54 percent), and each column stacks payment methods by their within-device share. On Mobile, Wallet is the tallest segment, overtaking Card.</desc>
<style>.tile{transition:transform .18s ease, filter .18s ease;transform-box:fill-box;transform-origin:center;}.tile:hover,.tile:focus{filter:brightness(1.06);transform:scale(1.015);outline:none;}.tile:focus{stroke:#1D1D1F;stroke-width:2;}@media (prefers-reduced-motion: reduce){.tile{transition:none;}.tile:hover,.tile:focus{transform:none;}}@media (prefers-contrast: more){
  .tile-wallet{fill:#004CCE;}
  .tile-card{fill:#005E8B;}
  .tile-buy-now-pay-later{fill:#993600;}
  .tile-bank-transfer{fill:#585858;}
}@media (forced-colors: active){
  .tile-wallet{fill:url(#mos-fcp-0);forced-color-adjust:none;}
  .tile-card{fill:url(#mos-fcp-1);forced-color-adjust:none;}
  .tile-buy-now-pay-later{fill:url(#mos-fcp-2);forced-color-adjust:none;}
  .tile-bank-transfer{fill:url(#mos-fcp-3);forced-color-adjust:none;}
}@media (prefers-color-scheme: dark){
  [fill="#FFFFFF"]{fill:#0B0B0C;}
  [fill="#1D1D1F"]{fill:#F2F2F7;}
  [fill="#6E6E73"]{fill:#9C9CA3;}
  [style*="multiply"]{mix-blend-mode:screen;}
  [stroke="#E5E5EA"]{stroke:#3A3A3E;}.tile:focus{stroke:#F2F2F7;}
}</style>
<defs><pattern id="mos-fcp-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="Canvas"/><path d="M0,8L8,0" stroke="CanvasText" stroke-width="1.6"/></pattern><pattern id="mos-fcp-1" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="Canvas"/><path d="M0,0L8,8" stroke="CanvasText" stroke-width="1.6"/></pattern><pattern id="mos-fcp-2" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="Canvas"/><path d="M0,4L8,4" stroke="CanvasText" stroke-width="1.6"/></pattern><pattern id="mos-fcp-3" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="Canvas"/><path d="M4,0L4,8" stroke="CanvasText" stroke-width="1.6"/></pattern></defs>
