<text x="96" y="102" font-size="20" fill="#6E6E73">Share of online-store checkouts by device and payment method - illustrative quarter</text>
<text x="34" y="476" font-size="18" fill="#6E6E73" text-anchor="middle" transform="rotate(-90 34 476)">Share within device</text>
<text x="78" y="222" font-size="15" fill="#6E6E73" text-anchor="end" font-family="Roboto Mono, monospace">0%</text>
