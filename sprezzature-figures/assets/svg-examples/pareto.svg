<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="pa-title pa-desc">
<title id="pa-title">A few support-ticket reasons drive most of the weekly backlog</title>
<desc id="pa-desc">Pareto chart of one week of customer-support tickets (1,205 total, illustrative). Bars show each reason’s share of tickets, sorted tallest-first against the left percentage axis; the 4 tallest are tinted blue as the “vital few” and the remaining 5 fade to grey as the “trivial many”. An orange line traces the cumulative share against the right percentage axis, climbing to 100 %. The dashed 80 % Pareto line marks the 80/20 threshold: the cumulative curve first clears it at reason 4, so 4 reasons account for 82 % of tickets (991 of 1,205). Illustrative figures.</desc>
<style>.bar{cursor:pointer}.bar rect{transition:opacity .12s}.bar:hover rect,.bar:focus rect{opacity:.82}.bar:focus{outline:none}.pt{cursor:pointer}.pt .halo{opacity:0}.pt:hover .halo,.pt:focus .halo{opacity:1}.pt:focus{outline:none}@media (prefers-contrast: more){
  .pa-vital{fill:#004CCE;}
}@media (prefers-contrast: more){
  .pa-line{fill:#993600;stroke:#993600;}
}@media (prefers-color-scheme: dark){
  [fill="#FFFFFF"]{fill:#0B0B0C;}
  [fill="#1D1D1F"]{fill:#F2F2F7;}
  [fill="#6E6E73"]{fill:#9C9CA3;}
  [style*="multiply"]{mix-blend-mode:screen;}
  [fill="#F5F5F7"]{fill:#17171A;}.pa-grid{stroke:#2C2C30;}
}</style>
