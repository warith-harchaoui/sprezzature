<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1040" viewBox="0 0 980 1040" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="polar-title polar-desc"><title id="polar-title">The city breathes twice a day</title><desc id="polar-desc">Polar clock plot of bike-share departures by hour of day, running clockwise from midnight at the top. Departures are lowest overnight, rise to a sharp morning peak near 8 a.m., dip at midday, then climb to the day's tallest peak near 6 p.m. before falling into the night.</desc><style>
