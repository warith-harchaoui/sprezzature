<svg xmlns="http://www.w3.org/2000/svg" width="1058" height="700" viewBox="0 0 1058 700" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="up-title up-desc">
<title id="up-title">How many users each combination of contact channels reaches</title>
<desc id="up-desc">UpSet plot. Top: a bar chart of intersection sizes, one bar per observed combination of reach channels, sorted largest first. Below each bar, a dot matrix marks which of the four channels (Email, Mobile app, Web app, SMS) that combination includes; dots in a column are joined by a line. Left: a bar chart of each channel's total reach. The largest single pocket is users reachable only by Email (62k).</desc>
<style>
.ibar,.dotcol,.conn{transition:opacity .18s ease}
svg:hover .combo,svg:focus-within .combo{opacity:.3}
.combo:hover,.combo:focus,.combo:focus-within{opacity:1!important}
.combo:focus{outline:none}
.hit{cursor:pointer;fill:transparent}
.hit:focus{outline:3px solid #0A4DA0;outline-offset:2px}
@media (prefers-contrast: more){
  .isize{fill:#004CCE;}
}
@media (prefers-contrast: more){
  .setbar{fill:#831FAF;}
  .activedot{fill:#831FAF;}
}
@media (prefers-contrast: more){
  .conn{stroke:#831FAF;}
}
@media (prefers-color-scheme: dark){
  [fill="#FFFFFF"]{fill:#0B0B0C;}
  [fill="#1D1D1F"]{fill:#F2F2F7;}
  [fill="#6E6E73"]{fill:#9C9CA3;}
  [fill="#D6D6DB"]{fill:#3A3A3C;} [fill="#F5F5F7"]{fill:#1A1A1C;}
}
</style>
<rect width="1058" height="700" fill="#FFFFFF"/>
<text x="48" y="52" font-size="28" font-weight="700" fill="#1D1D1F">Most reachable users live on a single channel</text>
