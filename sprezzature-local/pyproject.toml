[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-local"
version = "0.1.0"
description = "Offline runtime for the sprezzature skills: pluggable LLM backend, Ralph loop, and writing charter enforcement — no cloud API required."
readme = "EXAMPLES.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "Warith Harchaoui", email = "warith.harchaoui@gmail.com" }]
keywords = ["sprezzature", "local", "llm", "ollama", "ralph", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/warith-harchaoui/sprezzature"
Repository = "https://github.com/warith-harchaoui/sprezzature"
Changelog = "https://github.com/warith-harchaoui/sprezzature/blob/main/CHANGELOG.md"
Issues = "https://github.com/warith-harchaoui/sprezzature/issues"

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.2",
    "langchain-ollama>=0.1",
    "langchain-openai>=0.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
sprezzature-local = "sprezzature_local.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sprezzature_local*"]
