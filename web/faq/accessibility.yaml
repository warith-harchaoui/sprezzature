en:
- q: How do I install sprezzature-accessibility?
  a: 'Run `pip install sprezzature-accessibility` (Python 3.10 to 3.13): one line installs the linter, the alt-text drafter, the API (Application Programming Interface, web addresses another program sends a request to and gets an answer from) served over HTTP (HyperText Transfer Protocol, the way a browser asks a server for a page), and the MCP (Model Context Protocol, the protocol through which AI agents call tools in English) server, with no extras to choose. To use it as an agent skill, `pip install sprezzature` then `sprezzature-skills --install` (or `sprezzature-skills --install --agent opencode`).'
- q: What does sprezzature-accessibility check?
  a: 'sprezzature-accessibility applies twenty rules decidable from the HTML source alone: missing alt text, unlabelled inputs, empty links and buttons, clickable div elements with no keyboard access, dialogs with no close, a missing `lang`, skipped heading levels, status shown by colour alone, animation with no reduced-motion guard, tight letter-spacing, and missing captions, transcripts or controls on video and audio. Six of the rules also have a mechanical repair, applied with `--fix`.'
- q: How is sprezzature-accessibility different from axe-core, Pa11y or Lighthouse?
  a: 'sprezzature-accessibility reads the HTML source without opening a browser, so it runs in milliseconds and gives the same answer every time, but it cannot see what only exists once a page renders: focus order, screen-reader timing, contrast against a real background. axe-core, Pa11y and Lighthouse drive a real browser and catch that layer; use this one as the fast first gate and one of them as the second pass, not as a replacement.'
- q: Can sprezzature-accessibility write the missing alt text?
  a: 'Yes: sprezzature-accessibility drafts the missing alt text with `sprezzature-accessibility-lint --fix-alt public/`, from each image and the text around it on the same page, in the page''s language or the one set by `--alt-lang`; `sprezzature-accessibility-alt photo.jpg` does a single image. This half needs Ollama and the `qwen3-vl:8b` vision model, set up by `sprezzature-accessibility-install-alt`, while the linter needs no browser and no model. Each draft should be read by a person before it is committed.'
- q: Does sprezzature-accessibility send my pages or images to a cloud service?
  a: 'No: sprezzature-accessibility''s linter keeps everything on your machine and calls no model at all; only the alt-text drafter (`--fix-alt`, `sprezzature-accessibility-alt`) calls a vision model, served by Ollama on your own machine unless you point `OLLAMA_URL` elsewhere. The HTTP API lints a string of HTML and never fetches a URL.'
- q: Can I run sprezzature-accessibility in CI or a pre-commit hook?
  a: 'Yes: `sprezzature-accessibility-lint public/` lints every `.html` file under the folder and exits 1 on any finding, warnings included, and 0 on a clean run, with `--format json` for a CI parser and `--ignore` to skip named rules. For a hook, `pip install --no-deps sprezzature-accessibility` plus `pip install click` is enough to run the lint.'
- q: Can I use sprezzature-accessibility without Claude Code?
  a: 'Yes: sprezzature-accessibility is a Python library (`import sprezzature_accessibility`), a command line (`sprezzature-accessibility`, one command per tool), an HTTP API with a Docker image, and an MCP server, `sprezzature-accessibility-mcp`, for any MCP client. The Docker image runs that server, so one port answers both the HTTP routes and `/mcp`.'
- q: Is sprezzature-accessibility free?
  a: 'Yes: sprezzature-accessibility is open source under the BSD (Berkeley Software Distribution, a University of California licence that lets anyone use, change or sell the code as long as the copyright notice stays) 3-Clause licence, with no account, API key or paid tier, and the source is on [GitHub](https://github.com/warith-harchaoui/sprezzature-accessibility).'
fr:
- q: Comment installer sprezzature-accessibility ?
  a: 'Lancez `pip install sprezzature-accessibility` (Python 3.10 à 3.13) : une ligne installe le linter, le rédacteur de texte alternatif, l''API (Application Programming Interface, la porte où frappent les autres programmes : un script envoie ses chiffres et reçoit une réponse) servie en HTTP (HyperText Transfer Protocol, le protocole par lequel un navigateur demande une page à un serveur) et le serveur MCP (Model Context Protocol, le protocole par lequel les agents IA appellent des outils en français), sans option à choisir. Pour s''en servir comme skill, `pip install sprezzature` puis `sprezzature-skills --install` (ou `sprezzature-skills --install --agent opencode`).'
- q: Que vérifie sprezzature-accessibility ?
  a: 'sprezzature-accessibility applique vingt règles décidables à la seule lecture du HTML : texte alternatif manquant, champs sans étiquette, liens et boutons vides, div cliquables hors de portée du clavier, dialogues sans fermeture, `lang` absent, niveaux de titres sautés, état signalé par la seule couleur, animation sans garde de mouvement réduit, interlettrage serré, et sous-titres, transcriptions ou contrôles manquants sur la vidéo et l''audio. Six règles ont aussi une réparation mécanique, appliquée par `--fix`.'
- q: En quoi sprezzature-accessibility diffère-t-il d'axe-core, Pa11y ou Lighthouse ?
  a: 'sprezzature-accessibility lit le source HTML sans ouvrir de navigateur : il tourne en quelques millisecondes et rend toujours la même réponse, mais il ne voit pas ce qui n''existe qu''une fois la page rendue, comme l''ordre du focus, le moment des annonces du lecteur d''écran ou le contraste sur un vrai fond. axe-core, Pa11y et Lighthouse pilotent un vrai navigateur et couvrent cette couche ; employez celui-ci comme premier filtre rapide et l''un d''eux en second passage, pas comme remplaçant.'
- q: sprezzature-accessibility peut-il écrire le texte alternatif manquant ?
  a: 'Oui : sprezzature-accessibility rédige les textes alternatifs manquants avec `sprezzature-accessibility-lint --fix-alt public/`, à partir de chaque image et du texte qui l''entoure dans la page, dans la langue de la page ou celle de `--alt-lang` ; `sprezzature-accessibility-alt photo.jpg` traite une seule image. Cette moitié demande Ollama et le modèle de vision `qwen3-vl:8b`, installé par `sprezzature-accessibility-install-alt`, alors que le linter n''a besoin ni de navigateur ni de modèle. Une personne relit chaque brouillon avant de le committer.'
- q: sprezzature-accessibility envoie-t-il mes pages ou mes images à un service cloud ?
  a: 'Non : le linter de sprezzature-accessibility ne fait rien sortir de votre machine et n''appelle aucun modèle ; seul le rédacteur de texte alternatif (`--fix-alt`, `sprezzature-accessibility-alt`) appelle un modèle de vision, servi par Ollama sur votre propre machine, sauf si `OLLAMA_URL` désigne une autre adresse. L''API HTTP analyse une chaîne de HTML et ne va jamais chercher d''URL.'
- q: Peut-on lancer sprezzature-accessibility en CI ou dans un hook pre-commit ?
  a: 'Oui : `sprezzature-accessibility-lint public/` analyse chaque fichier `.html` du dossier et sort avec le code 1 au moindre constat, avertissements compris, et 0 sur une page propre, avec `--format json` pour une CI et `--ignore` pour écarter des règles nommées. Pour un hook, `pip install --no-deps sprezzature-accessibility` plus `pip install click` suffisent à faire tourner le linter.'
- q: Peut-on utiliser sprezzature-accessibility sans Claude Code ?
  a: 'Oui : sprezzature-accessibility est une bibliothèque Python (`import sprezzature_accessibility`), une ligne de commande (`sprezzature-accessibility`, une commande par outil), une API HTTP avec image Docker et un serveur MCP, `sprezzature-accessibility-mcp`, pour tout client MCP. L''image Docker lance ce serveur : un même port répond aux routes HTTP et à `/mcp`.'
- q: sprezzature-accessibility est-il gratuit ?
  a: 'Oui : sprezzature-accessibility est open source sous licence BSD (Berkeley Software Distribution, une licence née à l''université de Berkeley : chacun peut réutiliser le code, même pour le vendre, en citant l''auteur), version 3-Clause, sans compte, sans clé d''API ni offre payante, et le code est sur [GitHub](https://github.com/warith-harchaoui/sprezzature-accessibility).'
