en:
- q: How do I install sprezzature-audio?
  a: 'Run `pip install sprezzature-audio` (Python 3.10 to 3.13): captions, diarization, speaker identification, translation, narration, an API (Application Programming Interface, web addresses another program sends a request to and gets an answer from) served over HTTP (HyperText Transfer Protocol, the way a browser asks a server for a page) and an MCP (Model Context Protocol, the protocol through which AI agents call tools in English) server all come with it, with no extra to choose. The install includes torch, but `import sprezzature_audio` loads no model until a model-backed function is called.'
- q: What does sprezzature-audio need besides pip?
  a: sprezzature-audio needs ffmpeg and espeak-ng (for the Kokoro voice) on the system, plus model weights fetched on first use or ahead of time with `sprezzature-audio-install` (Whisper), `sprezzature-audio-install-diarize --no-install` (NeMo Sortformer and TitaNet) and `sprezzature-audio-install-voice` (the voices). Translation and the optional name-guessing pass also need an Ollama server serving `qwen3-vl:8b`. The caption audit, the speaker merge and the WER (word error rate, the share of words a transcript gets wrong) and DER (diarization error rate, the share of speaking time credited to the wrong speaker) metrics need none of this.
- q: Does sprezzature-audio send my audio to a cloud service?
  a: 'No: sprezzature-audio transcribes with whisper.cpp, finds and names speakers with NeMo models and synthesises voices on your own machine, with no API key. Translation and name guessing call the Ollama server named by `--url`, on `localhost` by default, and the only downloads are the model weights.'
- q: Which voices and languages does sprezzature-audio support?
  a: 'sprezzature-audio narrates with three engines from speaker-helper: Kokoro (54 built-in voices, in English, Spanish, French, Hindi, Italian, Japanese, Portuguese and Mandarin), Chatterbox, and OpenVoice, which clones a voice from a short sample. With no `--voice`, the language is detected from the text and a voice that speaks it is picked; a page narrated by sprezzature-publish gets the engine speaker-helper''s router chooses, Chatterbox for an offline run. Captions cover the languages Whisper recognises, detected when `--lang` is empty.'
- q: Can I use sprezzature-audio without Claude Code?
  a: 'Yes: sprezzature-audio is also a Python library, fifteen commands behind the front door `sprezzature-audio`, an HTTP API with a Docker image, and an MCP server, `sprezzature-audio-mcp`, serving the API and `/mcp` on one port. The API and MCP tools cover the fast, model-free half (caption conversion, speaker merge, WER, DER); transcription and narration run as commands. The skill itself comes from `pip install sprezzature` then `sprezzature-skills --install`.'
- q: How is sprezzature-audio different from the Whisper API, pyannote or ElevenLabs?
  a: sprezzature-audio runs locally and works both ways, speech to timed text and text to timed speech, each landing beside a WebVTT, and it then audits the caption track for reading speed, width, duration and overlap. Hosted services such as ElevenLabs or the OpenAI audio API bill per use and receive your audio; pyannote has no ceiling on the number of speakers, whereas the Sortformer checkpoint used here is built for up to four.
- q: Can I run sprezzature-audio in CI?
  a: 'Yes: `sprezzature-audio-audit talk.vtt` checks a caption track against the Netflix Timed Text Style Guide defaults (17 characters a second, 42 a line, two lines), needs only the Python standard library, prints JSON (JavaScript Object Notation, a text format in which programs store data as named fields, like {"name": "Ada"}) with `--format json` and exits 1 on any finding. Transcription, diarization and narration also run headless, but they download large model weights, so a CI job usually audits tracks rather than producing them.'
- q: Is sprezzature-audio free?
  a: 'Yes: sprezzature-audio is open source under the BSD (Berkeley Software Distribution, a University of California licence that lets anyone use, change or sell the code as long as the copyright notice stays) 3-Clause licence, with no account, API key or paid tier, and its source is on [GitHub](https://github.com/warith-harchaoui/sprezzature-audio). The models it runs are open weights downloaded to your machine, each under its own licence.'
fr:
- q: Comment installer sprezzature-audio ?
  a: 'Lancez `pip install sprezzature-audio` (Python 3.10 à 3.13) : sous-titres, diarisation, identification des locuteurs, traduction, narration, une API (Application Programming Interface, la porte où frappent les autres programmes : un script envoie ses chiffres et reçoit une réponse) servie en HTTP (HyperText Transfer Protocol, le protocole par lequel un navigateur demande une page à un serveur) et un serveur MCP (Model Context Protocol, le protocole par lequel les agents IA appellent des outils en français) arrivent ensemble, sans option à choisir. L''installation comprend torch, mais `import sprezzature_audio` ne charge aucun modèle tant qu''aucune fonction qui en a besoin n''est appelée.'
- q: De quoi sprezzature-audio a-t-il besoin en plus de pip ?
  a: 'sprezzature-audio demande ffmpeg et espeak-ng (pour la voix Kokoro) sur le système, ainsi que des poids de modèles, téléchargés au premier usage ou à l''avance avec `sprezzature-audio-install` (Whisper), `sprezzature-audio-install-diarize --no-install` (NeMo Sortformer et TitaNet) et `sprezzature-audio-install-voice` (les voix). La traduction et la passe facultative qui devine les noms veulent en plus un serveur Ollama qui sert `qwen3-vl:8b`. L''audit des sous-titres, la fusion des locuteurs et les mesures WER (word error rate, la part des mots qu''une transcription a ratés ou inventés) et DER (diarization error rate, la part du temps attribuée au mauvais locuteur) se passent de tout cela.'
- q: sprezzature-audio envoie-t-il mon audio vers un service cloud ?
  a: 'Non : sprezzature-audio transcrit avec whisper.cpp, repère et nomme les locuteurs avec des modèles NeMo et synthétise les voix sur votre machine, sans clé d''API. La traduction et la devinette des noms appellent le serveur Ollama désigné par `--url`, sur `localhost` par défaut, et les seuls téléchargements sont les poids des modèles.'
- q: Quelles voix et quelles langues sprezzature-audio prend-il en charge ?
  a: 'sprezzature-audio narre avec trois moteurs fournis par speaker-helper : Kokoro (54 voix intégrées, en anglais, espagnol, français, hindi, italien, japonais, portugais et mandarin), Chatterbox, et OpenVoice, qui clone une voix à partir d''un court échantillon. Sans `--voice`, la langue est détectée dans le texte et une voix qui la parle est choisie ; une page narrée par sprezzature-publish reçoit le moteur du routeur de speaker-helper, Chatterbox hors ligne. Les sous-titres suivent les langues de Whisper, détectées si `--lang` est vide.'
- q: Peut-on utiliser sprezzature-audio sans Claude Code ?
  a: 'Oui : sprezzature-audio est aussi une bibliothèque Python, quinze commandes derrière la porte d''entrée `sprezzature-audio`, une API HTTP avec image Docker et un serveur MCP, `sprezzature-audio-mcp`, qui sert l''API et `/mcp` sur un même port. L''API et les outils MCP couvrent la moitié rapide et sans modèle (conversion de sous-titres, fusion des locuteurs, WER, DER) ; transcription et narration passent par les commandes. La skill elle-même vient de `pip install sprezzature` puis `sprezzature-skills --install`.'
- q: En quoi sprezzature-audio diffère-t-il de l'API Whisper, de pyannote ou d'ElevenLabs ?
  a: 'sprezzature-audio tourne en local et dans les deux sens, de la parole au texte minuté et du texte à la parole minutée, chaque fois avec un WebVTT à côté, puis audite la piste de sous-titres : vitesse de lecture, largeur, durée, chevauchement. Les services hébergés comme ElevenLabs ou l''API audio d''OpenAI facturent à l''usage et reçoivent votre audio ; pyannote n''a pas de plafond de locuteurs, alors que le checkpoint Sortformer employé ici est conçu pour quatre au plus.'
- q: 'Peut-on lancer sprezzature-audio en CI (continuous integration, l''intégration continue : un serveur relance les tests à chaque modification du code) ?'
  a: 'Oui : `sprezzature-audio-audit talk.vtt` vérifie une piste de sous-titres contre les valeurs par défaut du Netflix Timed Text Style Guide (17 caractères par seconde, 42 par ligne, deux lignes), ne demande que la bibliothèque standard de Python, écrit du JSON (JavaScript Object Notation, un format texte dans lequel les programmes rangent des données en champs nommés, comme « titre : Accueil ») avec `--format json` et sort en 1 au moindre constat. Transcription, diarisation et narration tournent aussi sans écran, mais elles téléchargent de gros poids de modèles : une CI audite donc les pistes plutôt qu''elle ne les produit.'
- q: sprezzature-audio est-il gratuit ?
  a: 'Oui : sprezzature-audio est open source sous licence BSD (Berkeley Software Distribution, une licence née à l''université de Berkeley : chacun peut réutiliser le code, même pour le vendre, en citant l''auteur), version 3-Clause, sans compte, sans clé d''API ni offre payante, et son code est sur [GitHub](https://github.com/warith-harchaoui/sprezzature-audio). Les modèles qu''il fait tourner sont des poids ouverts téléchargés sur votre machine, chacun sous sa propre licence.'
