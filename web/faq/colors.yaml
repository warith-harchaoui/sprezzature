en:
- q: How do I install sprezzature-colors?
  a: 'Run `pip install sprezzature-colors` (Python 3.10 or later): one line installs the four tools, the command line, the image simulation, the API (Application Programming Interface, web addresses another program sends a request to and gets an answer from) served over HTTP (HyperText Transfer Protocol, the way a browser asks a server for a page), and the MCP (Model Context Protocol, the protocol through which AI agents call tools in English) server, with no extras to choose. To use it as an agent skill, `pip install sprezzature` then `sprezzature-skills --install` (or `sprezzature-skills --install --agent opencode`).'
- q: What does sprezzature-colors do?
  a: 'sprezzature-colors has four tools: a WCAG contrast audit of a palette that suggests a passing colour for each failing pair, a simulation of how an image looks with protanopia, deuteranopia or tritanopia (plus a grayscale version), a remap of the palette to one of six accessibility levels, and an export of the palette as a Tailwind configuration. The front door is `sprezzature-colors`, and each tool is also its own command, such as `sprezzature-colors-contrast` or `sprezzature-colors-cvd`.'
- q: Does sprezzature-colors check the colours of my web page?
  a: 'No: sprezzature-colors audits the colour pairs of a palette (a JSON (JavaScript Object Notation, a text format in which programs store data as named fields, like {"name": "Ada"}) file whose keys start with `label-`, `brand-` or `surface-`), and simulates colour blindness on an image such as a screenshot; it does not read HTML or CSS (Cascading Style Sheets, the rules that give a web page its colours, fonts and spacing). Contrast on a rendered page against its real background is the job of a browser-based tool such as axe-core or Lighthouse.'
- q: How is sprezzature-colors different from an online contrast checker?
  a: sprezzature-colors checks at once every pair of a palette that can appear together in a theme (`--all-pairs` for the full cross-product), at the ratio set with `--target`, where an online checker tests one foreground and background typed by hand. For each failure it suggests the nearest passing colour with the same hue and saturation, only lighter or darker, and it runs offline, from a script or a CI (continuous integration, the server that re-runs a project's checks on every change and turns red when one fails) job.
- q: Does sprezzature-colors send my files to a cloud service or use AI?
  a: 'No: sprezzature-colors is deterministic colour arithmetic that calls no AI model and never touches the network, so it needs no Ollama; and the simulation writes its images on your own disk, next to the source by default.'
- q: Can I run sprezzature-colors in CI?
  a: 'Yes: `sprezzature-colors-contrast --palette palette.json` exits 0 when every pair passes, 1 when one fails and 2 when the palette yields no pair to check, and `--format json` gives a report a CI job can parse. An HTTP API (`POST /v1/contrast`) runs the same check for a pipeline written in another language.'
- q: Can I use sprezzature-colors without Claude Code?
  a: 'Yes: sprezzature-colors is a Python library (`import sprezzature_colors as sc`), a command line, an HTTP API with a Docker image, and an MCP server, `sprezzature-colors-mcp`, for any MCP client. The Docker image runs that server, so one port answers both the HTTP routes and `/mcp`.'
- q: Is sprezzature-colors free?
  a: 'Yes: sprezzature-colors is open source under the BSD (Berkeley Software Distribution, a University of California licence that lets anyone use, change or sell the code as long as the copyright notice stays) 3-Clause licence, with no account, API key or paid tier, and the source is on [GitHub](https://github.com/warith-harchaoui/sprezzature-colors).'
fr:
- q: Comment installer sprezzature-colors ?
  a: 'Lancez `pip install sprezzature-colors` (Python 3.10 ou plus récent) : une ligne installe les quatre outils, la ligne de commande, la simulation d''images, l''API (Application Programming Interface, la porte où frappent les autres programmes : un script envoie ses chiffres et reçoit une réponse) servie en HTTP (HyperText Transfer Protocol, le protocole par lequel un navigateur demande une page à un serveur) et le serveur MCP (Model Context Protocol, le protocole par lequel les agents IA appellent des outils en français), sans option à choisir. Pour s''en servir comme skill, `pip install sprezzature` puis `sprezzature-skills --install` (ou `sprezzature-skills --install --agent opencode`).'
- q: Que fait sprezzature-colors ?
  a: 'sprezzature-colors a quatre outils : un audit de contraste WCAG d''une palette qui propose une couleur conforme pour chaque paire en échec, une simulation d''image telle que la voit une personne protanope, deutéranope ou tritanope (plus une version en niveaux de gris), une transposition de la palette à l''un de six niveaux d''accessibilité, et un export de la palette en configuration Tailwind. La porte d''entrée est `sprezzature-colors`, et chaque outil est aussi sa propre commande, comme `sprezzature-colors-contrast` ou `sprezzature-colors-cvd`.'
- q: sprezzature-colors vérifie-t-il les couleurs de ma page web ?
  a: 'Non : sprezzature-colors audite les paires de couleurs d''une palette, un fichier JSON (JavaScript Object Notation, un format texte dans lequel les programmes rangent des données en champs nommés, comme « titre : Accueil ») dont les clés commencent par `label-`, `brand-` ou `surface-`, et simule le daltonisme sur une image, une capture d''écran par exemple ; il ne lit ni HTML ni CSS (Cascading Style Sheets, les feuilles de style qui disent au navigateur la couleur, la taille et la place de chaque élément). Le contraste d''une page rendue sur son vrai fond relève d''un outil qui pilote un navigateur, comme axe-core ou Lighthouse.'
- q: En quoi sprezzature-colors diffère-t-il d'un vérificateur de contraste en ligne ?
  a: 'sprezzature-colors vérifie d''un coup toutes les paires d''une palette qui peuvent se côtoyer dans un thème (`--all-pairs` pour le produit croisé complet), au ratio fixé par `--target`, là où un vérificateur en ligne teste une couleur de texte et un fond saisis à la main. Pour chaque échec, il propose la couleur conforme la plus proche, de même teinte et même saturation, seulement plus claire ou plus foncée, et tourne hors ligne, dans un script ou une CI (continuous integration, l''intégration continue : un serveur relance les tests à chaque modification du code).'
- q: sprezzature-colors envoie-t-il mes fichiers à un service cloud ou emploie-t-il l'IA ?
  a: 'Non : sprezzature-colors fait de l''arithmétique des couleurs déterministe, sans modèle d''IA ni accès au réseau, et n''a donc pas besoin d''Ollama ; la simulation écrit ses images sur votre disque, à côté de la source par défaut.'
- q: Peut-on lancer sprezzature-colors en CI ?
  a: 'Oui : `sprezzature-colors-contrast --palette palette.json` sort avec le code 0 quand toutes les paires passent, 1 quand l''une échoue et 2 quand la palette ne donne aucune paire à vérifier, et `--format json` produit un rapport qu''une CI sait lire. Une API HTTP (`POST /v1/contrast`) fait la même vérification pour une chaîne écrite dans un autre langage.'
- q: Peut-on utiliser sprezzature-colors sans Claude Code ?
  a: 'Oui : sprezzature-colors est une bibliothèque Python (`import sprezzature_colors as sc`), une ligne de commande, une API HTTP avec image Docker et un serveur MCP, `sprezzature-colors-mcp`, pour tout client MCP. L''image Docker lance ce serveur : un même port répond aux routes HTTP et à `/mcp`.'
- q: sprezzature-colors est-il gratuit ?
  a: 'Oui : sprezzature-colors est open source sous licence BSD (Berkeley Software Distribution, une licence née à l''université de Berkeley : chacun peut réutiliser le code, même pour le vendre, en citant l''auteur), version 3-Clause, sans compte, sans clé d''API ni offre payante, et le code est sur [GitHub](https://github.com/warith-harchaoui/sprezzature-colors).'
