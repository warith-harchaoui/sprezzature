en:
- q: How do I install sprezzature-figures?
  a: 'Run `pip install sprezzature-figures` (Python 3.10 to 3.13): one command installs the generators, the command line, the HTTP API, the MCP server and the editor, with no extras to choose. It is free and open source under the BSD 3-Clause licence, and `sprezzature-figures render bar --out check.svg` checks the install.'
- q: How many chart types does sprezzature-figures have?
  a: 'sprezzature-figures has 167 chart types in its catalogue, all marked stable, and `sprezzature-figures list` prints them. The gallery on this page shows 160 of them on purpose: the five glyph maps are on the [maps page](maps.html) and the two animated Gapminder figures on the [Hans ROSLING page](hans-rosling.html).'
- q: Which file formats can sprezzature-figures export?
  a: sprezzature-figures writes SVG by default, self-contained with its fonts embedded, and the `--out` extension also picks `.png`, `.jpg`, `.pdf` or `.html`. PNG, JPEG and PDF are rasterised from that SVG inside Python, and `--scale 3` upsamples them for high-density screens.
- q: What is the Ralph Eyeball Loop?
  a: 'The Ralph Eyeball Loop is how sprezzature-figures looks at a figure before calling it done: it renders an SVG, an HTML page or a TikZ source to PNG, writes an assessment, and you edit the source and run it again. By default the agent running it reads the picture; with `--local`, the vision model `qwen3-vl:8b` served by Ollama writes the critique offline. It is the script `scripts/ralph_eyeball_loop.py` in the repository, explained on [its own page](ralph-eyeball-loop.html).'
- q: Does sprezzature-figures send my data to a cloud service?
  a: 'No: sprezzature-figures renders, recommends and checks figures on your machine with no model and no account. The three steps that use a model (`redraw`, the editor chat and the eyeball loop''s `--local` mode) call one served by Ollama locally by default, through best-engine-ai-helper. Used as a skill, the agent itself follows its own provider''s data policy.'
- q: What does sprezzature-figures need besides pip?
  a: 'sprezzature-figures needs nothing more to render and check figures: the rasteriser and the fonts come with the package. `redraw`, which rebuilds a chart from a screenshot without inventing its numbers, and the editor chat need a model served by [Ollama](https://ollama.com). The Ralph Eyeball Loop also uses system renderers (Chrome for HTML, tectonic for TikZ, rsvg-convert), and `--check-tools` lists which ones you have.'
- q: Can I use sprezzature-figures without Claude Code, for example in CI?
  a: 'Yes: sprezzature-figures is also a Python library (`make_figure`), a command line, an HTTP API with a Docker image, and the MCP server `sprezzature-figures-mcp` for any MCP client; the Claude Code skill is one of five ways in. In CI, `sprezzature-figures check figure.svg` exits 1 on any finding (labels printed over each other, text off the canvas, a dropped title), and `--format json` prints them for a program.'
- q: How is sprezzature-figures different from matplotlib, Plotly or Vega-Lite?
  a: matplotlib, Plotly and Vega-Lite give you an API or a grammar to compose a chart; sprezzature-figures gives you 167 finished chart kinds by name, each writing its SVG directly with no charting library underneath, and a checker that reads the result. For a live dashboard, a very large table or matplotlib's twenty years of answered questions, those tools remain the better choice, as `LANDSCAPE.md` in the [repository](https://github.com/warith-harchaoui/sprezzature-figures) says.
fr:
- q: Comment installer sprezzature-figures ?
  a: 'Lancez `pip install sprezzature-figures` (Python 3.10 à 3.13) : une seule commande installe les générateurs, la ligne de commande, l''API HTTP, le serveur MCP et the editor, sans option à choisir. Le paquet est gratuit et open source sous licence BSD 3-Clause, et `sprezzature-figures render bar --out check.svg` vérifie l''installation.'
- q: Combien de types de graphiques propose sprezzature-figures ?
  a: 'Le catalogue de sprezzature-figures compte 167 graphiques, tous marqués stables, et `sprezzature-figures list` les affiche. La galerie de cette page en montre 160, exprès : les cinq cartes à glyphes sont sur la [page des cartes](maps.html) et les deux figures animées Gapminder sur la [page consacrée à Hans ROSLING](hans-rosling.html).'
- q: Dans quels formats sprezzature-figures exporte-t-il ?
  a: sprezzature-figures écrit du SVG par défaut, autonome, polices incluses, et l'extension de `--out` choisit aussi `.png`, `.jpg`, `.pdf` ou `.html`. PNG, JPEG et PDF sont rastérisés depuis ce SVG en Python, et `--scale 3` les suréchantillonne pour les écrans haute densité.
- q: Qu'est-ce que la Ralph Eyeball Loop ?
  a: 'La Ralph Eyeball Loop est la façon dont sprezzature-figures regarde une figure avant de la déclarer finie : elle rend en PNG un SVG, une page HTML ou une source TikZ, écrit une évaluation, puis vous corrigez la source et relancez. Par défaut, c''est l''agent qui la lance qui lit l''image ; avec `--local`, le modèle de vision `qwen3-vl:8b` servi par Ollama rédige la critique hors ligne. C''est le script `scripts/ralph_eyeball_loop.py` du dépôt, présenté sur [sa propre page](ralph-eyeball-loop.html).'
- q: sprezzature-figures envoie-t-il mes données vers un service cloud ?
  a: 'Non : sprezzature-figures rend, recommande et vérifie les figures sur votre machine, sans modèle ni compte. Les trois étapes qui emploient un modèle (`redraw`, le chat de l'éditeur et le mode `--local` de la boucle) appellent par défaut un modèle servi localement par Ollama, via best-engine-ai-helper. Employé comme skill, l''agent lui-même suit la politique de données de son fournisseur.'
- q: De quoi sprezzature-figures a-t-il besoin en plus de pip ?
  a: 'sprezzature-figures n''a besoin de rien d''autre pour rendre et vérifier des figures : le rastériseur et les polices viennent avec le paquet. `redraw`, qui redessine un graphique à partir d''une capture d''écran sans en inventer les nombres, et le chat de l'éditeur ont besoin d''un modèle servi par [Ollama](https://ollama.com). La Ralph Eyeball Loop emploie aussi des moteurs de rendu système (Chrome pour le HTML, tectonic pour TikZ, rsvg-convert), et `--check-tools` dit lesquels sont présents.'
- q: Peut-on utiliser sprezzature-figures sans Claude Code, par exemple en CI ?
  a: 'Oui : sprezzature-figures est aussi une bibliothèque Python (`make_figure`), une ligne de commande, une API HTTP avec image Docker et le serveur MCP `sprezzature-figures-mcp` pour tout client MCP ; la skill pour Claude Code n''est qu''une des cinq portes d''entrée. En CI, `sprezzature-figures check figure.svg` sort avec le code 1 au moindre constat (étiquettes superposées, texte hors du cadre, titre perdu), et `--format json` les livre à un programme.'
- q: En quoi sprezzature-figures diffère-t-il de matplotlib, Plotly ou Vega-Lite ?
  a: matplotlib, Plotly et Vega-Lite donnent une API ou une grammaire pour composer un graphique ; sprezzature-figures donne 167 graphiques finis, appelés par leur nom, chacun écrivant son SVG directement sans bibliothèque graphique dessous, et un vérificateur qui relit le résultat. Pour un tableau de bord en direct, une très grande table ou les vingt ans de questions déjà résolues de matplotlib, ces outils restent le meilleur choix, comme le dit `PAYSAGE.md` dans le [dépôt](https://github.com/warith-harchaoui/sprezzature-figures).
