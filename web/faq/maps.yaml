en:
- q: How do I install sprezzature-maps?
  a: 'Run `pip install sprezzature-maps` (Python 3.10 to 3.13): one command installs the three generators, the `make-map` command line, the HTTP API, the MCP server and the maps Studio, and pulls in sprezzature-figures, whose font and rendering code it shares. It is free and open source under the BSD 3-Clause licence.'
- q: What kinds of maps can sprezzature-maps draw?
  a: 'sprezzature-maps draws its plates as SVG (Scalable Vector Graphics, the vector image format browsers read): a `situation_map` that centres itself on any region with a Lambert conformal conic projection and layers zones, events and a two-unit scale bar, and a `density` map of where point events fell. `make-map situation-new --country Moldova` writes a starter configuration for a new regional plate.'
- q: Where does sprezzature-maps get its map data?
  a: 'sprezzature-maps ships its geography inside the package: Natural Earth borders, coastlines, lakes and rivers, elevation from GMTED2010 (the Global Multi-resolution Terrain Elevation Data of 2010, from the US Geological Survey) for the relief, and administrative units for the United States, France, Germany, Italy and Switzerland. Your own numbers come as rows of CSV or TSV (comma- or tab-separated values) or JSON (JavaScript Object Notation), and `acled_events` and `ucdp_events` turn an export from ACLED (the Armed Conflict Location & Event Data project) or from UCDP (the Uppsala Conflict Data Program) into a situation-map layer.'
- q: Does sprezzature-maps work offline?
  a: 'Yes: sprezzature-maps needs no tile server, no API key and no account, because the base maps and the elevation are bundled, and the finished SVG carries its own fonts. The only steps that use a model are `make-map improve` and the Studio''s repair loop, which call a vision model served by Ollama on your machine by default.'
- q: What does sprezzature-maps need besides pip?
  a: sprezzature-maps needs nothing more to render SVG, PNG or JPEG. A vector PDF or EPS uses the system tool `rsvg-convert` (librsvg); without it, the package writes a raster page and says so. `make-map improve` needs a local vision model, reached through best-engine-ai-helper and [Ollama](https://ollama.com).
- q: Can I use sprezzature-maps without Claude Code, for example in CI?
  a: 'Yes: sprezzature-maps is also a Python library, a command line (`make-map` or `sprezzature-maps`), an HTTP API with a Docker image, and the MCP server `sprezzature-maps-mcp`; the Claude Code skill is one of five ways in. In CI, `make-map audit` reads finished plates against eleven rules (a named classification, printed breaks, a stated date, a title) and exits 1 on any finding, with `--format json` for a program.'
- q: How is sprezzature-maps different from Folium, kepler.gl or QGIS?
  a: Folium and kepler.gl make maps a reader pans and zooms over tiles or a GPU layer, and QGIS is a desktop GIS for analysing geography; sprezzature-maps draws one static, publication-ready plate as a self-contained SVG, and an audit that reads it back. If the geography still needs joining or buffering, or the map has to move, those tools are the better choice, as `LANDSCAPE.md` in the [repository](https://github.com/warith-harchaoui/sprezzature-maps) says.
fr:
- q: Comment installer sprezzature-maps ?
  a: 'Lancez `pip install sprezzature-maps` (Python 3.10 à 3.13) : une seule commande installe les trois générateurs, la ligne de commande `make-map`, l''API HTTP, le serveur MCP et le Studio des cartes, et tire sprezzature-figures, dont il partage les polices et le code de rendu. Le paquet est gratuit et open source sous licence BSD 3-Clause.'
- q: Quels types de cartes sprezzature-maps dessine-t-il ?
  a: 'sprezzature-maps dessine ses planches en SVG (Scalable Vector Graphics, le format d''image vectorielle que lisent les navigateurs) : une `situation_map` qui se centre sur n''importe quelle région en projection conique conforme de Lambert et superpose zones, événements et échelle en deux unités, et une carte `density` des lieux où sont tombés des événements ponctuels. `make-map situation-new --country Moldova` écrit une configuration de départ pour une nouvelle planche régionale.'
- q: D'où viennent les données cartographiques de sprezzature-maps ?
  a: 'sprezzature-maps embarque sa géographie dans le paquet : frontières, côtes, lacs et fleuves de Natural Earth, altitudes de GMTED2010 (le modèle d''élévation mondial de 2010 de l''institut géologique américain) pour le relief, et unités administratives des États-Unis, de France, d''Allemagne, d''Italie et de Suisse. Vos propres nombres arrivent en lignes CSV ou TSV (valeurs séparées par des virgules ou des tabulations) ou JSON (JavaScript Object Notation), et `acled_events` et `ucdp_events` transforment un export d''ACLED (Armed Conflict Location & Event Data, le recensement des événements de conflit) ou d''UCDP (le programme de données sur les conflits de l''université d''Uppsala) en couche de carte de situation.'
- q: sprezzature-maps fonctionne-t-il hors ligne ?
  a: 'Oui : sprezzature-maps n''a besoin ni de serveur de tuiles, ni de clé d''API, ni de compte, car les fonds de carte et les altitudes sont embarqués, et le SVG final porte ses propres polices. Les seules étapes qui emploient un modèle sont `make-map improve` et la boucle de réparation du Studio, qui appellent par défaut un modèle de vision servi par Ollama sur votre machine.'
- q: De quoi sprezzature-maps a-t-il besoin en plus de pip ?
  a: sprezzature-maps n'a besoin de rien d'autre pour rendre du SVG, du PNG ou du JPEG. Un PDF ou un EPS vectoriel passe par l'outil système `rsvg-convert` (librsvg) ; sans lui, le paquet écrit une page matricielle et le signale. `make-map improve` a besoin d'un modèle de vision local, atteint via best-engine-ai-helper et [Ollama](https://ollama.com).
- q: Peut-on utiliser sprezzature-maps sans Claude Code, par exemple en CI ?
  a: 'Oui : sprezzature-maps est aussi une bibliothèque Python, une ligne de commande (`make-map` ou `sprezzature-maps`), une API HTTP avec image Docker et le serveur MCP `sprezzature-maps-mcp` ; la skill pour Claude Code n''est qu''une des cinq portes d''entrée. En CI, `make-map audit` relit les planches finies selon onze règles (classification nommée, seuils imprimés, date indiquée, titre) et sort avec le code 1 au moindre constat, avec `--format json` pour un programme.'
- q: En quoi sprezzature-maps diffère-t-il de Folium, kepler.gl ou QGIS ?
  a: Folium et kepler.gl font des cartes que le lecteur déplace et zoome sur des tuiles ou une couche GPU, et QGIS est un SIG de bureau pour analyser la géographie ; sprezzature-maps dessine une planche statique, prête à publier, en un SVG autonome, et un audit qui la relit. S'il reste des jointures ou des zones tampons à calculer, ou si la carte doit bouger, ces outils sont le meilleur choix, comme le dit `PAYSAGE.md` dans le [dépôt](https://github.com/warith-harchaoui/sprezzature-maps).
