en:
- q: How do I install sprezzature-publish?
  a: 'Run `pip install sprezzature-publish` on Python 3.10 to 3.13: that one line installs all thirteen tools, the API (Application Programming Interface, web addresses another program sends a request to and gets an answer from) served over HTTP (HyperText Transfer Protocol, the way a browser asks a server for a page), and the MCP (Model Context Protocol, the protocol through which AI agents call tools in English) server, with no extras to choose. sprezzature-publish is free and open source under the BSD (Berkeley Software Distribution, a University of California licence that lets anyone use, change or sell the code as long as the copyright notice stays) 3-Clause licence, with no account or API key.'
- q: What does sprezzature-publish need besides pip?
  a: 'sprezzature-publish needs Ollama running on your machine only for the tools that ask a local model: `sprezzature-publish-meta`, `sprezzature-publish-plain`, `sprezzature-publish-faq` (unless `--no-llm`), `sprezzature-publish-lint --ai` and `sprezzature-publish-narrate --ai-hints`. Linting, rendering, icons, indexes, audits and the call-to-action check need no model. Narration needs its voice files once, fetched with `sprezzature-audio-install-voice --engine kokoro`.'
- q: Does sprezzature-publish send my content to a cloud service?
  a: 'No: sprezzature-publish runs locally. Meta tags, plain-language rewrites and FAQ answers are drafted by a model served by Ollama on your own machine, and narration is synthesised by a local open-source text-to-speech engine. Auditing a live URL reads that page and never writes to it.'
- q: Does sprezzature-publish handle SEO (search engine optimisation, being found on Google), GEO (generative engine optimisation, being cited by ChatGPT), AEO (answer engine optimisation, being the quoted answer) and llms.txt?
  a: 'Yes: sprezzature-publish covers all four, and `sprezzature-publish-findable` writes one report for search, generative and answer engines (SEO, GEO, AEO), money pages first, with `--fix` for the deterministic repairs. `sprezzature-publish-indexes` writes `robots.txt`, `sitemap.xml`, `llms.txt`, `llms-full.txt`, an Atom or RSS feed and `humans.txt`, and its `--offer` and `--cta` options put what the site is for at the top of `llms.txt`.'
- q: Can sprezzature-publish write an FAQ with FAQPage JSON-LD?
  a: 'Yes: sprezzature-publish drafts the FAQ a site is missing with `sprezzature-publish-faq`, from the site''s own pages, ranking the questions by the calls to action declared in `ctas.yaml` and listing apart the ones the site cannot answer yet. `sprezzature-publish-faq site/ --audit --fix` rebuilds the `FAQPage` JSON-LD from the visible FAQ, and the tool never claims that markup makes a page rank.'
- q: Can sprezzature-publish narrate a blog post?
  a: 'Yes: sprezzature-publish reads a Markdown post, or an HTML page with `--scope`, aloud with a local voice through `sprezzature-publish-narrate`, and writes the timed track beside the WAV (Waveform Audio File Format, uncompressed sound, the file a recorder saves) or MP3. `sprezzature-publish-readalong` then binds it to the page so the sentence being spoken is highlighted, and its `--check` catches a page edited after the recording. The voices come from [sprezzature-audio](audio.html), installed with it.'
- q: How is sprezzature-publish different from MkDocs, Hugo, Jekyll or Yoast?
  a: 'sprezzature-publish is sized for a README, a `docs/` folder and a blog: for a hundred versioned pages or a team, MkDocs Material, Hugo or Astro are the better choice, as its own README says. Unlike an SEO plugin such as Yoast, which works inside one CMS (content management system, the back office such as WordPress where a site is edited), it builds pages and can also audit and repair the head of a site it did not build. It adds an icon set from one logo, `llms.txt`, a grounded FAQ and a narrated read-along.'
- q: Can I run sprezzature-publish in CI, without Claude Code?
  a: 'Yes: sprezzature-publish works without any agent, as a Python library, a command line, an HTTP API with a Docker image that runs `sprezzature-publish-mcp`, and an MCP server. In CI, `sprezzature-publish-lint` exits 1 on any error with only click and the standard library behind it, and `sprezzature-publish-audit` and `sprezzature-publish-findable` exit 1 on an error finding, with `--format json` for a machine to read.'
fr:
- q: Comment installer sprezzature-publish ?
  a: 'Lancez `pip install sprezzature-publish` sous Python 3.10 à 3.13 : cette seule ligne installe les treize outils, l''API (Application Programming Interface, la porte où frappent les autres programmes : un script envoie ses chiffres et reçoit une réponse) servie en HTTP (HyperText Transfer Protocol, le protocole par lequel un navigateur demande une page à un serveur) et le serveur MCP (Model Context Protocol, le protocole par lequel les agents IA appellent des outils en français), sans option à choisir. sprezzature-publish est gratuit et open source sous licence BSD (Berkeley Software Distribution, une licence née à l''université de Berkeley : chacun peut réutiliser le code, même pour le vendre, en citant l''auteur), version 3-Clause, sans compte ni clé d''API.'
- q: De quoi sprezzature-publish a-t-il besoin en plus de pip ?
  a: 'sprezzature-publish n''a besoin d''Ollama sur votre machine que pour les outils qui interrogent un modèle local : `sprezzature-publish-meta`, `sprezzature-publish-plain`, `sprezzature-publish-faq` (sauf avec `--no-llm`), `sprezzature-publish-lint --ai` et `sprezzature-publish-narrate --ai-hints`. Le lint, le rendu, les icônes, les index, les audits et la vérification des appels à l''action se passent de modèle. La narration demande une fois ses fichiers de voix, téléchargés par `sprezzature-audio-install-voice --engine kokoro`.'
- q: sprezzature-publish envoie-t-il mon contenu dans le cloud ?
  a: 'Non : sprezzature-publish tourne en local. Les balises meta, les réécritures en langage clair et les réponses de FAQ sont rédigées par un modèle servi par Ollama sur votre machine, et la narration est synthétisée par un moteur de synthèse vocale open source local. Auditer une URL en ligne lit la page sans jamais y écrire.'
- q: 'sprezzature-publish gère-t-il le SEO, le GEO (generative engine optimization, faire que les assistants IA comme ChatGPT citent la page dans leurs réponses), l''AEO (answer engine optimization, être la réponse directe qu''affiche un moteur à une question posée) et llms.txt ?'
  a: 'Oui : sprezzature-publish couvre les quatre, et `sprezzature-publish-findable` produit un seul rapport pour les moteurs de recherche, génératifs et de réponse (SEO, GEO, AEO), pages qui rapportent en tête, et `--fix` applique les réparations déterministes. `sprezzature-publish-indexes` écrit `robots.txt`, `sitemap.xml`, `llms.txt`, `llms-full.txt`, un flux Atom ou RSS et `humans.txt`, et `--offer` et `--cta` placent ce à quoi sert le site en tête de `llms.txt`.'
- q: sprezzature-publish peut-il écrire une FAQ avec le JSON-LD FAQPage ?
  a: 'Oui : sprezzature-publish rédige avec `sprezzature-publish-faq` la FAQ qui manque à un site, à partir de ses propres pages, classe les questions selon les appels à l''action déclarés dans `ctas.yaml` et met à part celles auxquelles le site ne sait pas encore répondre. `sprezzature-publish-faq site/ --audit --fix` reconstruit le JSON-LD `FAQPage` depuis la FAQ visible, et l''outil ne prétend jamais que ce balisage fait remonter une page.'
- q: sprezzature-publish peut-il lire un article de blog à voix haute ?
  a: 'Oui : sprezzature-publish lit à voix haute, avec une voix locale, un article Markdown ou une page HTML (avec `--scope`) grâce à `sprezzature-publish-narrate`, et écrit la piste minutée à côté du WAV (Waveform Audio File Format, le fichier son brut, non compressé, qu''écrit un enregistreur) ou du MP3. `sprezzature-publish-readalong` la lie ensuite à la page pour surligner la phrase lue, et son `--check` repère une page modifiée après l''enregistrement. Les voix viennent de [sprezzature-audio](audio.html), installé avec lui.'
- q: En quoi sprezzature-publish diffère-t-il de MkDocs, Hugo, Jekyll ou Yoast ?
  a: 'sprezzature-publish est taillé pour un README, un dossier `docs/` et un blog : pour cent pages versionnées ou une équipe, MkDocs Material, Hugo ou Astro conviennent mieux, et son propre README le dit. Contrairement à un plugin SEO comme Yoast, qui travaille dans un CMS (content management system, un logiciel comme WordPress où l''on écrit les pages dans un formulaire au lieu de les coder), il construit les pages et sait aussi auditer et réparer l''en-tête d''un site qu''il n''a pas construit. Il y ajoute un jeu d''icônes tiré d''un seul logo, `llms.txt`, une FAQ sourcée et une lecture accompagnée.'
- q: 'Peut-on lancer sprezzature-publish en CI (continuous integration, l''intégration continue : un serveur relance les tests à chaque modification du code), sans Claude Code ?'
  a: 'Oui : sprezzature-publish fonctionne sans agent, comme bibliothèque Python, ligne de commande, API HTTP avec une image Docker qui lance `sprezzature-publish-mcp`, et serveur MCP. En CI, `sprezzature-publish-lint` sort en code 1 sur toute erreur avec seulement click et la bibliothèque standard, et `sprezzature-publish-audit` comme `sprezzature-publish-findable` sortent en code 1 sur une erreur, avec `--format json` pour une lecture par machine.'
