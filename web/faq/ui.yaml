en:
- q: How do I install sprezzature-ui?
  a: 'Run `pip install sprezzature-ui` (Python 3.10 or newer): one install brings the i18n audit, the catalogue tools, the `sprezzature-ui` command, the HTTP API and the MCP server, with no extras to choose. The interface-writing half is the skill: `pip install sprezzature` then `sprezzature-skills --install`, or `sprezzature-skills --install --agent opencode` for OpenCode.'
- q: What kind of code does sprezzature-ui produce?
  a: 'sprezzature-ui guides an agent to write semantic HTML, Tailwind utility classes and plain ES modules, with no React, Vue or other framework runtime. Dark-mode variants, visible focus rings and reduced-motion guards are on by default, and the type follows the three-Roboto rule: Roboto, Roboto Serif and Roboto Mono, self-hosted, unless you name another typeface.'
- q: Can I use sprezzature-ui without Claude Code?
  a: 'Partly: sprezzature-ui''s i18n tools run on their own as a Python library, a command line, an HTTP API with a Docker image and an MCP server, `sprezzature-ui-mcp`. Writing the interface itself is the model''s job, guided by the skill and the prose in its `references/` folder, so that half needs an agent such as Claude Code or OpenCode.'
- q: What does the sprezzature-ui audit check, and can it run in CI?
  a: sprezzature-ui's audit, `sprezzature-ui-i18n-audit`, flags translation tables embedded in JavaScript or HTML (rule `I18N001`) and LLM prompts inlined in Python as constants named like `PROMPT` or `INSTRUCTION` (rule `I18N002`). It exits 1 on any finding, so it can fail a CI job or run as the pre-commit hook the [repository](https://github.com/warith-harchaoui/sprezzature-ui) declares; it does not judge whether a translation is good.
- q: How does sprezzature-ui handle translations in YAML?
  a: sprezzature-ui keeps every translatable string, interface labels and model prompts alike, in one catalogue, `locales/i18n.yaml`. `sprezzature-ui-i18n-make` scaffolds it, compiles it to `locales/i18n.json` and writes two loaders, `locales/i18n.js` for the browser and `locales/i18n_prompts.py` for Python; `sprezzature-ui-i18n-audit --fix` moves strings it finds into the catalogue and prints the call to paste, without rewriting your code.
- q: Does sprezzature-ui send my code to a cloud service?
  a: 'No: sprezzature-ui''s audit and catalogue tools read your files locally, with no network and no model, so Ollama is not needed; the audit imports only the Python standard library. The interface code itself is written by your agent, which follows its own provider''s data policy.'
- q: How is sprezzature-ui different from shadcn/ui, v0 or Bootstrap?
  a: shadcn/ui hands you React components and Bootstrap ships a broad component library, while sprezzature-ui refuses any framework runtime and offers written rules plus a handful of components to copy. v0 builds an application from a prompt inside a hosted account; sprezzature-ui works with the agent you already run and checks the result with deterministic audits.
- q: Is sprezzature-ui free?
  a: Yes. sprezzature-ui is open source under the BSD 3-Clause licence, with no account, API key or paid tier, and its source is on [GitHub](https://github.com/warith-harchaoui/sprezzature-ui).
fr:
- q: Comment installer sprezzature-ui ?
  a: 'Lancez `pip install sprezzature-ui` (Python 3.10 ou plus récent) : une seule installation apporte l''audit i18n, les outils de catalogue, la commande `sprezzature-ui`, l''API HTTP et le serveur MCP, sans option à choisir. La moitié qui écrit l''interface est la skill : `pip install sprezzature` puis `sprezzature-skills --install`, ou `sprezzature-skills --install --agent opencode` pour OpenCode.'
- q: Quel code sprezzature-ui produit-il ?
  a: 'sprezzature-ui guide un agent pour écrire du HTML sémantique, des classes utilitaires Tailwind et des modules ES simples, sans React, Vue ni aucun autre framework à l''exécution. Variantes pour le mode sombre, anneaux de focus visibles et garde-fous de mouvement réduit sont actifs par défaut, et la typographie suit la règle des trois Roboto : Roboto, Roboto Serif et Roboto Mono, hébergées localement, sauf si vous nommez une autre fonte.'
- q: Peut-on utiliser sprezzature-ui sans Claude Code ?
  a: 'En partie : les outils i18n de sprezzature-ui fonctionnent seuls, comme bibliothèque Python, ligne de commande, API HTTP avec image Docker et serveur MCP, `sprezzature-ui-mcp`. Écrire l''interface elle-même revient au modèle, guidé par la skill et par la prose de son dossier `references/` : cette moitié demande un agent comme Claude Code ou OpenCode.'
- q: Que vérifie l'audit de sprezzature-ui, et peut-il tourner en CI ?
  a: L'audit de sprezzature-ui, `sprezzature-ui-i18n-audit`, signale les tables de traduction intégrées au JavaScript ou au HTML (règle `I18N001`) et les prompts de LLM écrits en dur dans du Python, en constantes dont le nom contient `PROMPT` ou `INSTRUCTION` (règle `I18N002`). Il sort avec le code 1 à la moindre trouvaille, de quoi faire échouer une CI ou servir de crochet pre-commit, déclaré dans le [dépôt](https://github.com/warith-harchaoui/sprezzature-ui) ; il ne juge pas la qualité d'une traduction.
- q: Comment sprezzature-ui gère-t-il les traductions en YAML ?
  a: sprezzature-ui range toutes les chaînes à traduire, libellés d'interface comme prompts de modèle, dans un seul catalogue, `locales/i18n.yaml`. `sprezzature-ui-i18n-make` le crée, le compile en `locales/i18n.json` et écrit deux chargeurs, `locales/i18n.js` pour le navigateur et `locales/i18n_prompts.py` pour Python ; `sprezzature-ui-i18n-audit --fix` déplace les chaînes trouvées dans le catalogue et affiche l'appel à coller, sans réécrire votre code.
- q: sprezzature-ui envoie-t-il mon code dans le cloud ?
  a: 'Non : l''audit et les outils de catalogue de sprezzature-ui lisent vos fichiers en local, sans réseau ni modèle, donc sans Ollama ; l''audit n''importe que la bibliothèque standard de Python. Le code de l''interface est écrit par votre agent, qui suit la politique de données de son fournisseur.'
- q: Quelle différence entre sprezzature-ui et shadcn/ui, v0 ou Bootstrap ?
  a: shadcn/ui fournit des composants React et Bootstrap une large bibliothèque de composants, alors que sprezzature-ui refuse tout framework à l'exécution et propose des règles écrites et quelques composants à copier. v0 construit une application à partir d'un prompt, dans un compte hébergé ; sprezzature-ui travaille avec l'agent que vous employez déjà et vérifie le résultat par des audits déterministes.
- q: sprezzature-ui est-il gratuit ?
  a: Oui. sprezzature-ui est open source sous licence BSD 3-Clause, sans compte, sans clé d'API ni offre payante, et son code est sur [GitHub](https://github.com/warith-harchaoui/sprezzature-ui).
