en:
- q: How do I install sprezzature-ux-laws?
  a: 'Run `pip install sprezzature-ux-laws` on Python 3.10 or later: one install gives the library, both commands, the API (Application Programming Interface, web addresses another program sends a request to and gets an answer from) served over HTTP (HyperText Transfer Protocol, the way a browser asks a server for a page), and the MCP (Model Context Protocol, the protocol through which AI agents call tools in English) server, with no extras to choose. sprezzature-ux-laws is free and open source under the BSD (Berkeley Software Distribution, a University of California licence that lets anyone use, change or sell the code as long as the copyright notice stays) 3-Clause licence.'
- q: Which Laws of UX does sprezzature-ux-laws check?
  a: 'sprezzature-ux-laws checks eight of the thirty laws on lawsofux.com, the ones a scan of the HTML source can decide: `hick`, `choice-overload`, `miller`, `jakob`, `fitts`, `aesthetic-usability`, `selective-attention` and `tesler`. Two of them, `hick` and `jakob`, are errors and the other six are warnings; `--only` and `--ignore` pick among them by slug.'
- q: What does sprezzature-ux-laws --fix change?
  a: 'sprezzature-ux-laws repairs four laws with `--fix`: it adds `min-h-11` for Fitts, a `focus-visible:ring-2` focus ring for aesthetic-usability, splits long codes into groups of four with non-breaking spaces for Miller, and rewrites a clickable `div` or `span` into a real `button` for Jakob. The other four need a design decision, not a text edit. `--fix --dry-run` previews the edits, and a second run on a repaired file applies none.'
- q: How does sprezzature-ux-laws count choices on a responsive menu?
  a: 'sprezzature-ux-laws counts what one screen shows, not every link in the file: it resolves each control''s visibility from its Tailwind display classes and reports the worse of the phone count and the desktop count, so a desktop row and a hamburger menu are not added together. A `details`, a `dialog`, a `menu` or a group such as a `tablist` counts as one choice, and a `nav` with more than seven choices on one screen is a Hick''s Law error.'
- q: Does sprezzature-ux-laws send my pages to a cloud service?
  a: 'No: sprezzature-ux-laws reads the raw HTML with Python''s standard-library parser, with no browser, no network and no AI model, so it needs nothing besides pip. That keeps it deterministic and fast enough for a pre-commit hook.'
- q: How is sprezzature-ux-laws different from Lighthouse or a design review?
  a: sprezzature-ux-laws reads source only, so it catches the mechanical, source-decidable mistakes without a browser, but it cannot render a page or watch a person use it. Lighthouse with field data measures response time, the Doherty threshold this tool explicitly leaves out, and a design review or a session with real users is still what tells you whether a screen makes sense; this tool exists so the mechanical faults never reach that review.
- q: Can I run sprezzature-ux-laws in CI?
  a: 'Yes: sprezzature-ux-laws exits 1 when `sprezzature-ux-laws site/` finds at least one error, or any finding at all with `--strict`, and exits 2 on a usage error. `--json` prints one object per finding, with the law, severity, path, line, message and snippet, for a CI job to read.'
- q: Can I use sprezzature-ux-laws without Claude Code?
  a: 'Yes: sprezzature-ux-laws is a Python library (`audit_html`, `audit_file`, `fix_file`), a command line, an HTTP API with a Docker image that runs `sprezzature-ux-laws-mcp`, and an MCP server whose tools are `health`, `list_laws` and `audit_interface`. The agent skill that tells Claude Code or OpenCode when to apply the laws comes with `pip install sprezzature`, then `sprezzature-skills --install`.'
fr:
- q: Comment installer sprezzature-ux-laws ?
  a: 'Lancez `pip install sprezzature-ux-laws` sous Python 3.10 ou plus récent : une seule installation donne la bibliothèque, les deux commandes, l''API (Application Programming Interface, la porte où frappent les autres programmes : un script envoie ses chiffres et reçoit une réponse) servie en HTTP (HyperText Transfer Protocol, le protocole par lequel un navigateur demande une page à un serveur) et le serveur MCP (Model Context Protocol, le protocole par lequel les agents IA appellent des outils en français), sans option à choisir. sprezzature-ux-laws est gratuit et open source sous licence BSD (Berkeley Software Distribution, une licence née à l''université de Berkeley : chacun peut réutiliser le code, même pour le vendre, en citant l''auteur), version 3-Clause.'
- q: Quelles lois de l'UX sprezzature-ux-laws vérifie-t-il ?
  a: 'sprezzature-ux-laws vérifie huit des trente lois de lawsofux.com, celles qu''une lecture du code HTML peut trancher : `hick`, `choice-overload`, `miller`, `jakob`, `fitts`, `aesthetic-usability`, `selective-attention` et `tesler`. Deux d''entre elles, `hick` et `jakob`, sont des erreurs et les six autres des avertissements ; `--only` et `--ignore` choisissent parmi elles par leur nom.'
- q: Que change sprezzature-ux-laws --fix ?
  a: 'sprezzature-ux-laws répare quatre lois avec `--fix` : il ajoute `min-h-11` pour Fitts, un anneau de focus `focus-visible:ring-2` pour l''effet esthétique-utilisabilité, découpe les longs codes en groupes de quatre séparés par des espaces insécables pour Miller, et réécrit un `div` ou un `span` cliquable en vrai `button` pour Jakob. Les quatre autres demandent une décision de conception, pas une retouche du texte. `--fix --dry-run` montre les modifications d''avance, et un second passage sur un fichier réparé n''en applique aucune.'
- q: Comment sprezzature-ux-laws compte-t-il les choix d'un menu responsive ?
  a: 'sprezzature-ux-laws compte ce qu''un écran montre, pas les liens du fichier : il lit la visibilité de chaque contrôle dans ses classes d''affichage Tailwind et retient le pire du compte mobile et du compte bureau, si bien qu''une rangée de bureau et un menu hamburger ne s''additionnent pas. Un `details`, un `dialog`, un `menu` ou un `tablist` compte pour un seul choix, et plus de sept choix dans un `nav` sur un même écran font une erreur de Hick.'
- q: sprezzature-ux-laws envoie-t-il mes pages dans le cloud ?
  a: 'Non : sprezzature-ux-laws lit le HTML brut avec l''analyseur de la bibliothèque standard de Python, sans navigateur, sans réseau et sans modèle d''IA, et n''a donc besoin de rien d''autre que pip. C''est ce qui le garde déterministe et assez rapide pour un hook pre-commit.'
- q: En quoi sprezzature-ux-laws diffère-t-il de Lighthouse ou d'une revue de design ?
  a: 'sprezzature-ux-laws ne lit que le code source : il attrape les fautes mécaniques sans navigateur, mais ne peut ni afficher une page ni regarder quelqu''un s''en servir. Lighthouse et les données de terrain mesurent le temps de réponse, le seuil de Doherty qu''il laisse explicitement de côté, et seule une revue de design ou une séance avec de vrais utilisateurs dit si un écran a du sens ; il sert à ce que les fautes mécaniques n''y arrivent jamais.'
- q: Peut-on lancer sprezzature-ux-laws en CI ?
  a: 'Oui : sprezzature-ux-laws sort en code 1 quand `sprezzature-ux-laws site/` trouve au moins une erreur, ou le moindre constat avec `--strict`, et en code 2 sur une erreur d''usage. `--json` imprime un objet par constat, avec la loi, la gravité, le chemin, la ligne, le message et l''extrait, qu''une CI peut lire.'
- q: Peut-on se servir de sprezzature-ux-laws sans Claude Code ?
  a: 'Oui : sprezzature-ux-laws est une bibliothèque Python (`audit_html`, `audit_file`, `fix_file`), une ligne de commande, une API HTTP avec une image Docker qui lance `sprezzature-ux-laws-mcp`, et un serveur MCP dont les outils sont `health`, `list_laws` et `audit_interface`. La skill qui dit à Claude Code ou OpenCode quand appliquer les lois s''installe avec `pip install sprezzature`, puis `sprezzature-skills --install`.'
