en:
- q: How do I install sprezzature-video?
  a: 'Run `pip install sprezzature-video` (Python 3.10 to 3.13): the command line, the API (Application Programming Interface, web addresses another program sends a request to and gets an answer from) served over HTTP (HyperText Transfer Protocol, the way a browser asks a server for a page), and the MCP (Model Context Protocol, the protocol through which AI agents call tools in English) server install with it, with no extra to choose. The command is `sprezzature-video`, also spelled `make-film`.'
- q: What does sprezzature-video need besides pip?
  a: 'sprezzature-video needs only ffmpeg on `PATH`: `poster` and the loudness functions call it, and `captions` measures each narration audio file through ffprobe, which ships with ffmpeg. It runs no model, needs no GPU (graphics processing unit, the chip that draws a screen) and calls no network service; `verify`, `scan`, `prose`, `pitch` and `calque` read text files and nothing else.'
- q: What is a claim in sprezzature-video?
  a: 'In sprezzature-video, a claim is a fact a film states on screen, declared in the film''s YAML (YAML Ain''t Markup Language, a plain-text settings format of indented name: value lines) spec as a pair: the text with its value, and the file in the project that decides it, read by one of five methods (`json_len`, `json_key_len`, `regex_count`, `line_count`, `literal`). A missing source file fails the claim instead of skipping it, so a count that moves in the code fails the check instead of quietly ageing the film.'
- q: What do verify, scan, assets and captions check in sprezzature-video?
  a: In sprezzature-video, `verify` checks every declared claim against its file, `scan` lists the numbers visible in an HTML composition that no claim accounts for, and `assets`, the asset ledger, says whether each file the film renders from is tracked, derived or held in one place only, which decides whether a clone can render it again. `captions` writes WebVTT from the narration script and the measured length of each audio file, without transcribing anything.
- q: How is sprezzature-video different from linting a video script?
  a: 'sprezzature-video reads the project a film describes, not only its words: `verify` fails a number on screen when the code behind it changes, even if the script never did. It lints the script too, with `prose` (dashes, banned phrases, sentences opening on a negation, in English and French), and `scan` catches what a lint cannot see, a number typed into a keyframe that nobody declared.'
- q: Can I use sprezzature-video without Claude Code?
  a: 'Yes: sprezzature-video is also a Python library (`import sprezzature_video`), a command line, an HTTP API with a Docker image, and an MCP server, `sprezzature-video-mcp`, serving the API and `/mcp` on one port. The HTTP and MCP surfaces cover `verify`, `scan` and `captions`; the skill comes from `pip install sprezzature` then `sprezzature-skills --install`, or `sprezzature-skills --install --agent opencode`.'
- q: Can I run sprezzature-video in CI?
  a: 'Yes: every sprezzature-video command exits 0 when the film is still honest, 1 when it is not (a claim that fails, a number nobody declared, an asset not in hand) and 2 on a wrong call or a missing ffmpeg, so `sprezzature-video verify film.yaml --root .` can fail a pull request. `sprezzature-video prose script.txt --strict` is made for a pre-commit hook.'
- q: Is sprezzature-video free?
  a: 'Yes: sprezzature-video is open source under the BSD (Berkeley Software Distribution, a University of California licence that lets anyone use, change or sell the code as long as the copyright notice stays) 3-Clause licence, with no account, API key or paid tier, and its source is on [GitHub](https://github.com/warith-harchaoui/sprezzature-video). It is still alpha, and it renders nothing itself: the films are made with Hyperframes, outside the package.'
fr:
- q: Comment installer sprezzature-video ?
  a: 'Lancez `pip install sprezzature-video` (Python 3.10 à 3.13) : la ligne de commande, l''API (Application Programming Interface, la porte où frappent les autres programmes : un script envoie ses chiffres et reçoit une réponse) servie en HTTP (HyperText Transfer Protocol, le protocole par lequel un navigateur demande une page à un serveur) et le serveur MCP (Model Context Protocol, le protocole par lequel les agents IA appellent des outils en français) s''installent avec, sans option à choisir. La commande s''appelle `sprezzature-video`, ou `make-film`.'
- q: De quoi sprezzature-video a-t-il besoin en plus de pip ?
  a: 'sprezzature-video n''a besoin que de ffmpeg dans le `PATH` : `poster` et les fonctions de volume sonore l''appellent, et `captions` mesure chaque fichier audio de la narration avec ffprobe, livré avec ffmpeg. Il ne fait tourner aucun modèle, ne demande pas de GPU (graphics processing unit, la carte graphique : une puce qui mène des milliers de calculs à la fois) et n''appelle aucun service réseau ; `verify`, `scan`, `prose`, `pitch` et `calque` ne lisent que des fichiers texte.'
- q: Qu'est-ce qu'une « claim » dans sprezzature-video ?
  a: 'Dans sprezzature-video, une claim est un fait qu''un film affirme à l''écran, déclaré dans la spec YAML (YAML Ain''t Markup Language, un format texte de réglages, une ligne « clé : valeur » par réglage, qu''on lit et corrige à la main) du film comme une paire : le texte avec sa valeur, et le fichier du projet qui en décide, lu par l''une de cinq méthodes (`json_len`, `json_key_len`, `regex_count`, `line_count`, `literal`). Un fichier source absent fait échouer la claim au lieu de la sauter : un compte qui bouge dans le code échoue au lieu de vieillir en silence.'
- q: Que vérifient verify, scan, assets et captions dans sprezzature-video ?
  a: Dans sprezzature-video, `verify` confronte chaque claim déclarée à son fichier, `scan` liste les nombres visibles dans une composition HTML qu'aucune claim ne couvre, et `assets`, le registre des fichiers, dit si chaque fichier du film est suivi par git, dérivé ou présent en un seul endroit, donc si un clone peut le rendre à nouveau. `captions` écrit le WebVTT à partir du script de narration et de la durée mesurée de chaque fichier audio, sans rien transcrire.
- q: En quoi sprezzature-video diffère-t-il d'un simple lint du script ?
  a: 'sprezzature-video lit le projet que décrit un film, pas seulement ses mots : `verify` fait échouer un nombre à l''écran quand le code derrière lui change, même si le script n''a pas bougé. Il relit aussi le script, avec `prose` (tirets, tournures bannies, phrases qui s''ouvrent sur une négation, en anglais et en français), et `scan` attrape ce qu''un lint ne voit pas : un nombre tapé dans une keyframe que personne n''a déclaré.'
- q: Peut-on utiliser sprezzature-video sans Claude Code ?
  a: 'Oui : sprezzature-video est aussi une bibliothèque Python (`import sprezzature_video`), une ligne de commande, une API HTTP avec image Docker et un serveur MCP, `sprezzature-video-mcp`, qui sert l''API et `/mcp` sur un même port. Les surfaces HTTP et MCP couvrent `verify`, `scan` et `captions` ; la skill vient de `pip install sprezzature` puis `sprezzature-skills --install`, ou `sprezzature-skills --install --agent opencode`.'
- q: 'Peut-on lancer sprezzature-video en CI (continuous integration, l''intégration continue : un serveur relance les tests à chaque modification du code) ?'
  a: 'Oui : chaque commande de sprezzature-video sort en 0 quand le film dit encore vrai, en 1 sinon (une claim qui échoue, un nombre que personne n''a déclaré, un fichier introuvable) et en 2 sur un appel erroné ou un ffmpeg absent : `sprezzature-video verify film.yaml --root .` peut donc faire échouer une pull request. `sprezzature-video prose script.txt --strict` est fait pour un hook de pre-commit.'
- q: sprezzature-video est-il gratuit ?
  a: 'Oui : sprezzature-video est open source sous licence BSD (Berkeley Software Distribution, une licence née à l''université de Berkeley : chacun peut réutiliser le code, même pour le vendre, en citant l''auteur), version 3-Clause, sans compte, sans clé d''API ni offre payante, et son code est sur [GitHub](https://github.com/warith-harchaoui/sprezzature-video). Il est encore en alpha et ne rend aucune image lui-même : les films sont faits avec Hyperframes, hors du paquet.'
