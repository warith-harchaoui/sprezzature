  write: 'attrition et nps ne s''additionnent pas, donc aucun total n''est affiché.'
# ── Surface triangulée (trisurface) ───────────────────────────────────────
- match: 'A surface over ([-+\d.,\u202f ]+) scattered samples, triangulated into ([-+\d.,\u202f ]+) facets and lifted into three dimensions, shaded by slope\. ([-+\d.,\u202f ]+) samples, ([-+\d.,\u202f ]+) triangles, ([-+\d.,\u202f ]+) dropped for spanning more than ([-+\d.,\u202f ]+)% of the width · shaded by slope, not by depth, the ramp clamped to the middle 90% of slopes \(([-+\d.,\u202f ]+) to ([-+\d.,\u202f ]+) per unit\) · height exaggerated · camera at ([-+\d.,\u202f ]+)° elevation, ([-+\d.,\u202f ]+)° azimuth\. Depths run ([-+\d.,\u202f ]+) to ([-+\d.,\u202f ]+), and the steepest facet falls ([-+\d.,\u202f ]+) per unit of ground\. ([-+\d.,\u202f ]+) of ([-+\d.,\u202f ]+) triangles spanned unsurveyed ground and were dropped rather than drawn flat\.'
  write: 'Une surface sur {0} échantillons épars, triangulés en {1} facettes et élevés en trois dimensions, teintée par la pente. {2} échantillons, {3} triangles, {4} retirés pour enjamber plus de {5} % de la largeur · teinté par la pente, pas par la profondeur, la rampe bornée aux 90 % du milieu des pentes (de {6} à {7} par unité) · hauteur exagérée · caméra à {8}° d''élévation, {9}° d''azimut. Les profondeurs vont de {10} à {11}, et la facette la plus raide descend de {12} par unité de terrain. {13} triangles sur {14} enjambaient du terrain non relevé et ont été retirés plutôt que tracés plats.'
- match: '(deepest|shallowest) sample at x ([-+\d.,\u202f ]+), y ([-+\d.,\u202f ]+): depth ([-+\d.,\u202f ]+)'
  write: 'échantillon {0} en x {1}, y {2} : profondeur {3}'
- match: '(deepest|shallowest): ([-+\d.,\u202f ]+)'
  write: '{0} : {1}'
- match: 'depth ([-+\d.,\u202f ]+)'
  write: 'profondeur {0}'
- match: 'x ([-+\d.,\u202f ]+) · y ([-+\d.,\u202f ]+)'
  write: 'x {0} · y {1}'
- match: '([-+\d.,\u202f ]+) samples, ([-+\d.,\u202f ]+) triangles, ([-+\d.,\u202f ]+) dropped for spanning more than ([-+\d.,\u202f ]+)% of the width'
  write: '{0} échantillons, {1} triangles, {2} retirés pour enjamber plus de {3} % de la largeur'
- match: '([-+\d.,\u202f ]+) samples, ([-+\d.,\u202f ]+) triangles'
  write: '{0} échantillons, {1} triangles'
- match: 'shaded by slope, not by depth, the ramp clamped to the middle 90% of slopes \(([-+\d.,\u202f ]+) to ([-+\d.,\u202f ]+) per unit\)'
  write: 'teinté par la pente, pas par la profondeur, la rampe bornée aux 90 % du milieu des pentes (de {0} à {1} par unité)'
- match: 'height exaggerated · camera at ([-+\d.,\u202f ]+)° elevation, ([-+\d.,\u202f ]+)° azimuth'
  write: 'hauteur exagérée · caméra à {0}° d''élévation, {1}° d''azimut'
- match: 'Depths run ([-+\d.,\u202f ]+) to ([-+\d.,\u202f ]+), and the steepest facet falls ([-+\d.,\u202f ]+) per unit of ground\.'
  write: 'Les profondeurs vont de {0} à {1}, et la facette la plus raide descend de {2} par unité de terrain.'
- match: '([-+\d.,\u202f ]+) of ([-+\d.,\u202f ]+) triangles spanned unsurveyed ground and were dropped rather than drawn flat\.'
  write: '{0} triangles sur {1} enjambaient du terrain non relevé et ont été retirés plutôt que tracés plats.'
# ── Contour triangulé (tricontour) ────────────────────────────────────────
- match: 'sensor at east ([-+\d.,\u202f ]+), north ([-+\d.,\u202f ]+): ([-+\d.,\u202f ]+) µg/m³'
  write: 'capteur à l''est {0}, au nord {1} : {2} µg/m³'
- match: 'east ([-+\d.,\u202f ]+) · north ([-+\d.,\u202f ]+)'
  write: 'est {0} · nord {1}'
- match: '([-+\d.,\u202f ]+) µg/m³'
  write: '{0} µg/m³'
- match: '([-+\d.,\u202f ]+) km'
  write: '{0} km'
- match: '([-+\d.,\u202f ]+) sensors · ([-+\d.,\u202f ]+) triangles, ([-+\d.,\u202f ]+) dropped for spanning more than ([-+\d.,\u202f ]+)% of the width, 1 peeled as a hull splinter'
  write: '{0} capteurs · {1} triangles, {2} retirés pour enjamber plus de {3} % de la largeur, 1 pelé comme écharde de bord'
- match: '([-+\d.,\u202f ]+) sensors · ([-+\d.,\u202f ]+) triangles, ([-+\d.,\u202f ]+) dropped for spanning more than ([-+\d.,\u202f ]+)% of the width, ([-+\d.,\u202f ]+) peeled as hull splinters'
  write: '{0} capteurs · {1} triangles, {2} retirés pour enjamber plus de {3} % de la largeur, {4} pelés comme échardes de bord'
- match: '([-+\d.,\u202f ]+) to ([-+\d.,\u202f ]+) µg/m³ · dashed where no sensor lies within ([-+\d.,\u202f ]+) km, ([-+\d.,\u202f ]+) times the median sensor spacing'
  write: 'de {0} à {1} µg/m³ · pointillés là où aucun capteur n''est à moins de {2} km, soit {3} fois l''espacement médian entre capteurs'
- match: '([-+\d.,\u202f ]+)% of the WHO 24-hour guideline line runs across ground no sensor is near enough to support\.'
  write: '{0} % de la ligne de la recommandation 24 h de l''OMS passe sur du terrain qu''aucun capteur n''est assez proche pour étayer.'
- match: 'That is ([-+\d.,\u202f ]+) km of ([-+\d.,\u202f ]+), and it is drawn dashed\.'
  write: 'Soit {0} km sur {1}, et elle est tracée en pointillés.'
- match: 'Iso-lines of PM2\.5, µg/m³ over ([-+\d.,\u202f ]+) scattered sensors, triangulated into ([-+\d.,\u202f ]+) facets and filled in bands\. (.+?) · (.+?)\. (.+?)$'
  write: 'Iso-lignes de PM2,5 en µg/m³ sur {0} capteurs épars, triangulés en {1} facettes et remplis en bandes. {2} · {3}. {4}'
# ── Voxels (voxels) ───────────────────────────────────────────────────────
- match: 'A voxel plot of auc over a ([-+\d.,\u202f ]+) by ([-+\d.,\u202f ]+) by ([-+\d.,\u202f ]+) grid of learning rate, max depth and subsample\. ([-+\d.,\u202f ]+) × ([-+\d.,\u202f ]+) × ([-+\d.,\u202f ]+) grid, ([-+\d.,\u202f ]+) cells · ([-+\d.,\u202f ]+) filled at auc ([-+\d.,\u202f ]+) and above · ([-+\d.,\u202f ]+) to ([-+\d.,\u202f ]+) · camera at ([-+\d.,\u202f ]+)° elevation, ([-+\d.,\u202f ]+)° azimuth · ([-+\d.,\u202f ]+) of them are hidden behind nearer cells from this angle\. The best cell, auc ([-+\d.,\u202f ]+), sits on a face of the grid: learning rate ([-+\d.,\u202f ]+), subsample ([-+\d.,\u202f ]+)\. Whatever is beyond that face was never tried, so the search bounds are part of the result\.'
  write: 'Un tracé en voxels de l''AUC sur une grille {0} × {1} × {2} de taux d''apprentissage, profondeur max et sous-échantillon. Grille {3} × {4} × {5}, {6} cellules · {7} remplies à AUC {8} et au-dessus · de {9} à {10} · caméra à {11}° d''élévation, {12}° d''azimut · {13} d''entre elles sont cachées derrière des cellules plus proches sous cet angle. La meilleure cellule, AUC {14}, est sur une face de la grille : taux d''apprentissage {15}, sous-échantillon {16}. Ce qui est au-delà de cette face n''a jamais été essayé, donc les bornes de la recherche font partie du résultat.'
- match: 'The best cell, auc ([-+\d.,\u202f ]+), sits on a face of the grid: learning rate ([-+\d.,\u202f ]+), subsample ([-+\d.,\u202f ]+)\.'
  write: 'La meilleure cellule, AUC {0}, est sur une face de la grille : taux d''apprentissage {1}, sous-échantillon {2}.'
- match: '([-+\d.,\u202f ]+) × ([-+\d.,\u202f ]+) × ([-+\d.,\u202f ]+) grid, ([-+\d.,\u202f ]+) cells · ([-+\d.,\u202f ]+) filled at auc ([-+\d.,\u202f ]+) and above'
  write: 'Grille {0} × {1} × {2}, {3} cellules · {4} remplies à AUC {5} et au-dessus'
- match: '([-+\d.,\u202f ]+) to ([-+\d.,\u202f ]+) · camera at ([-+\d.,\u202f ]+)° elevation, ([-+\d.,\u202f ]+)° azimuth'
  write: 'de {0} à {1} · caméra à {2}° d''élévation, {3}° d''azimut'
- match: '([-+\d.,\u202f ]+) of them are hidden behind nearer cells from this angle'
  write: '{0} d''entre elles sont cachées derrière des cellules plus proches sous cet angle'
- match: 'the octant nearest the camera cut away, ([-+\d.,\u202f ]+) cells'
  write: 'octant le plus proche de la caméra retiré, {0} cellules'
- match: 'the nearer half cut away, ([-+\d.,\u202f ]+) cells'
  write: 'moitié la plus proche retirée, {0} cellules'
- match: 'learning rate ([-+\d.,\u202f ]+), max depth ([-+\d.,\u202f ]+), subsample ([-+\d.,\u202f ]+): auc ([-+\d.,\u202f ]+)'
  write: 'taux d''apprentissage {0}, profondeur max {1}, sous-échantillon {2} : AUC {3}'
- match: 'learning rate ([-+\d.,\u202f ]+) · max depth ([-+\d.,\u202f ]+)'
  write: 'taux d''apprentissage {0} · profondeur max {1}'
- match: 'subsample ([-+\d.,\u202f ]+)'
  write: 'sous-échantillon {0}'
- match: 'auc ([-+\d.,\u202f ]+)'
  write: 'AUC {0}'

