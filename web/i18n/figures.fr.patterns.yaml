# Règles de motif pour la galerie française.
#
# Une étiquette par donnée — « x = 3.5 », « Fitted 142 k$ », « 63% of densest
# cell » — est une même phrase écrite quelques centaines de fois avec un autre
# nombre dedans. La table plate `figures.fr.yaml` demanderait une entrée par
# occurrence : 11 668 à travers la galerie, pour 1 783 formes distinctes.
# Ici, une règle par forme.
#
# `match` est une expression régulière appliquée à la chaîne entière ;
# `write` est le gabarit français, où {0}, {1}… reprennent les groupes
# capturés. Les nombres capturés ressortent écrits à la française
# (0,75 et 124 800) — c'est `fr_number` qui s'en charge, pas la règle.
#
# La première règle qui accroche gagne : les plus spécifiques d'abord.

# ── Coordonnées et valeurs brutes ─────────────────────────────────────────
- match: 'x = ([-\d.,\u202f ]+)'
  write: 'x = {0}'
- match: 'y = ([-\d.,\u202f ]+)'
  write: 'y = {0}'
- match: 'value ([-\d.,\u202f ]+)'
  write: 'valeur {0}'
- match: 'vector \(([-\d.,\u202f ]+), ([-\d.,\u202f ]+)\)'
  write: 'vecteur ({0}, {1})'
- match: 'magnitude ([-\d.,\u202f ]+) \(([-\d.,\u202f ]+)% of peak\)'
  write: 'norme {0} ({1} % du pic)'
- match: 'residual ([+-][\d.,]+)'
  write: 'résidu {0}'
- match: 'normalized ([-\d.,\u202f ]+)'
  write: 'normalisé {0}'
- match: 'threshold ([-\d.,\u202f ]+)'
  write: 'seuil {0}'
- match: '([-\d.,\u202f ]+) points'
  write: '{0} points'
- match: '([-\d.,\u202f ]+) events'
  write: '{0} événements'
- match: '([-\d.,\u202f ]+) users'
  write: '{0} utilisateurs'

# ── Parts et pourcentages ─────────────────────────────────────────────────
