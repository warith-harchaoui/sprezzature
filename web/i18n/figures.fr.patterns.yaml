# Règles de motif pour la galerie française.
#
# Une étiquette par donnée — « x = 3.5 », « Fitted 142 k$ », « 63% of densest
# cell » — est une même phrase écrite quelques centaines de fois avec un autre
# nombre dedans. La table plate `figures.fr.yaml` demanderait une entrée par
# occurrence : 11 668 à travers la galerie, pour 1 783 formes distinctes.
# Ici, une règle par forme.
#
# `match` est une expression régulière appliquée à la chaîne entière ;
# `write` est le gabarit français, où {0}, {1}… reprennent les groupes
# capturés. Les nombres capturés ressortent écrits à la française
# (0,75 et 124 800) — c'est `fr_number` qui s'en charge, pas la règle.
#
# La première règle qui accroche gagne : les plus spécifiques d'abord.

# ── Coordonnées et valeurs brutes ─────────────────────────────────────────
- match: 'x = ([-\d.,]+)'
  write: 'x = {0}'
- match: 'y = ([-\d.,]+)'
  write: 'y = {0}'
- match: 'value ([-\d.,]+)'
  write: 'valeur {0}'
- match: 'vector \(([-\d.,]+), ([-\d.,]+)\)'
  write: 'vecteur ({0}, {1})'
- match: 'magnitude ([-\d.,]+) \(([-\d.,]+)% of peak\)'
  write: 'norme {0} ({1} % du pic)'
- match: 'residual ([+-][\d.,]+)'
  write: 'résidu {0}'
- match: 'normalized ([-\d.,]+)'
  write: 'normalisé {0}'
- match: 'threshold ([-\d.,]+)'
  write: 'seuil {0}'
- match: '([-\d.,]+) points'
  write: '{0} points'
- match: '([-\d.,]+) events'
  write: '{0} événements'
- match: '([-\d.,]+) users'
  write: '{0} utilisateurs'

# ── Parts et pourcentages ─────────────────────────────────────────────────
- match: '([-\d.,]+)% of all incidents'
  write: '{0} % de tous les incidents'
- match: '([-\d.,]+)% of ramp max'
  write: '{0} % du maximum de la rampe'
- match: '([-\d.,]+)% of busiest hex'
  write: '{0} % de l’hexagone le plus chargé'
- match: '([-\d.,]+)% of densest cell'
  write: '{0} % de la cellule la plus dense'
- match: '([-\d.,]+)% of total'
  write: '{0} % du total'
- match: '([-\d.,]+)% of hours'
  write: '{0} % des heures'
- match: '([-\d.,]+)% moisture'
  write: '{0} % d’humidité'
- match: '([-\d.,]+) people \(([-\d.,]+)%\)'
  write: '{0} personnes ({1} %)'

# ── Régression et résidus ─────────────────────────────────────────────────
- match: 'Fitted ([-\d.,]+) k\$'
  write: 'Ajusté {0} k$'
- match: 'Residual ([+-]?[\d.,]+) k\$'
  write: 'Résidu {0} k$'
- match: 'Model over-predicts'
  write: 'Le modèle surestime'
- match: 'Model under-predicts'
  write: 'Le modèle sous-estime'
- match: '([-\d.,]+) above the diagonal'
  write: '{0} au-dessus de la diagonale'
- match: 'theoretical ([-\d.,]+), sample ([-\d.,]+)'
  write: 'théorique {0}, échantillon {1}'
- match: 'theoretical P ([-\d.,]+), empirical P ([-\d.,]+)'
  write: 'P théorique {0}, P empirique {1}'

# ── Expression différentielle ─────────────────────────────────────────────
- match: 'log2FC ([-\d.,]+)'
  write: 'log2FC {0}'
- match: '-log10p ([-\d.,]+)'
  write: '-log10p {0}'

# ── Réseaux et rangs ──────────────────────────────────────────────────────
- match: '([-\d.,]+) co-authorships'
  write: '{0} co-signatures'
- match: '([-\d.,]+) researchers in ([A-Za-z ]+)'
  write: '{0} chercheurs en {1}'
- match: 'rank ([-\d.,]+) of ([-\d.,]+)'
  write: 'rang {0} sur {1}'
- match: 'Rank ([-\d.,]+) of ([-\d.,]+)'
  write: 'Rang {0} sur {1}'
- match: '([-\d.,]+)th percentile overall'
  write: '{0}e centile, tous confondus'
- match: '([-\d.,]+)th percentile'
  write: '{0}e centile'

# ── Assemblée ─────────────────────────────────────────────────────────────
- match: '([-\d.,]+) seats in the chamber'
  write: '{0} sièges dans l’hémicycle'

# ── Temps, sommeil, activité ──────────────────────────────────────────────
- match: 'activity ([-\d.,]+) \(([-\d.,]+)% of week total\)'
  write: 'activité {0} ({1} % du total de la semaine)'
- match: '([-\d.,]+) h slept'
  write: '{0} h de sommeil'
- match: '([-\d.,]+) ms reaction time'
  write: '{0} ms de temps de réaction'
- match: '([-\d.,]+) h response time'
  write: '{0} h de délai de réponse'
- match: 'within ([-\d.,]+)-hour target'
  write: 'dans la cible de {0} heures'
- match: 'Session ([-\d.,]+) min'
  write: 'Séance de {0} min'
- match: '([-\d.,]+) active days/week'
  write: '{0} jours actifs par semaine'
- match: 'Hour of Day ([-\d.,]+): ([-\d.,]+)'
  write: 'Heure {0} : {1}'

# ── Mesures physiques ─────────────────────────────────────────────────────
- match: 'Mean ([-\d.,]+) mmHg'
  write: 'Moyenne {0} mmHg'
- match: 'wrist − arm ([-\d.,]+) mmHg'
  write: 'poignet − bras {0} mmHg'
- match: 'within ([-\d.,]+)% limits of agreement'
  write: 'dans les limites d’accord à {0} %'
- match: '([-\d.,]+) km/h'
  write: '{0} km/h'
- match: '\(([-\d.,]+), ([-\d.,]+)\) km'
  write: '({0}, {1}) km'
- match: '([-\d.,]+) m east, ([-\d.,]+) m north'
  write: '{0} m est, {1} m nord'
- match: '\$([-\d.,]+)/mo spend'
  write: '{0} $/mois de dépense'
- match: 'HP ([-\d.,]+), ([-\d.,]+) mpg'
  write: '{0} ch, {1} mpg'

# ── Formes ────────────────────────────────────────────────────────────────
- match: 'Dominant: Compactness'
  write: 'Dominante : compacité'
- match: 'Dominant: Asymmetry'
  write: 'Dominante : asymétrie'
- match: 'Compactness: ([-\d.,]+)'
  write: 'Compacité : {0}'
- match: 'Asymmetry: ([-\d.,]+)'
  write: 'Asymétrie : {0}'

# ── Deuxième vague : infobulles composées ─────────────────────────────────
- match: 'x=([-\d.,]+), y=([-\d.,]+)'
  write: 'x = {0} ; y = {1}'
- match: '([-\d.,]+) points in this cell'
  write: '{0} points dans cette cellule'
- match: 'Survey node \(([-\d.,]+) m east, ([-\d.,]+) m north\): ([-\d.,]+)% moisture'
  write: 'Point de relevé ({0} m est, {1} m nord) : {2} % d’humidité'
- match: 'g([-\d.,]+) x s([-\d.,]+): ([-\d.,]+)'
  write: 'g{0} × s{1} : {2}'
- match: 'Fast-charge time ([-\d.,]+) min'
  write: 'Temps de charge rapide {0} min'
- match: 'Energy density ([-\d.,]+) Wh/kg'
  write: 'Densité énergétique {0} Wh/kg'
- match: 'Internal resistance ([-\d.,]+) mΩ'
  write: 'Résistance interne {0} mΩ'
- match: 'Rated cycle life ([-\d.,]+) cycles'
  write: 'Durée de vie annoncée {0} cycles'

# ── Troisième vague ───────────────────────────────────────────────────────
- match: 'g([-\d.,]+) x s([-\d.,]+)'
  write: 'g{0} × s{1}'
- match: 'Weight ([-\d.,]+) kg'
  write: 'Masse {0} kg'
- match: 'Day ([-\d.,]+)'
  write: 'Jour {0}'
- match: '([-\d.,]+) mentions \(([-\d.,]+)%\)'
  write: '{0} mentions ({1} %)'
- match: '#([-\d.,]+) of ([-\d.,]+) in (Low|Control|High)'
  write: 'n° {0} sur {1} en {2}'
- match: '([-\d.,]+)% of codebase'
  write: '{0} % du code'
- match: '([-\d.,]+) per ([-\d.,]+) \(([-\d.,]+)% of month\)'
  write: '{0} pour {1} ({2} % du mois)'
- match: 'recall ([-\d.,]+)%, precision ([-\d.,]+)%'
  write: 'rappel {0} %, précision {1} %'
- match: 'silt ([-\d.,]+) % · clay ([-\d.,]+) %'
  write: 'limon {0} % · argile {1} %'
- match: 'sand ([-\d.,]+) %'
  write: 'sable {0} %'
- match: '([-\d.,]+)k people moved'
  write: '{0} k personnes déplacées'
- match: 'population ([-\d.,]+)M'
  write: 'population {0} M'
- match: 'life expectancy ([-\d.,]+) yrs'
  write: 'espérance de vie {0} ans'
- match: '([-\d.,]+) lines'
  write: '{0} lignes'
- match: '([-+\d.,]+)% up the band'
  write: '{0} % dans la bande'
- match: '([-\d.,]+) ms–([-\d.,]+) ms'
  write: '{0} ms–{1} ms'
- match: 'band \$([-\d.,]+)–\$([-\d.,]+)'
  write: 'bande {0} $–{1} $'
- match: 'close \$([-\d.,]+)'
  write: 'clôture {0} $'
- match: 'GDP per capita \$([-\d.,]+)k'
  write: 'PIB par habitant {0} k$'
- match: '([-\d.,]+) bn USD'
  write: '{0} Md USD'

# ── Quatrième vague : nombres anglais restés dans des phrases ─────────────
# Ceux-là sont les plus urgents : « 18,720 » se lit 18,72 en français.
- match: '([-\d.,]+) below the diagonal'
  write: '{0} sous la diagonale'
- match: '([-\d.,]+) below the line'
  write: '{0} sous la droite'
- match: '([-\d.,]+) above the line'
  write: '{0} au-dessus de la droite'
- match: 'nearest shop for ([-\d.,]+)% of the city'
  write: 'commerce le plus proche pour {0} % de la ville'
- match: 'r = ([-\d.,]+)'
  write: 'r = {0}'
- match: '([-\d.,]+)% of the day'
  write: '{0} % de la journée'
- match: '([-\d.,]+)% of the day’s total'
  write: '{0} % du total de la journée'
- match: "([-\\d.,]+)% of the day's total"
  write: '{0} % du total de la journée'
- match: 'middle ([-\d.,]+)% of requests'
  write: '{0} % centraux des requêtes'
- match: '([-\d.,]+)%'
  write: '{0} %'
- match: '([-\d.,]+)\s+\(([-\d.,]+)%\)'
  write: '{0}  ({1} %)'
- match: 'Mon, ([\d:]+)-([\d:]+): activity ([-\d.,]+) \(([-\d.,]+)% of week total\)'
  write: 'lun., {0}-{1} : activité {2} ({3} % du total de la semaine)'
- match: 'Tue, ([\d:]+)-([\d:]+): activity ([-\d.,]+) \(([-\d.,]+)% of week total\)'
  write: 'mar., {0}-{1} : activité {2} ({3} % du total de la semaine)'
- match: 'Wed, ([\d:]+)-([\d:]+): activity ([-\d.,]+) \(([-\d.,]+)% of week total\)'
  write: 'mer., {0}-{1} : activité {2} ({3} % du total de la semaine)'
- match: 'Thu, ([\d:]+)-([\d:]+): activity ([-\d.,]+) \(([-\d.,]+)% of week total\)'
  write: 'jeu., {0}-{1} : activité {2} ({3} % du total de la semaine)'
- match: 'Fri, ([\d:]+)-([\d:]+): activity ([-\d.,]+) \(([-\d.,]+)% of week total\)'
  write: 'ven., {0}-{1} : activité {2} ({3} % du total de la semaine)'
- match: 'Sat, ([\d:]+)-([\d:]+): activity ([-\d.,]+) \(([-\d.,]+)% of week total\)'
  write: 'sam., {0}-{1} : activité {2} ({3} % du total de la semaine)'
- match: 'Sun, ([\d:]+)-([\d:]+): activity ([-\d.,]+) \(([-\d.,]+)% of week total\)'
  write: 'dim., {0}-{1} : activité {2} ({3} % du total de la semaine)'
- match: 'Day ([-\d.,]+): open ([-\d.,]+), high ([-\d.,]+), low ([-\d.,]+), close ([-\d.,]+)'
  write: 'Jour {0} : ouverture {1}, plus haut {2}, plus bas {3}, clôture {4}'
- match: 'open ([-\d.,]+) — close ([-\d.,]+)'
  write: 'ouverture {0} — clôture {1}'
- match: 'high ([-\d.,]+) — low ([-\d.,]+)'
  write: 'plus haut {0} — plus bas {1}'

# ── Cinquième vague ───────────────────────────────────────────────────────
- match: '([\d.,-]+): ([-\d.,]+) students \(([-\d.,]+)% of sample\)'
  write: '{0} : {1} élèves ({2} % de l’échantillon)'
- match: '([-\d.,]+) students \(([-\d.,]+)% of sample\)'
  write: '{0} élèves ({1} % de l’échantillon)'
- match: 'FPR ([-\d.,]+), TPR ([-\d.,]+)'
  write: 'TFP {0}, TVP {1}'
- match: '([\d.,-]+) h slept: ([-\d.,]+) volunteers'
  write: '{0} h de sommeil : {1} volontaires'
- match: '([-\d.,]+)k visitors'
  write: '{0} k visiteurs'
- match: '([-\d.,]+)% of total · cumulative ([-\d.,]+)%'
  write: '{0} % du total · cumul {1} %'
- match: 'cumulative ([-\d.,]+)% of total'
  write: 'cumul {0} % du total'
- match: '\$([-\d.,]+)T total GDP'
  write: '{0} T$ de PIB total'
- match: '\$([-\d.,]+)k per capita x ([-\d.,]+)M'
  write: '{0} k$ par habitant × {1} M'
- match: '\$([-\d.,]+)([TBkM])'
  write: '{0} {1}$'
- match: '([-\d.,]+)% of (Europe|Asia Pacific|Americas|Middle East &amp; Africa)'
  write: '{0} % de {1}'
