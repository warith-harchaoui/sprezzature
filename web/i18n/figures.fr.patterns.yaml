  write: '{0} · attrition {1} · nps {2}'
- match: 'sorted by revenue, highest first'
  write: 'trié par revenu, le plus haut d''abord'
- match: 'sorted by revenue, lowest first'
  write: 'trié par revenu, le plus bas d''abord'
- match: 'sorted by (.+), highest first'
  write: 'trié par {0}, le plus haut d''abord'
- match: 'sorted by (.+), lowest first'
  write: 'trié par {0}, le plus bas d''abord'
