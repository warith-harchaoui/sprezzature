# ms) s'écrivent pareil en français et traversent la règle telles quelles.
- match: 'latest ([-\d.,\u202f ]+)([%\w$ ]*) · range ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+)'
  write: 'dernier {0}{1} · plage {2} à {3}'
- match: 'latest ([-\d.,\u202f ]+)([%\w$ ]*)'
  write: 'dernier {0}{1}'
- match: 'up ([-\d.,\u202f ]+) over the window'
  write: 'en hausse de {0} sur la fenêtre'
- match: 'down ([-\d.,\u202f ]+) over the window'
  write: 'en baisse de {0} sur la fenêtre'
- match: '([+\u2212-]?[\d.,\u202f ]+) over (\d+) periods'
  write: '{0} sur {1} périodes'
- match: 'Revenue \(k\$\) ([-\d.,\u202f ]+)'
  write: 'Chiffre d''affaires (k$) {0}'
- match: 'Trial conversion \(%\) ([-\d.,\u202f ]+)'
  write: 'Conversion d''essai (%) {0}'
# La forme à deux-points de la même étiquette : `by_parts` ne peut pas la
# recomposer, parce qu'un entier sans séparateur (« 471 ») est laissé tel
# quel par `fr_number` — il pourrait être une année.
- match: 'Revenue \(k\$\): ([-\d.,\u202f ]+)'
  write: 'Chiffre d''affaires (k$) : {0}'
- match: 'Trial conversion \(%\): ([-\d.,\u202f ]+)'
  write: 'Conversion d''essai (%) : {0}'
# Un relevé avec son unité collée : « 556 k$ », « 243 ms ». L'unité
# s'écrit pareil, seul le nombre change de forme.
- match: '([-\d.,\u202f ]+) (k\$|M\$|ms|s|%|h)'
  write: '{0} {1}'

# ── Estimation ponctuelle : une étiquette par point ───────────────────────
- match: '([-\d.,\u202f ]+) \(95%: ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+)\)'
  write: '{0} (95 % : {1} à {2})'
- match: 'over (\d+) runs'
  write: 'sur {0} exécutions'
- match: '(.+) · Baseline'
  write: '{0} · Référence'
- match: '(.+) · Tuned'
  write: '{0} · Réglée'
- match: '(.+) · Ours'
  write: '{0} · La nôtre'
- match: '(.+), Baseline: ([-\d.,\u202f ]+), 95% interval ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+), (\d+) runs'
  write: '{0}, Référence : {1}, intervalle à 95 % de {2} à {3}, {4} exécutions'
- match: '(.+), Tuned: ([-\d.,\u202f ]+), 95% interval ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+), (\d+) runs'
  write: '{0}, Réglée : {1}, intervalle à 95 % de {2} à {3}, {4} exécutions'
- match: '(.+), Ours: ([-\d.,\u202f ]+), 95% interval ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+), (\d+) runs'
  write: '{0}, La nôtre : {1}, intervalle à 95 % de {2} à {3}, {4} exécutions'

# ── Courbe d'apprentissage : une étiquette par taille et par série ────────
- match: 'Training · ([-\d.,\u202f ]+) examples'
  write: 'Entraînement · {0} exemples'
- match: 'Validation · ([-\d.,\u202f ]+) examples'
  write: 'Validation · {0} exemples'
- match: 'mean ([-\d.,\u202f ]+)'
  write: 'moyenne {0}'
- match: 'folds ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+)'
  write: 'plis {0} à {1}'
- match: 'Training at ([-\d.,\u202f ]+) examples: ([-\d.,\u202f ]+), folds ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+)'
  write: 'Entraînement à {0} exemples : {1}, plis {2} à {3}'
- match: 'Validation at ([-\d.,\u202f ]+) examples: ([-\d.,\u202f ]+), folds ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+)'
  write: 'Validation à {0} exemples : {1}, plis {2} à {3}'
- match: 'gap ([-\d.,\u202f ]+)'
  write: 'écart {0}'

# Les infobulles natives n'écrivent pas « examples » : « Training · 250: 0.99 ».
# `by_parts` coupe sur « : » et a besoin de la tête.
- match: 'Training · ([-+\de.,\u202f ]+)'
  write: 'Entraînement · {0}'
- match: 'Validation · ([-+\de.,\u202f ]+)'
  write: 'Validation · {0}'

# ── Courbe de perte ───────────────────────────────────────────────────────
- match: '(\d+) epochs past the minimum'
  write: '{0} époques après le minimum'
- match: 'best epoch ([-\d.,\u202f ]+) · ([-\d.,\u202f ]+)'
  write: 'meilleure époque {0} · {1}'
- match: 'over (\d+) epochs'
  write: 'sur {0} époques'
- match: 'start ([-\d.,\u202f ]+) · end ([-\d.,\u202f ]+)'
  write: 'début {0} · fin {1}'
- match: '(.+): ([-\d.,\u202f ]+) at the last epoch'
  write: '{0} : {1} à la dernière époque'
- match: '(.+): from ([-\d.,\u202f ]+) at epoch ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+) at epoch ([-\d.,\u202f ]+)'
  write: '{0} : de {1} à l''époque {2} jusqu''à {3} à l''époque {4}'

# ── Courbe de validation et silhouette ────────────────────────────────────
- match: '(\d+) samples · mean ([-\d.,\u202f ]+)'
  write: '{0} échantillons · moyenne {1}'
- match: '(\d+) below zero'
  write: '{0} sous zéro'
- match: 'n ([-\d.,\u202f ]+) · mean ([-\d.,\u202f ]+)'
  write: 'n {0} · moyenne {1}'
- match: 'peak ([-\d.,\u202f ]+)'
  write: 'sommet {0}'
- match: 'take this ([-\d.,\u202f ]+)'
  write: 'prendre {0}'

# ── Corrélogramme (acf) ───────────────────────────────────────────────────
# Deux règles pour 143 infobulles : une par retard et par panneau.
- match: 'Partial autocorrelation · lag (\d+)'
  write: 'Autocorrélation partielle · retard {0}'
- match: 'Autocorrelation · lag (\d+)'
  write: 'Autocorrélation · retard {0}'
- match: 'band ±([-\d.,\u202f ]+) = ±([-\d.,\u202f ]+)/√(\d+), the 95% white-noise null · lag 0 omitted, it is 1 by definition'
  write: 'bande ±{0} = ±{1}/√{2}, l''hypothèse nulle de bruit blanc à 95 % · retard 0 omis, il vaut 1 par définition'
- match: '(\d+) of (\d+) lags cross the band: ([\d, ]+)\. The crossings at ([\d, ]+) are multiples of (\d+):'
  write: '{0} retards sur {1} sortent de la bande : {2}. Les passages à {3} sont des multiples de {4} :'
- match: '(\d+) of (\d+) lags cross the band: ([\d, ]+) and (\d+) more'
  write: '{0} retards sur {1} sortent de la bande : {2} et {3} autres'
- match: '(\d+) of (\d+) lags cross the band: ([\d, ]+)'
  write: '{0} retards sur {1} sortent de la bande : {2}'
- match: 'no lag crosses the band'
  write: 'aucun retard ne sort de la bande'
- match: 'Partial autocorrelation at lag (\d+): ([-\d.,\u202f ]+), inside the band'
  write: 'Autocorrélation partielle au retard {0} : {1}, dans la bande'
- match: 'Partial autocorrelation at lag (\d+): ([-\d.,\u202f ]+), outside the band'
  write: 'Autocorrélation partielle au retard {0} : {1}, hors de la bande'
- match: 'Autocorrelation at lag (\d+): ([-\d.,\u202f ]+), inside the band'
  write: 'Autocorrélation au retard {0} : {1}, dans la bande'
- match: 'Autocorrelation at lag (\d+): ([-\d.,\u202f ]+), outside the band'
  write: 'Autocorrélation au retard {0} : {1}, hors de la bande'
- match: 'lag (\d+): ([-\d.,\u202f ]+)'
  write: 'retard {0} : {1}'

# ── Décomposition saisonnière (seasonal-decomposition) ────────────────────
# Quatre panneaux x 72 mois : les étiquettes par point passent par des règles.
- match: 'Observed at ([-\d.,\u202f ]+): ([-\d.,\u202f ]+), further than the threshold'
  write: 'Observé en {0} : {1}, au-delà du seuil'
- match: 'Observed at ([-\d.,\u202f ]+): ([-\d.,\u202f ]+)'
  write: 'Observé en {0} : {1}'
- match: 'Observed · ([-\d.,\u202f ]+)'
  write: 'Observé · {0}'
- match: 'Trend at ([-\d.,\u202f ]+): ([-\d.,\u202f ]+), further than the threshold'
  write: 'Tendance en {0} : {1}, au-delà du seuil'
- match: 'Trend at ([-\d.,\u202f ]+): ([-\d.,\u202f ]+)'
  write: 'Tendance en {0} : {1}'
- match: 'Trend · ([-\d.,\u202f ]+)'
  write: 'Tendance · {0}'
- match: 'Seasonal at ([-\d.,\u202f ]+): ([-\d.,\u202f ]+), further than the threshold'
  write: 'Saisonnier en {0} : {1}, au-delà du seuil'
- match: 'Seasonal at ([-\d.,\u202f ]+): ([-\d.,\u202f ]+)'
  write: 'Saisonnier en {0} : {1}'
- match: 'Seasonal · ([-\d.,\u202f ]+)'
  write: 'Saisonnier · {0}'
- match: 'Remainder at ([-\d.,\u202f ]+): ([-\d.,\u202f ]+), further than the threshold'
  write: 'Reste en {0} : {1}, au-delà du seuil'
- match: 'Remainder at ([-\d.,\u202f ]+): ([-\d.,\u202f ]+)'
  write: 'Reste en {0} : {1}'
- match: 'Remainder · ([-\d.,\u202f ]+)'
  write: 'Reste · {0}'
- match: '([-\d.,\u202f ]+) to ([-\d.,\u202f ]+)'
  write: '{0} à {1}'
- match: 'additive model, period ([-\d.,\u202f ]+) · seasonal strength ([-\d.,\u202f ]+) · trend strength ([-\d.,\u202f ]+), both on 0 to 1'
  write: 'modèle additif, période {0} · force saisonnière {1} · force de tendance {2}, toutes deux sur 0 à 1'
- match: 'multiplicative model, period ([-\d.,\u202f ]+) · seasonal strength ([-\d.,\u202f ]+) · trend strength ([-\d.,\u202f ]+), both on 0 to 1'
  write: 'modèle multiplicatif, période {0} · force saisonnière {1} · force de tendance {2}, toutes deux sur 0 à 1'
- match: '([-\d.,\u202f ]+) of ([-\d.,\u202f ]+) months sits more than ([-\d.,\u202f ]+) standard deviations from trend plus season: (.+)\.'
  write: '{0} mois sur {1} s''écarte de plus de {2} écarts types de la tendance plus la saison : {3}.'
- match: '([-\d.,\u202f ]+) of ([-\d.,\u202f ]+) months sit more than ([-\d.,\u202f ]+) standard deviations from trend plus season: (.+)\.'
  write: '{0} mois sur {1} s''écartent de plus de {2} écarts types de la tendance plus la saison : {3}.'
- match: 'No month departs from the trend and the season by more than ([-\d.,\u202f ]+) standard deviations\.'
  write: 'Aucun mois ne s''écarte de la tendance et de la saison de plus de {0} écarts types.'
- match: 'Trend covers (.+) to (.+); the centred average cannot reach the first or last ([-\d.,\u202f ]+) months\.'
  write: 'La tendance couvre {0} à {1} ; la moyenne centrée ne peut atteindre ni les {2} premiers ni les {2} derniers mois.'
# ── Éventail de prévision (forecast-fan) ──────────────────────────────────
- match: 'Forecast · ([-\d.,\u202f ]+) · ([-\d.,\u202f ]+) · ([-\d.,\u202f ]+)%: ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+)'
  write: 'Prévision · {0} · {1} · {2} % : {3} à {4}'
- match: 'Forecast · ([-\d.,\u202f ]+)'
  write: 'Prévision · {0}'
- match: 'Observed · ([-\d.,\u202f ]+) · ([-\d.,\u202f ]+)'
  write: 'Observé · {0} · {1}'
- match: 'Observed · ([-\d.,\u202f ]+)'
  write: 'Observé · {0}'
- match: 'bands are (.+)% intervals: ([-\d.,\u202f ]+) times in 100 the outcome falls outside the widest one'
  write: 'les bandes sont des intervalles à {0} % : {1} fois sur 100 l''issue tombe hors de la plus large'
- match: '([-\d.,\u202f ]+) periods out, the ([-\d.,\u202f ]+)% interval runs ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+): plus or minus ([-\d.,\u202f ]+)% of the ([-\d.,\u202f ]+) forecast\.'
  write: 'à {0} périodes, l''intervalle à {1} % va de {2} à {3} : plus ou moins {4} % de la prévision de {5}.'
# ── Carte de contrôle (control-chart) ─────────────────────────────────────
- match: 'Batch ([-\d.,\u202f ]+): ([-\d.,\u202f ]+), a point past the limits, a run on one side of the centre'
  write: 'Lot {0} : {1}, un point hors des limites, une suite du même côté du centre'
- match: 'Batch ([-\d.,\u202f ]+): ([-\d.,\u202f ]+), a run on one side of the centre, two of three points past two sigma'
  write: 'Lot {0} : {1}, une suite du même côté du centre, deux points sur trois au-delà de deux sigma'
- match: 'Batch ([-\d.,\u202f ]+): ([-\d.,\u202f ]+), a run on one side of the centre'
  write: 'Lot {0} : {1}, une suite du même côté du centre'
- match: 'Batch ([-\d.,\u202f ]+): ([-\d.,\u202f ]+), two of three points past two sigma'
  write: 'Lot {0} : {1}, deux points sur trois au-delà de deux sigma'
- match: 'Batch ([-\d.,\u202f ]+): ([-\d.,\u202f ]+), a steady climb or fall'
  write: 'Lot {0} : {1}, une montée ou une baisse régulière'
- match: 'Batch ([-\d.,\u202f ]+): ([-\d.,\u202f ]+), a point past the limits'
  write: 'Lot {0} : {1}, un point hors des limites'
- match: 'Batch ([-\d.,\u202f ]+): ([-\d.,\u202f ]+)'
  write: 'Lot {0} : {1}'
- match: 'centre ([-\d.,\u202f ]+)'
  write: 'centre {0}'
- match: 'upper control limit ([-\d.,\u202f ]+)'
  write: 'limite de contrôle haute {0}'
- match: 'lower control limit ([-\d.,\u202f ]+)'
  write: 'limite de contrôle basse {0}'
- match: 'spec high ([-\d.,\u202f ]+)'
  write: 'spécification haute {0}'
- match: 'spec low ([-\d.,\u202f ]+)'
  write: 'spécification basse {0}'
- match: 'control limits at ([-\d.,\u202f ]+) ± ([-\d.,\u202f ]+) × ([-\d.,\u202f ]+), sigma from the mean moving range'
  write: 'limites de contrôle à {0} ± {1} × {2}, sigma depuis l''amplitude mobile moyenne'
- match: 'control limits at ([-\d.,\u202f ]+) ± ([-\d.,\u202f ]+) × ([-\d.,\u202f ]+), sigma from the standard deviation of all points'
  write: 'limites de contrôle à {0} ± {1} × {2}, sigma depuis l''écart type de tous les points'
- match: '([-\d.,\u202f ]+) of ([-\d.,\u202f ]+) rules fired over ([-\d.,\u202f ]+) units: (.+)\.'
  write: '{0} règles sur {1} se sont déclenchées sur {2} unités : {3}.'
- match: 'No rule fired over ([-\d.,\u202f ]+) units: nothing here is distinguishable from the process behaving as it always has\.'
  write: 'Aucune règle ne s''est déclenchée sur {0} unités : rien ici ne se distingue du procédé tel qu''il a toujours été.'

# ── Matrice des valeurs manquantes (missing-matrix) ───────────────────────
# Six champs x 60 bandes : trois formes d'étiquette par champ.
- match: 'patient, records ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+): ([-\d.,\u202f ]+)% missing'
  write: 'patient, enregistrements {0} à {1} : {2} % manquants'
- match: 'patient ([-\d.,\u202f ]+)-([-\d.,\u202f ]+): ([-\d.,\u202f ]+)%'
  write: 'patient {0}-{1} : {2} %'
- match: 'patient · ([-\d.,\u202f ]+)-([-\d.,\u202f ]+)'
  write: 'patient · {0}-{1}'
- match: 'age, records ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+): ([-\d.,\u202f ]+)% missing'
  write: 'âge, enregistrements {0} à {1} : {2} % manquants'
- match: 'age ([-\d.,\u202f ]+)-([-\d.,\u202f ]+): ([-\d.,\u202f ]+)%'
  write: 'âge {0}-{1} : {2} %'
- match: 'age · ([-\d.,\u202f ]+)-([-\d.,\u202f ]+)'
  write: 'âge · {0}-{1}'
- match: 'weight, records ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+): ([-\d.,\u202f ]+)% missing'
  write: 'poids, enregistrements {0} à {1} : {2} % manquants'
- match: 'weight ([-\d.,\u202f ]+)-([-\d.,\u202f ]+): ([-\d.,\u202f ]+)%'
  write: 'poids {0}-{1} : {2} %'
- match: 'weight · ([-\d.,\u202f ]+)-([-\d.,\u202f ]+)'
  write: 'poids · {0}-{1}'
- match: 'height, records ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+): ([-\d.,\u202f ]+)% missing'
  write: 'taille, enregistrements {0} à {1} : {2} % manquants'
- match: 'height ([-\d.,\u202f ]+)-([-\d.,\u202f ]+): ([-\d.,\u202f ]+)%'
  write: 'taille {0}-{1} : {2} %'
- match: 'height · ([-\d.,\u202f ]+)-([-\d.,\u202f ]+)'
  write: 'taille · {0}-{1}'
- match: 'referrer, records ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+): ([-\d.,\u202f ]+)% missing'
  write: 'adresseur, enregistrements {0} à {1} : {2} % manquants'
- match: 'referrer ([-\d.,\u202f ]+)-([-\d.,\u202f ]+): ([-\d.,\u202f ]+)%'
  write: 'adresseur {0}-{1} : {2} %'
- match: 'referrer · ([-\d.,\u202f ]+)-([-\d.,\u202f ]+)'
  write: 'adresseur · {0}-{1}'
- match: 'consent_date, records ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+): ([-\d.,\u202f ]+)% missing'
  write: 'date_consentement, enregistrements {0} à {1} : {2} % manquants'
- match: 'consent_date ([-\d.,\u202f ]+)-([-\d.,\u202f ]+): ([-\d.,\u202f ]+)%'
  write: 'date_consentement {0}-{1} : {2} %'
- match: 'consent_date · ([-\d.,\u202f ]+)-([-\d.,\u202f ]+)'
  write: 'date_consentement · {0}-{1}'
- match: '([-\d.,\u202f ]+)% missing'
  write: '{0} % manquants'
- match: 'one band = ([-\d.,\u202f ]+) records'
  write: 'une bande = {0} enregistrements'
- match: 'weight and height share ([-\d.,\u202f ]+)% of their absences'
  write: 'poids et taille partagent {0} % de leurs absences'
- match: '(.+) and (.+) share ([-\d.,\u202f ]+)% of their absences'
  write: '{0} et {1} partagent {2} % de leurs absences'
- match: 'no two columns go missing together'
  write: 'aucune paire de colonnes ne manque ensemble'
- match: 'consent_date is the emptiest at ([-\d.,\u202f ]+)% of ([-\d.,\u202f ]+) records\.'
  write: 'date_consentement est la plus vide, à {0} % de {1} enregistrements.'
- match: '(.+) is the emptiest at ([-\d.,\u202f ]+)% of ([-\d.,\u202f ]+) records\.'
  write: '{0} est la plus vide, à {1} % de {2} enregistrements.'
- match: '([-\d.,\u202f ]+) of ([-\d.,\u202f ]+) columns has no holes at all: (.+)\.'
  write: '{0} colonne sur {1} n''a aucun trou : {2}.'
- match: '([-\d.,\u202f ]+) of ([-\d.,\u202f ]+) columns have no holes at all: (.+)\.'
  write: '{0} colonnes sur {1} n''ont aucun trou : {2}.'
# ── Triangle de rétention (cohort-retention) ──────────────────────────────
- match: '(\d{4}-\d{2}), month ([-\d.,\u202f ]+): ([-\d.,\u202f ]+)% still present'
  write: '{0}, mois {1} : {2} % encore présents'
- match: '(\d{4}-\d{2}) month ([-\d.,\u202f ]+): ([-\d.,\u202f ]+)%'
  write: '{0} mois {1} : {2} %'
- match: '(\d{4}-\d{2}) · month ([-\d.,\u202f ]+)'
  write: '{0} · mois {1}'
- match: 'colour runs ([-\d.,\u202f ]+)% to ([-\d.,\u202f ]+)%, the range of the measured cells, not 0 to 100'
  write: 'la couleur va de {0} % à {1} %, l''étendue des cellules mesurées, pas de 0 à 100'
- match: 'period 0 omitted, it is 100% by definition'
  write: 'période 0 omise, elle vaut 100 % par définition'
- match: 'The typical cohort stops losing more than ([-\d.,\u202f ]+)% a period at month ([-\d.,\u202f ]+)\.'
  write: 'La cohorte typique cesse de perdre plus de {0} % par période au mois {1}.'
- match: 'No period yet brings the typical loss under ([-\d.,\u202f ]+)%: the curve has not flattened\.'
  write: 'Aucune période n''amène encore la perte typique sous {0} % : la courbe ne s''est pas aplatie.'
- match: 'Calendar period ([-\d.,\u202f ]+) sits more than ([-\d.,\u202f ]+)% below the rest: a bad month, not a bad cohort\.'
  write: 'La période calendaire {0} se tient à plus de {1} % sous les autres : un mauvais mois, pas une mauvaise cohorte.'
- match: '([-\d.,\u202f ]+) of ([-\d.,\u202f ]+) cells are not yet measured\.'
  write: '{0} cellules sur {1} ne sont pas encore mesurées.'

