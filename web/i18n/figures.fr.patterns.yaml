  write: 'type_contrat : chute moyenne de {0} sur {1} mélanges, intervalle {2} à {3}'
- match: 'contract_type: ([-\d.,\u202f ]+)'
  write: 'type_contrat : {0}'
- match: 'tenure_months: ([-\d.,\u202f ]+) mean drop over ([-\d.,\u202f ]+) shuffles, interval ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+), crossing zero'
  write: 'anciennete_mois : chute moyenne de {0} sur {1} mélanges, intervalle {2} à {3}, traversant zéro'
- match: 'tenure_months: ([-\d.,\u202f ]+) mean drop over ([-\d.,\u202f ]+) shuffles, interval ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+)'
  write: 'anciennete_mois : chute moyenne de {0} sur {1} mélanges, intervalle {2} à {3}'
- match: 'tenure_months: ([-\d.,\u202f ]+)'
  write: 'anciennete_mois : {0}'
- match: 'monthly_charge: ([-\d.,\u202f ]+) mean drop over ([-\d.,\u202f ]+) shuffles, interval ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+), crossing zero'
  write: 'facture_mensuelle : chute moyenne de {0} sur {1} mélanges, intervalle {2} à {3}, traversant zéro'
- match: 'monthly_charge: ([-\d.,\u202f ]+) mean drop over ([-\d.,\u202f ]+) shuffles, interval ([-\d.,\u202f ]+) to ([-\d.,\u202f ]+)'
  write: 'facture_mensuelle : chute moyenne de {0} sur {1} mélanges, intervalle {2} à {3}'
- match: 'monthly_charge: ([-\d.,\u202f ]+)'
  write: 'facture_mensuelle : {0}'
