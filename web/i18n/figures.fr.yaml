? 'Packed-bubble chart of programming languages. Each bubble is a language, labelled with its name and share, so it reads without relying on colour. Its area is the share of professional developers who report using it, and its colour marks the language family: web and scripting, data and scientific, systems, and enterprise / JVM. The web and scripting family (JavaScript, HTML/CSS, TypeScript) and the data family (Python, SQL) hold the largest bubbles, while the systems and enterprise families form smaller but distinct clusters. Hover or focus any bubble to lift its whole family and dim the rest.'
: 'Diagramme à bulles compactées des langages de programmation. Chaque bulle est un langage, étiqueté avec son nom et sa part, pour se lire sans dépendre de la couleur. Son aire est la part des développeurs professionnels qui déclarent l''utiliser, et sa couleur marque la famille du langage : web et scripting, données et scientifique, systèmes, et entreprise / JVM. La famille web et scripting (JavaScript, HTML/CSS, TypeScript) et la famille données (Python, SQL) portent les plus grosses bulles, tandis que les familles systèmes et entreprise forment des grappes plus petites mais distinctes. Survolez ou ciblez une bulle pour faire ressortir toute sa famille et estomper le reste.'
