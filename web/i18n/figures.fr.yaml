? Residual plot for a straight-line fit of home sale price against floor area. Residuals (actual minus predicted price, thousands of dollars) are scattered on the vertical axis against the model's fitted price on the horizontal axis, with a dashed zero reference line. A red locally-weighted smoother bows into a U — residuals are positive at both ends and negative in the middle — and the spread of points widens toward the right. The curvature and the fanning show the linear model mis-specifies both the mean and the variance. Points above zero (model under-predicts) are blue; points below zero (model over-predicts) are orange. Illustrative data.
: Diagramme des résidus d'un ajustement linéaire du prix de vente des logements selon la surface. Les résidus (prix réel moins prédit, en milliers de dollars) sont dispersés sur l'axe vertical face au prix ajusté du modèle sur l'axe horizontal, avec une ligne de référence pointillée à zéro. Un lisseur rouge à pondération locale se courbe en U, les résidus sont positifs aux deux extrémités et négatifs au milieu, et la dispersion des points s'élargit vers la droite. La courbure et l'évasement montrent que le modèle linéaire spécifie mal la moyenne et la variance. Les points au-dessus de zéro (le modèle sous-estime) sont bleus ; ceux en dessous (le modèle surestime) sont orange. Données illustratives.
