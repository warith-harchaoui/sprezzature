? Cycle wheel of the winter-wheat crop year. A ring of coloured arcs, one per growth stage, sweeps clockwise from the top; each arc's length is that stage's share of the twelve-month year, and a curved arrow inside the ring shows the loop's direction. The stages, in order, are Sowing (October), Tillering (Nov–Feb), Stem extension (Mar–Apr), Heading & flowering (May), Grain filling (June), Harvest (July), Bare soil & cover crop (Aug–Sep). The longest is Tillering, 4 months over winter; the reproductive stages of late spring are the thinnest, fastest arcs.
: 'Roue cyclique de l''année culturale du blé d''hiver. Un anneau d''arcs colorés, un par stade de croissance, tourne dans le sens horaire depuis le haut ; la longueur de chaque arc est la part du stade dans l''année de douze mois, et une flèche courbe à l''intérieur de l''anneau indique le sens de la boucle. Les stades, dans l''ordre, sont : Semis (octobre), Tallage (nov.-févr.), Montaison (mars-avr.), Épiaison et floraison (mai), Remplissage du grain (juin), Récolte (juillet), Sol nu et couvert végétal (août-sept.). Le plus long est le Tallage, 4 mois durant l''hiver ; les stades reproducteurs de la fin du printemps sont les arcs les plus fins et les plus rapides.'
