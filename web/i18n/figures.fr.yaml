? RadViz projection of 180 synthetic wheat kernels from three varieties (Kama, Rosa, Canadian), each described by 7 geometric measurements. The measurements are anchors equally spaced on a circle; every kernel sits at the value-weighted average of the anchors it scores high on, as if pulled by springs. The three coloured clouds pull apart toward different rim sectors, so the raw measurements carry the variety signal a classifier would use. Rosa pulls to size, Kama to Compactness, Canadian to Asymmetry — the raw features already carry the signal.
: Projection RadViz de 180 grains de blé synthétiques de trois variétés (Kama, Rosa, Canadian), chacun décrit par 7 mesures géométriques. Les mesures sont des ancres équidistantes sur un cercle ; chaque grain se place à la moyenne pondérée par la valeur des ancres où il marque le plus, comme tiré par des ressorts. Les trois nuages colorés s'écartent vers des secteurs différents du bord, donc les mesures brutes portent le signal de variété qu'un classifieur utiliserait. Rosa tire vers la taille, Kama vers la compacité, Canadian vers l'asymétrie ; les variables brutes portent déjà le signal.
