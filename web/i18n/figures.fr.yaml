? 'A scatterplot matrix (pair plot) of a fleet of lithium-ion battery cells from three chemistries: NMC-811 high-nickel, LFP iron-phosphate, and a fast-charging silicon-anode cell. The four measured properties crossed in the grid are usable energy density, fast-charge time, internal resistance, and rated cycle life. Off-diagonal cells are scatter plots where each chemistry has its own hue and marker shape (circle, square, triangle) so the families stay apart for colour-blind and greyscale readers; diagonal cells show each property’s per-chemistry distribution as a density curve. On every pair the three chemistries form three separated clusters: silicon-anode is high-density and fast-charging but short-lived, LFP is the durable long-cycle-life workhorse, and NMC-811 sits between them, so one cell measurement is enough to identify the family. Illustrative data.'
: 'Matrice de nuages de points (graphique en paires) d''un parc de cellules lithium-ion de trois chimies : NMC-811 riche en nickel, LFP lithium-fer-phosphate et une cellule à anode silicium à charge rapide. Les quatre propriétés mesurées croisées dans la grille sont la densité d''énergie utile, le temps de charge rapide, la résistance interne et la durée de vie nominale. Les cases hors diagonale sont des nuages de points où chaque chimie a sa teinte et sa forme de marqueur (cercle, carré, triangle) pour que les familles restent distinctes en vision des couleurs déficiente et en niveaux de gris ; les cases de la diagonale montrent la distribution de chaque propriété par chimie sous forme de courbe de densité. Sur chaque paire, les trois chimies forment trois grappes séparées : l''anode silicium est dense et se charge vite mais dure peu, le LFP est la bête de somme durable à longue vie, et le NMC-811 se situe entre les deux, si bien qu''une seule mesure suffit à identifier la famille. Données
  illustratives.'
