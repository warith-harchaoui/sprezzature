: Forest plot de méta-analyse de 8 essais randomisés. Chaque ligne montre le rapport de cotes d'un essai pour atteindre la cible tensionnelle sous forme de boîte (aire ∝ poids de l'étude) avec une moustache d'intervalle de confiance à 95 %, sur un axe logarithmique avec une ligne nulle à 1,0. Le losange groupé en effets aléatoires est centré sur 1,44 (IC 95 % 1,26 à 1,64), nettement à droite de la valeur nulle, donc le programme augmente globalement les chances d'atteindre la cible.
