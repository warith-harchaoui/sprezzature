: 'Diagramme en barres 3D : une grille 4×4 de barres pleines, une par équipe et par trimestre, la hauteur et l''intensité du bleu encodant toutes deux la dépense cloud trimestrielle. Les barres de l''équipe Data forment une crête montante au fond qui domine la plaine plate de Docs au premier plan.'
? '3D wireframe surface: a mesh of projected grid lines over a radially-symmetric ripple, one central peak ringed by decaying concentric waves. Nearer lines are darker blue and thicker; the lattice turns slowly so the solid shape reads on a flat page.'
