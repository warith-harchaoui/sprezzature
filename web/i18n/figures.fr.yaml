? 'Connected scatter tracing carbon-dioxide emissions per person (vertical, tonnes) against economic output per person (horizontal, thousands of US dollars) for the United Kingdom, one point every five years from 1990 to 2022. The path first moves right as income rises, then turns sharply left and downward: output per person climbed about 66% while emissions per person fell about 53%, from 10.0 to 4.7 tonnes. The left-turning hook shows growth and carbon decoupling. Illustrative figures.'
: 'Nuage de points connectés retraçant les émissions de dioxyde de carbone par habitant (vertical, tonnes) face à la production économique par habitant (horizontal, milliers de dollars US) pour le Royaume-Uni, un point tous les cinq ans de 1990 à 2022. La trajectoire va d''abord vers la droite à mesure que le revenu augmente, puis vire nettement vers la gauche et le bas : la production par habitant a grimpé d''environ 66 % tandis que les émissions par habitant ont reculé d''environ 53 %, de 10,0 à 4,7 tonnes. Le crochet vers la gauche montre le découplage entre croissance et carbone. Données illustratives.'
