? 'Radial tree of a data-platform public API laid out from the centre outward. The root, Data Platform API, sits at the middle and splits into four pillars on the first ring: Ingestion, Transform, Serve, and Govern. Ingestion is the widest branch, reaching connectors such as change data capture, file and object stores, and event streams, plus a schema registry. Each pillar is tinted its own color, and links curve along the arc between rings.'
: 'Arbre radial d''une API publique de plateforme de données disposée du centre vers l''extérieur. La racine, API plateforme de données, occupe le milieu et se divise en quatre piliers sur le premier anneau : Ingestion, Transformation, Service et Gouvernance. L''Ingestion est la branche la plus large, atteignant des connecteurs comme la capture des changements, le stockage de fichiers et d''objets et les flux d''événements, plus un registre de schémas. Chaque pilier a sa propre teinte, et les liens s''incurvent le long de l''arc entre les anneaux.'
