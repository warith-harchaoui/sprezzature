? Reliability diagram (calibration curve) for an overconfident customer-churn classifier. The horizontal axis is the model’s predicted probability of churn; the vertical axis is the observed churn rate in each bin. A dashed 45-degree line marks perfect calibration, ringed by a faint grey tolerance band. The reliability curve sags below the diagonal at the confident end, so the model’s high-probability calls happen less often than it claims (overconfident, labelled in red on the right); Expected Calibration Error 10%. At the timid end it floats above the diagonal, so it under-states churn (underconfident, labelled in blue on the left). Each point is sized by how many predictions fell in the bin, and a histogram below shows where the model spends its predictions. Illustrative data.
: Diagramme de fiabilité (courbe de calibration) pour un classifieur d'attrition client trop confiant. L'axe horizontal est la probabilité d'attrition prédite ; l'axe vertical est le taux d'attrition observé dans chaque classe. Une ligne pointillée à 45 degrés marque la calibration parfaite, entourée d'une fine bande de tolérance grise. La courbe s'affaisse sous la diagonale du côté confiant, donc les prédictions à forte probabilité se réalisent moins souvent qu'annoncé (trop confiant, en rouge à droite) ; erreur de calibration attendue 10 %. Du côté timide, elle flotte au-dessus de la diagonale, donc le modèle sous-estime l'attrition (pas assez confiant, en bleu à gauche). Chaque point est dimensionné selon le nombre de prédictions dans la classe, et un histogramme en dessous montre où le modèle place ses prédictions. Données illustratives.
