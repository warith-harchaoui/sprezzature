? 'Spectrogram: a time-by-frequency heatmap of a short-time Fourier transform. A bright diagonal sweeps from low to high frequency (a rising tone), a solid band at the base is a steady bass drone, and three vertical streaks are percussive taps. Colour runs dark purple (quiet) to yellow (loud).'
: 'Spectrogramme : une carte de chaleur temps-fréquence d''une transformée de Fourier à court terme. Une diagonale claire balaie du grave à l''aigu (un son montant), une bande pleine à la base est un bourdon de basse continu, et trois traits verticaux sont des frappes percussives. La couleur va du violet foncé (faible) au jaune (fort).'
