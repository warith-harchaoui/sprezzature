? 'Force-directed (sfdp-style) layout of a synthetic research collaboration network: 318 researchers grouped into six labs, coloured by lab. Nodes are people, edges are co-authored papers, and node size grows with a person''s number of collaborators. The layout was precomputed in Python from a planted stochastic-block model — dense inside each lab, sparse across — so the six communities relax into six visible clusters. A thin web of 73 cross-lab co-authorships bridges the clusters, keeping the whole network a single connected component rather than six islands. Hover a legend swatch to isolate one lab and its bridges.'
: 'Disposition à forces (style sfdp) d''un réseau de collaboration de recherche synthétique : 318 chercheurs regroupés en six laboratoires, colorés par laboratoire. Les nœuds sont des personnes, les arêtes des articles cosignés, et la taille du nœud croît avec le nombre de collaborateurs. La disposition a été précalculée en Python à partir d''un modèle à blocs stochastiques planté, dense au sein de chaque laboratoire, clairsemé entre eux, si bien que les six communautés se détendent en six grappes visibles. Une fine toile de 73 cosignatures inter-laboratoires relie les grappes, gardant le réseau en une seule composante connexe plutôt que six îlots. Survolez une pastille de la légende pour isoler un laboratoire et ses ponts.'
? 'Force-directed node-link diagram of a microservice call graph. Each node is a service, coloured by owning team and sized by how many other services call it. Edges join services that call each other. The Auth service is the largest node: nearly every checkout, order and profile path calls it, so a stall in Auth cascades across the whole store. Hover or focus any service to highlight only the services it talks to.'
: 'Diagramme nœuds-liens à forces d''un graphe d''appels de microservices. Chaque nœud est un service, coloré par équipe propriétaire et dimensionné par le nombre d''autres services qui l''appellent. Les arêtes relient les services qui s''appellent. Le service Auth est le plus gros nœud : presque tous les parcours de paiement, de commande et de profil l''appellent, donc un blocage d''Auth se propage à toute la boutique. Survolez ou ciblez un service pour ne mettre en évidence que les services auxquels il parle.'
