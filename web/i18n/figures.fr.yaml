? Dependency wheel of internal migration between six regions of a country over a decade. Each region owns an arc on the ring sized by its total migration throughput; each ribbon is a directed flow carrying the origin region's colour, with a width proportional to the thousands of people who moved along it. The Southeast and Mountain West arcs are dominated by inbound ribbons from the Northeast, Midwest and Pacific Coast, while little colour flows back the other way, so the population drain runs in one direction.
: Roue de dépendances de la migration interne entre six régions d'un pays sur une décennie. Chaque région possède un arc sur l'anneau dimensionné par son débit migratoire total ; chaque ruban est un flux orienté portant la couleur de la région d'origine, d'une largeur proportionnelle aux milliers de personnes qui l'ont emprunté. Les arcs Sud-Est et Ouest montagneux sont dominés par des rubans entrants du Nord-Est, du Midwest et de la Côte Pacifique, tandis que peu de couleur revient en sens inverse, donc la fuite de population va dans un seul sens.
