? 'A horizontal timeline of 13 Mars-mission milestones from 1965 to a planned 2033, with alternating callouts above and below a central spine. Four coloured era bands group the missions: Flybys and Orbiters, First Landers, the Rover Age, and the planned Sample Return campaign.'
