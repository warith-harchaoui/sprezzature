'Difference chart: a near-navy line is actual monthly recurring revenue, a grey line is the board plan. The band between them is shaded blue where actual runs above plan (a surplus, strongest in spring) and red where it runs below (a shortfall through the summer)': 'Graphique de différence : une ligne bleu marine est le revenu récurrent mensuel réel, une ligne grise le plan du conseil. La bande entre elles est ombrée en bleu là où le réel dépasse le plan (un excédent, le plus fort au printemps) et en rouge là où il passe en dessous (un déficit pendant l’été)'
'Monthly spend vs. weekly active days, one dot per customer, hull per model-assigned segment': 'Dépense mensuelle vs jours actifs par semaine, un point par client, enveloppe par segment attribué par le modèle'
'Product & Engineering is 50% of headcount, the classic shape of a product-led software company.': 'Produit et Ingénierie représentent 50 % de l’effectif, la forme classique d’une entreprise logicielle guidée par le produit.'
'Revenue, activation and churn beat plan; trial signups and API latency still trail the goal': 'Revenu, activation et attrition dépassent le plan ; les essais et la latence API restent sous l’objectif'
'Share of online-store checkouts by device and payment method': 'Part des paiements en ligne par appareil et moyen de paiement'
'United Kingdom, 1990–2022: output per person up ~66% while carbon per person fell ~53%': 'Royaume-Uni, 1990–2022 : production par personne en hausse d’environ 66 % tandis que le carbone par personne a chuté d’environ 53 %'
'pair, so one cell measurement tells the families apart. The diagonal shows each distribution': 'paire, de sorte qu’une seule mesure distingue les familles. La diagonale montre chaque distribution'
'· one point per genetic variant · alternating tints separate chromosomes · hover a labelled peak for its position and p-value': '· un point par variant génétique · des teintes alternées séparent les chromosomes · survolez un pic étiqueté pour sa position et sa p-valeur'
'Dumbbell plot of median hourly pay for women (purple) and men (teal) across 10 roles, sorted by the size of the gap. Each row joins the two medians with a segment whose length is the gap. Men earn more in every role; the gap averages 11% and is widest for Sales director at $13 per hour': 'Graphique haltère du salaire horaire médian des femmes (violet) et des hommes (turquoise) sur 10 postes, triés par la taille de l’écart. Chaque ligne joint les deux médianes par un segment dont la longueur est l’écart. Les hommes gagnent plus dans chaque poste ; l’écart moyen est de 11 % et est le plus large pour Directeur commercial, à 13 $ de l’heure'
'Joint plot of a sleep study: a central scatter of mean reaction time (vertical, milliseconds, lower is better) against hours slept the night before (horizontal) for 120 volunteers, with a fitted trend line sloping downward — more sleep, faster responses. A green histogram along the top rail shows hours slept are roughly symmetric; a purple histogram along the right rail shows reaction time has a long slow upper tail': 'Graphique joint d’une étude du sommeil : un nuage central du temps de réaction moyen (vertical, millisecondes, plus c’est bas, mieux c’est) selon les heures de sommeil la nuit précédente (horizontal) pour 120 volontaires, avec une droite de tendance descendante — plus de sommeil, réponses plus rapides. Un histogramme vert le long du rail supérieur montre que les heures de sommeil sont à peu près symétriques ; un histogramme violet le long du rail droit montre que le temps de réaction a une longue traîne lente vers le haut'
'Connected scatter tracing carbon-dioxide emissions per person (vertical, tonnes) against economic output per person (horizontal, thousands of US dollars) for the United Kingdom, one point every five years from 1990 to 2022. The path first moves right as income rises, then turns sharply left and downward: output per person climbed about 66% while emissions per person fell about 53%, from 10.0 to 4.7 tonnes. The left-turning hook shows growth and carbon decoupling': 'Nuage connecté traçant les émissions de dioxyde de carbone par personne (vertical, tonnes) selon la production économique par personne (horizontal, milliers de dollars) pour le Royaume-Uni, un point tous les cinq ans de 1990 à 2022. Le tracé va d’abord vers la droite à mesure que le revenu augmente, puis tourne nettement à gauche et vers le bas : la production par personne a grimpé d’environ 66 % tandis que les émissions par personne ont chuté d’environ 53 %, de 10,0 à 4,7 tonnes. Le crochet vers la gauche montre le découplage entre croissance et carbone'
'Donut of speaking time per participant over a 40-minute round table. Each slice is a participant, labelled outside the ring with their name, duration (mm:ss) and share of the total as a percentage: Alice Nguyen 16:24 (41%), Marc Dubois 10:48 (27%), Sofia Rossi 7:12 (18%), Karim Haddad 5:36 (14%). The centre shows the total time, 40:00': 'Anneau du temps de parole par participant sur une table ronde de 40 minutes. Chaque part est un participant, étiqueté hors de l’anneau avec son nom, sa durée (mm:ss) et sa part du total en pourcentage : Alice Nguyen 16:24 (41 %), Marc Dubois 10:48 (27 %), Sofia Rossi 7:12 (18 %), Karim Haddad 5:36 (14 %). Le centre indique le temps total, 40:00'
'Bollinger band chart of one trading year of a mid-cap stock. A near-navy line is the daily close; a blue line is the 20-day simple moving average; a teal band spans two standard deviations above and below it. Through the summer the band pinches to its narrowest of the year — a volatility squeeze, marked in amber — after which the close pushes through the upper band and trends up along it — a breakout, marked in green': 'Bandes de Bollinger sur une année de bourse d’une valeur de moyenne capitalisation. Une ligne bleu marine est le cours de clôture quotidien ; une ligne bleue, la moyenne mobile simple sur 20 jours ; une bande turquoise s’étend à deux écarts-types au-dessus et en dessous. Au fil de l’été la bande se resserre à son minimum annuel — une compression de volatilité, en ambre — après quoi le cours franchit la bande supérieure et progresse le long d’elle — une sortie, en vert'
'A Bland-Altman agreement plot of paired systolic-pressure readings from a wrist monitor and an arm cuff. The horizontal axis is the mean of the two readings; the vertical axis is their difference (wrist minus arm). Each dot is one of 90 patients. A solid blue line marks the mean bias (-7.3 mmHg) and two dashed red lines mark the 95 percent limits of agreement (-15.3 to +0.7 mmHg). The bias sits below zero and the cloud tilts down to the right, so the wrist tends to read low, and more so at higher pressure': 'Diagramme de concordance de Bland-Altman de mesures appariées de pression systolique prises au poignet et au brassard. L’axe horizontal est la moyenne des deux mesures ; l’axe vertical, leur différence (poignet moins bras). Chaque point est l’un des 90 patients. Une ligne bleue pleine marque le biais moyen (-7,3 mmHg) et deux lignes rouges pointillées les limites de concordance à 95 % (-15,3 à +0,7 mmHg). Le biais est sous zéro et le nuage penche vers le bas à droite : le poignet tend à sous-estimer, davantage à pression élevée'
'Pareto chart of one week of customer-support tickets (1,205 total). Bars show each reason’s share of tickets, sorted tallest-first against the left percentage axis; the 4 tallest are tinted blue as the “vital few” and the remaining 5 fade to grey as the “trivial many”. An orange line traces the cumulative share against the right percentage axis, climbing to 100 %. The dashed 80 % Pareto line marks the 80/20 threshold: the cumulative curve first clears it at reason 4, so 4 reasons account for 82 % of tickets (991 of 1,205)': 'Diagramme de Pareto d’une semaine de tickets de support client (1 205 au total). Les barres montrent la part de tickets de chaque motif, triées de la plus haute à la plus basse contre l’axe de pourcentage de gauche ; les 4 plus hautes sont en bleu comme le « petit nombre décisif » et les 5 restantes s’estompent en gris comme la « multitude négligeable ». Une ligne orange trace la part cumulée contre l’axe de pourcentage de droite, montant à 100 %. La ligne de Pareto pointillée à 80 % marque le seuil 80/20 : la courbe cumulée la franchit d’abord au motif 4, donc 4 motifs représentent 82 % des tickets (991 sur 1 205)'
'A scatterplot matrix (pair plot) of a fleet of lithium-ion battery cells from three chemistries: NMC-811 high-nickel, LFP iron-phosphate, and a fast-charging silicon-anode cell. The four measured properties crossed in the grid are usable energy density, fast-charge time, internal resistance, and rated cycle life. Off-diagonal cells are scatter plots where each chemistry has its own hue and marker shape (circle, square, triangle) so the families stay apart for colour-blind and greyscale readers; diagonal cells show each property’s per-chemistry distribution as a density curve. On every pair the three chemistries form three separated clusters: silicon-anode is high-density and fast-charging but short-lived, LFP is the durable long-cycle-life workhorse, and NMC-811 sits between them, so one cell measurement is enough to identify the family': 'Matrice de nuages de points (pair plot) d’un parc de cellules lithium-ion de trois chimies : NMC-811 riche en nickel, LFP lithium-fer-phosphate, et une cellule à anode silicium à charge rapide. Les quatre propriétés mesurées croisées dans la grille sont la densité d’énergie utile, le temps de charge rapide, la résistance interne et la durée de vie nominale en cycles. Les cellules hors diagonale sont des nuages de points où chaque chimie a sa teinte et sa forme de marqueur (cercle, carré, triangle) pour rester distinctes en daltonisme et en niveaux de gris ; les cellules diagonales montrent la distribution de chaque propriété par chimie sous forme de courbe de densité. Sur chaque paire les trois chimies forment trois grappes séparées : l’anode silicium est dense et rapide à charger mais peu durable, la LFP est la solution durable à longue durée de vie, et la NMC-811 se situe entre les deux, de sorte qu’une seule mesure suffit à identifier la famille'
'Cumulative-gain chart for a churn-prevention campaign. The horizontal axis is the share of customers contacted, working down a list ranked by the model’s predicted churn risk; the vertical axis is the share of all churners reached. Three curves: a dashed grey diagonal is the random baseline (contacting X % reaches X % of churners); a thin green line is the perfect model, the ceiling, rising steeply then flattening once every churner is captured; and a thick blue line is the actual model, sitting between the two. The shaded blue band between the model and the diagonal is the value the model adds. A marker shows the operating point: contacting the riskiest 20 % reaches 63 % of churners, 3.16× better than random': 'Courbe de gain cumulé pour une campagne de rétention. L’axe horizontal est la part de clients contactés, en descendant une liste classée par le risque d’attrition prédit par le modèle ; l’axe vertical, la part de tous les partants atteints. Trois courbes : une diagonale grise pointillée est la référence aléatoire (contacter X % atteint X % des partants) ; une fine ligne verte est le modèle parfait, le plafond, montant fortement puis se stabilisant une fois tous les partants captés ; et une épaisse ligne bleue est le modèle réel, entre les deux. La bande bleue ombrée entre le modèle et la diagonale est la valeur ajoutée par le modèle. Un repère montre le point de fonctionnement : contacter les 20 % les plus à risque atteint 63 % des partants, 3,16× mieux que le hasard'
'Precision-recall curves for two fraud-detection classifiers on an imbalanced problem (fraud prevalence 3%). The horizontal axis is recall (share of fraud caught); the vertical axis is precision (share of flagged transactions that are fraud); both run from 0 to 1. The strong gradient-boosted model (solid blue, circle marker, average precision 0.93) sits well above the weaker logistic baseline (dashed orange, square marker, average precision 0.20) across the whole recall range. A dashed grey no-skill baseline runs flat at precision equal to the 3% prevalence; the vertical gap above it is the signal each model has learned. Faint iso-F1 contours arc through the plot, and each model is marked at its shipped maximum-F1 operating point': 'Courbes précision-rappel pour deux classifieurs de détection de fraude sur un problème déséquilibré (prévalence de fraude 3 %). L’axe horizontal est le rappel (part de fraudes détectées) ; l’axe vertical, la précision (part des transactions signalées qui sont des fraudes) ; les deux vont de 0 à 1. Le modèle fort à gradient boosté (bleu plein, marqueur rond, précision moyenne 0,93) est bien au-dessus de la référence logistique plus faible (orange pointillé, marqueur carré, précision moyenne 0,20) sur toute la plage de rappel. Une référence grise pointillée « sans compétence » reste plate à une précision égale à la prévalence de 3 % ; l’écart vertical au-dessus est le signal appris par chaque modèle. De faibles courbes iso-F1 traversent le graphique, et chaque modèle est repéré à son point de fonctionnement F1 maximal retenu'
'Probability-probability (P-P) plot checking whether a fitted Normal distribution describes right-skewed customer session durations. The horizontal axis is the theoretical cumulative probability under the fitted Normal; the vertical axis is the empirical cumulative probability of the observed data; both run from 0 to 1. A dashed 45-degree reference line marks perfect agreement, ringed by a faint grey tolerance band. Instead of hugging the line the points bow into a smooth arc (traced by a red trend curve): in the lower-left they sit above the diagonal, where the Normal under-states the probability (blue); in the upper-right they sit below it, where the Normal over-states the probability (orange). That S-shaped departure is the classic sign that a symmetric Normal is the wrong shape for skewed data': 'Diagramme probabilité-probabilité (P-P) vérifiant si une loi normale ajustée décrit des durées de session client à asymétrie droite. L’axe horizontal est la probabilité cumulée théorique sous la Normale ajustée ; l’axe vertical, la probabilité cumulée empirique des données observées ; les deux vont de 0 à 1. Une diagonale pointillée à 45 degrés marque l’accord parfait, entourée d’une faible bande de tolérance grise. Au lieu de suivre la ligne, les points s’incurvent en un arc régulier (tracé par une courbe rouge) : en bas à gauche ils sont au-dessus de la diagonale, où la Normale sous-estime la probabilité (bleu) ; en haut à droite ils sont en dessous, où la Normale la surestime (orange). Cet écart en S est le signe classique qu’une Normale symétrique est la mauvaise forme pour des données asymétriques'
'Reliability diagram (calibration curve) for an overconfident customer-churn classifier. The horizontal axis is the model’s predicted probability of churn; the vertical axis is the observed churn rate in each bin. A dashed 45-degree line marks perfect calibration, ringed by a faint grey tolerance band. The reliability curve sags below the diagonal at the confident end, so the model’s high-probability calls happen less often than it claims (overconfident, labelled in red on the right); Expected Calibration Error 10%. At the timid end it floats above the diagonal, so it under-states churn (underconfident, labelled in blue on the left). Each point is sized by how many predictions fell in the bin, and a histogram below shows where the model spends its predictions': 'Diagramme de fiabilité (courbe de calibration) pour un classifieur d’attrition trop confiant. L’axe horizontal est la probabilité d’attrition prédite par le modèle ; l’axe vertical, le taux d’attrition observé dans chaque tranche. Une ligne pointillée à 45 degrés marque la calibration parfaite, entourée d’une faible bande de tolérance grise. La courbe de fiabilité passe sous la diagonale du côté confiant, donc les prédictions à forte probabilité surviennent moins souvent qu’annoncé (trop confiant, en rouge à droite) ; erreur de calibration attendue 10 %. Du côté timide elle flotte au-dessus de la diagonale, donc il sous-estime l’attrition (pas assez confiant, en bleu à gauche). Chaque point est dimensionné par le nombre de prédictions tombées dans la tranche, et un histogramme en dessous montre où le modèle place ses prédictions'
'Square-binned density map of Riverbend. The city is tiled with a regular grid of 292 square cells, each 400 metres on a side, shaded by the number of reported night-time incidents that fell inside it, from 2,386 incidents in all. The single-hue red ramp runs from pale (few incidents) to deep red (the busiest cell, 66 incidents). Incidents concentrate in the downtown core and around the transit hub and fade toward the city edge; the river channel and two parks stay empty. A north arrow (north is up) and a 2-kilometre scale bar orient the map.': 'Carte de densité à cases carrées de Riverbend. La ville est pavée d’une grille régulière de 292 cases carrées de 400 mètres de côté, teintées selon le nombre d’incidents nocturnes signalés à l’intérieur, sur 2 386 incidents au total. Le dégradé rouge monochrome va du pâle (peu d’incidents) au rouge profond (la case la plus chargée, 66 incidents). Les incidents se concentrent dans le centre-ville et autour du pôle de transport et s’estompent vers les bords de la ville ; le lit de la rivière et deux parcs restent vides. Une flèche du nord (le nord est en haut) et une échelle de 2 kilomètres orientent la carte.'
