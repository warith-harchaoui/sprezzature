? 'Icicle / flame graph of one GET /api/checkout request totalling 480 milliseconds. The root bar spans the full width; each row below splits its parent by time. The highlighted warm tower load_cart to fetch_user_orders to run_sql to wait_on_lock is the critical path: wait_on_lock alone is 176 ms, about 37 percent of the request, and run_sql as a whole is 214 ms, about 45 percent. Off-path calls (authenticate, render_response) are shown in muted grey.'
: 'Graphique en stalactites / flame graph d''une requête GET /api/checkout totalisant 480 millisecondes. La barre racine occupe toute la largeur ; chaque ligne en dessous divise son parent par le temps. La tour chaude en surbrillance load_cart vers fetch_user_orders vers run_sql vers wait_on_lock est le chemin critique : wait_on_lock à lui seul fait 176 ms, environ 37 pour cent de la requête, et run_sql dans son ensemble fait 214 ms, environ 45 pour cent. Les appels hors chemin (authenticate, render_response) sont en gris atténué.'
