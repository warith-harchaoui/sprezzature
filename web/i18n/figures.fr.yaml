? 'Pareto chart of one week of customer-support tickets (1,205 total, illustrative). Bars show each reason’s share of tickets, sorted tallest-first against the left percentage axis; the 4 tallest are tinted blue as the “vital few” and the remaining 5 fade to grey as the “trivial many”. An orange line traces the cumulative share against the right percentage axis, climbing to 100 %. The dashed 80 % Pareto line marks the 80/20 threshold: the cumulative curve first clears it at reason 4, so 4 reasons account for 82 % of tickets (991 of 1,205). Illustrative figures.'
: 'Diagramme de Pareto d''une semaine de tickets de support client (1 205 au total, illustratif). Les barres montrent la part de tickets de chaque motif, triées de la plus haute à la plus basse contre l''axe des pourcentages de gauche ; les 4 plus hautes sont en bleu comme les « quelques essentiels » et les 5 restantes s''estompent en gris comme les « nombreux secondaires ». Une ligne orange trace la part cumulée contre l''axe des pourcentages de droite, montant à 100 %. La ligne de Pareto pointillée à 80 % marque le seuil 80/20 : la courbe cumulée le franchit d''abord au motif 4, donc 4 motifs représentent 82 % des tickets (991 sur 1 205). Données illustratives.'
