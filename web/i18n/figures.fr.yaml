? Spike map of the world's largest urban agglomerations. A vertical spike is planted at each city; its height is proportional to the metropolitan population (2024 order of magnitude, United Nations World Urbanization Prospects). Hover or focus a spike to read its city and population; its neighbours dim so the skyline is explorable. The tallest spikes cluster over East and South Asia — Tokyo (37 million), Delhi (34 million) and Shanghai (30 million) — while the Americas, Africa and Europe carry shorter, sparser spikes.
: Carte à pics des plus grandes agglomérations urbaines du monde. Un pic vertical est planté à chaque ville ; sa hauteur est proportionnelle à la population métropolitaine (ordre de grandeur 2024, Perspectives de l'urbanisation mondiale de l'ONU). Survolez ou ciblez un pic pour lire sa ville et sa population ; ses voisins s'estompent pour rendre la skyline explorable. Les pics les plus hauts se regroupent sur l'Asie de l'Est et du Sud, Tokyo (37 millions), Delhi (34 millions) et Shanghai (30 millions), tandis que les Amériques, l'Afrique et l'Europe portent des pics plus courts et plus épars.
