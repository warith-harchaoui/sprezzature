? 'A parallel-sets (parcats) diagram routing 1,316 Titanic passengers across four categorical axes — travel class, sex, age group, and outcome. Each ribbon''s width is the number of people on that path, and its colour is the outcome: blue for survived, red for died. Women and children survived far more than men, and first class far more than third. Hover a ribbon to highlight one path.'
: 'Un diagramme en ensembles parallèles (parcats) acheminant 1 316 passagers du Titanic sur quatre axes catégoriels : classe, sexe, tranche d''âge et issue. La largeur de chaque ruban est le nombre de personnes sur ce chemin, et sa couleur est l''issue : bleu pour survécu, rouge pour décédé. Les femmes et les enfants ont bien plus survécu que les hommes, et la première classe bien plus que la troisième. Survolez un ruban pour mettre en évidence un chemin.'
