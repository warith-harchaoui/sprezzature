? Streamplot of a synthetic surface-wind field. Curved lines are streamlines everywhere tangent to the wind; arrowheads mark the flow direction and each line's colour runs from pale blue for a light breeze to deep navy for the fastest wind. A steady westerly sweeps in from the left, and a cyclonic low-pressure centre spins the flow counter-clockwise into a tight spiral offshore.
: Tracé de lignes de courant d'un champ de vent de surface synthétique. Les courbes sont des lignes de courant partout tangentes au vent ; les pointes de flèche indiquent le sens du flux et la couleur de chaque ligne va du bleu pâle pour une brise légère au bleu marine profond pour le vent le plus fort. Un flux d'ouest régulier arrive par la gauche, et un centre dépressionnaire cyclonique enroule le flux dans le sens antihoraire en une spirale serrée au large.
