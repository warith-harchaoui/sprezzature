? 'An interpolated heatmap (imshow, bilinear): a coarse soil-moisture survey grid displayed as one smooth continuous image, east-west by north-south. A deep-blue basin near the low-left is the moisture-holding hollow, the pale far corner is a free-draining ridge, and a faint blue horizontal band is a damp irrigation drip line. Colour runs pale sky (driest) to deep navy (wettest).'
: 'Carte de chaleur interpolée (imshow, bilinéaire) : une grille grossière de relevé d''humidité du sol affichée en une seule image lisse et continue, d''est en ouest par nord-sud. Un bassin bleu foncé près du bas-gauche est le creux qui retient l''humidité, le coin pâle au loin est une crête à drainage libre, et une faible bande horizontale bleue est une ligne de goutte-à-goutte humide. La couleur va du bleu ciel pâle (le plus sec) au bleu marine profond (le plus humide).'
