? Square-binned density map of Riverbend (an illustrative city). The city is tiled with a regular grid of 292 square cells, each 400 metres on a side, shaded by the number of reported night-time incidents that fell inside it, from 2,386 incidents in all. The single-hue red ramp runs from pale (few incidents) to deep red (the busiest cell, 66 incidents). Incidents concentrate in the downtown core and around the transit hub and fade toward the city edge; the river channel and two parks stay empty. A north arrow (north is up) and a 2-kilometre scale bar orient the map.
: Carte de densité en grille carrée de Riverbend (une ville illustrative). La ville est pavée d'une grille régulière de 292 cellules carrées de 400 mètres de côté, colorées par le nombre d'incidents nocturnes signalés qui y sont tombés, sur 2 386 au total. Le dégradé de rouge à une teinte va du pâle (peu d'incidents) au rouge profond (la cellule la plus active, 66 incidents). Les incidents se concentrent au centre-ville et autour du pôle de transport et s'estompent vers la périphérie ; le lit de la rivière et deux parcs restent vides. Une flèche du nord (le nord est en haut) et une échelle de 2 kilomètres orientent la carte.
