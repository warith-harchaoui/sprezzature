? 'Voronoi catchment map of thirty city pharmacies. Each cell is the neighbourhood for which one pharmacy is the closest to walk to, and its colour marks the chain that owns the shop: Greenleaf, Meridian Health, Cedar and Co, Aster Drugstore, and independent chemists. Greenleaf''s stores sit on the roomy outskirts, so its cells cover about 35 percent of the city''s area, the largest share of any chain, even though Meridian has almost as many shops packed into the dense centre. Seed dots mark each pharmacy; a few flagship stores are labelled. Hover or focus any cell to lift its whole chain''s territory and dim the rest.'
: 'Carte de chalandise de Voronoï de trente pharmacies de la ville. Chaque cellule est le quartier pour lequel une pharmacie est la plus proche à pied, et sa couleur marque l''enseigne propriétaire : Greenleaf, Meridian Health, Cedar and Co, Aster Drugstore et les pharmacies indépendantes. Les boutiques Greenleaf occupent les périphéries spacieuses, donc ses cellules couvrent environ 35 pour cent de l''aire de la ville, la plus grande part de toutes les enseignes, même si Meridian a presque autant de boutiques tassées dans le centre dense. Des points marquent chaque pharmacie ; quelques boutiques phares sont étiquetées. Survolez ou ciblez une cellule pour faire ressortir tout le territoire de son enseigne et estomper le reste.'
