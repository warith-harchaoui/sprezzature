? 'Probability-probability (P-P) plot checking whether a fitted Normal distribution describes right-skewed customer session durations. The horizontal axis is the theoretical cumulative probability under the fitted Normal; the vertical axis is the empirical cumulative probability of the observed data; both run from 0 to 1. A dashed 45-degree reference line marks perfect agreement, ringed by a faint grey tolerance band. Instead of hugging the line the points bow into a smooth arc (traced by a red trend curve): in the lower-left they sit above the diagonal, where the Normal under-states the probability (blue); in the upper-right they sit below it, where the Normal over-states the probability (orange). That S-shaped departure is the classic sign that a symmetric Normal is the wrong shape for skewed data. Illustrative data.'
: 'Diagramme probabilité-probabilité (P-P) vérifiant si une loi normale ajustée décrit des durées de session client asymétriques à droite. L''axe horizontal est la probabilité cumulée théorique sous la normale ajustée ; l''axe vertical est la probabilité cumulée empirique des données observées ; les deux vont de 0 à 1. Une ligne de référence pointillée à 45 degrés marque l''accord parfait, entourée d''une fine bande de tolérance grise. Au lieu de coller à la ligne, les points se courbent en un arc lisse (tracé par une courbe de tendance rouge) : en bas à gauche ils sont au-dessus de la diagonale, où la normale sous-estime la probabilité (bleu) ; en haut à droite ils sont en dessous, où la normale surestime la probabilité (orange). Cet écart en forme de S est le signe classique qu''une normale symétrique est la mauvaise forme pour des données asymétriques. Données illustratives.'
