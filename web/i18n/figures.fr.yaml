? Interactive embedding projector. Two hundred everyday English words from six semantic families (Animals, Colours, Countries, Fruits, Instruments, Sports) are shown as coloured dots, each placed by a high-dimensional word embedding projected down to two dimensions, so words that mean similar things land near one another and form six visible clusters. A handful of representative words per family carry always-on labels. Hover, focus with the keyboard, or tap any dot to highlight it, draw thin curved lines to its six nearest neighbours, reveal the word and its neighbours' labels, and dim the rest so the local neighbourhood stands out; most neighbours belong to the same family, with the occasional border word from a neighbouring family. A cluster legend at the bottom isolates one family on hover. The figure is shown as a static scatter when scripting is off.
: Projecteur de plongements interactif. Deux cents mots anglais courants de six familles sémantiques (Animaux, Couleurs, Pays, Fruits, Instruments, Sports) sont montrés comme des points colorés, chacun placé par un plongement lexical de haute dimension projeté en deux dimensions, si bien que les mots de sens proche atterrissent près les uns des autres et forment six grappes visibles. Quelques mots représentatifs par famille portent une étiquette permanente. Survolez, ciblez au clavier ou tapez un point pour le mettre en évidence, tracer de fines courbes vers ses six plus proches voisins, révéler le mot et les étiquettes de ses voisins, et estomper le reste pour faire ressortir le voisinage local ; la plupart des voisins appartiennent à la même famille, avec parfois un mot frontière d'une famille voisine. Une légende de grappes en bas isole une famille au survol. La figure est montrée en nuage statique quand les scripts sont désactivés.
