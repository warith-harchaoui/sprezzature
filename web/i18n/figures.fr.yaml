A cold front swings the wind hard around the coast: Un front froid fait pivoter brutalement le vent autour de la côte
A few support-ticket reasons drive most of the weekly backlog: Quelques motifs de tickets provoquent l'essentiel de l'arriéré hebdomadaire
'A field is never idle: the winter-wheat year': 'Un champ n''est jamais au repos : l''année du blé d''hiver'
A good night's sleep sharpens reaction time: Une bonne nuit de sommeil aiguise les réflexes
? 'A horizontal timeline of 13 Mars-mission milestones from 1965 to a planned 2033, with alternating callouts above and below a central spine. Four coloured era bands group the missions: Flybys and Orbiters, First Landers, the Rover Age, and the planned Sample Return campaign.'
: 'Une chronologie horizontale de 13 jalons de missions martiennes, de 1965 à un 2033 prévu, avec des annotations alternées au-dessus et au-dessous d''une colonne centrale. Quatre bandes d''ère colorées regroupent les missions : Survols et orbiteurs, Premiers atterrisseurs, l''Âge des rovers, et la campagne prévue de retour d''échantillons.'
A late-summer squeeze coiled the range, then price broke out to the upside: Un resserrement de fin d'été a comprimé la fourchette, puis le cours a percé à la hausse
A machine-learning syllabus, branch by branch: Un programme d'apprentissage automatique, branche par branche
? 'A parallel-sets (parcats) diagram routing 1,316 Titanic passengers across four categorical axes — travel class, sex, age group, and outcome. Each ribbon''s width is the number of people on that path, and its colour is the outcome: blue for survived, red for died. Women and children survived far more than men, and first class far more than third. Hover a ribbon to highlight one path.'
: 'Un diagramme en ensembles parallèles (parcats) acheminant 1 316 passagers du Titanic sur quatre axes catégoriels : classe, sexe, tranche d''âge et issue. La largeur de chaque ruban est le nombre de personnes sur ce chemin, et sa couleur est l''issue : bleu pour survécu, rouge pour décédé. Les femmes et les enfants ont bien plus survécu que les hommes, et la première classe bien plus que la troisième. Survolez un ruban pour mettre en évidence un chemin.'
A part-figure marks the remainder · rows sorted high to low: Une figure partielle marque le reste · lignes triées du plus grand au plus petit
A reservoir running a little low: Un réservoir un peu bas
A rising tone climbs the frequency axis over three seconds: Un son montant grimpe l'axe des fréquences en trois secondes
? 'A scatterplot matrix (pair plot) of a fleet of lithium-ion battery cells from three chemistries: NMC-811 high-nickel, LFP iron-phosphate, and a fast-charging silicon-anode cell. The four measured properties crossed in the grid are usable energy density, fast-charge time, internal resistance, and rated cycle life. Off-diagonal cells are scatter plots where each chemistry has its own hue and marker shape (circle, square, triangle) so the families stay apart for colour-blind and greyscale readers; diagonal cells show each property’s per-chemistry distribution as a density curve. On every pair the three chemistries form three separated clusters: silicon-anode is high-density and fast-charging but short-lived, LFP is the durable long-cycle-life workhorse, and NMC-811 sits between them, so one cell measurement is enough to identify the family. Illustrative data.'
: 'Matrice de nuages de points (graphique en paires) d''un parc de cellules lithium-ion de trois chimies : NMC-811 riche en nickel, LFP lithium-fer-phosphate et une cellule à anode silicium à charge rapide. Les quatre propriétés mesurées croisées dans la grille sont la densité d''énergie utile, le temps de charge rapide, la résistance interne et la durée de vie nominale. Les cases hors diagonale sont des nuages de points où chaque chimie a sa teinte et sa forme de marqueur (cercle, carré, triangle) pour que les familles restent distinctes en vision des couleurs déficiente et en niveaux de gris ; les cases de la diagonale montrent la distribution de chaque propriété par chimie sous forme de courbe de densité. Sur chaque paire, les trois chimies forment trois grappes séparées : l''anode silicium est dense et se charge vite mais dure peu, le LFP est la bête de somme durable à longue vie, et le NMC-811 se situe entre les deux, si bien qu''une seule mesure suffit à identifier la famille. Données illustratives.'
A single ripple ripples out, then fades to stillness: Une seule ondulation se propage, puis s'éteint
? 'A spiral-packed word cloud of a year of product reviews for a burr coffee grinder. Each word is sized by how many reviews mentioned it and tagged by theme with both a colour and a sign glyph: a leading plus and green for praise, a leading minus and red for complaints, and no glyph in blue for neutral product words. The biggest words are grind, quiet and consistent; the largest complaint word is noisy.'
: 'Un nuage de mots en spirale d''une année d''avis produit sur un moulin à café à meules. Chaque mot est dimensionné par le nombre d''avis qui le mentionnent et étiqueté par thème avec une couleur et un signe : un plus en tête et du vert pour l''éloge, un moins en tête et du rouge pour la plainte, et aucun signe en bleu pour les mots produit neutres. Les plus gros mots sont mouture, silencieux et régulier ; le plus gros mot de plainte est bruyant.'
? A variable-width column chart of the eight largest economies in 2023. Each column height is GDP per capita, each width is population, so the area is total GDP. The United States, a tall narrow column, and China, a short wide one, enclose similar area — 27.4 and 17.8 trillion US dollars — reached two different ways. India is the widest but shortest column. Illustrative figures, World Bank and IMF 2023 estimates.
: Diagramme en colonnes de largeur variable des huit plus grandes économies en 2023. La hauteur de chaque colonne est le PIB par habitant, sa largeur la population, donc l'aire est le PIB total. Les États-Unis, colonne haute et étroite, et la Chine, courte et large, enferment une aire semblable, 27,4 et 17,8 mille milliards de dollars, atteinte de deux façons différentes. L'Inde est la colonne la plus large mais la plus basse. Données illustratives, estimations Banque mondiale et FMI 2023.
