? Bollinger band chart of one trading year of a mid-cap stock. A near-navy line is the daily close; a blue line is the 20-day simple moving average; a teal band spans two standard deviations above and below it. Through the summer the band pinches to its narrowest of the year — a volatility squeeze, marked in amber — after which the close pushes through the upper band and trends up along it — a breakout, marked in green. Illustrative data.
: Graphique en bandes de Bollinger d'une année de bourse d'une valeur moyenne. Une ligne bleu marine est la clôture quotidienne ; une ligne bleue est la moyenne mobile simple à 20 jours ; une bande turquoise s'étend à deux écarts-types au-dessus et au-dessous. Durant l'été, la bande se pince à son plus étroit de l'année, un resserrement de volatilité marqué en ambre, après quoi la clôture perce la bande supérieure et progresse le long d'elle, une percée marquée en vert. Données illustratives.
