? Manhattan plot. The horizontal axis lays chromosomes 1 to 22 end to end; the vertical axis is the strength of each genetic variant's association with adult height, shown as minus log base ten of the p-value, so smaller p-values rise higher. Points alternate between two shades of blue by chromosome. A dashed red line marks the genome-wide significance threshold at p = 5e-8. Dozens of peaks on many different chromosomes rise above the line, the signature of a highly polygenic trait; the tallest, labelled with nearby genes, include ZBTB38 on chromosome 3, HMGA1 on chromosome 6, and HMGA2 on chromosome 12.
: Diagramme de Manhattan. L'axe horizontal aligne les chromosomes 1 à 22 bout à bout ; l'axe vertical est la force de l'association de chaque variant génétique avec la taille adulte, exprimée en moins log en base dix de la p-valeur, si bien que les p-valeurs plus petites montent plus haut. Les points alternent entre deux nuances de bleu selon le chromosome. Une ligne rouge pointillée marque le seuil de significativité pangénomique à p = 5e-8. Des dizaines de pics sur de nombreux chromosomes dépassent la ligne, signature d'un caractère fortement polygénique ; les plus hauts, étiquetés par les gènes voisins, incluent ZBTB38 sur le chromosome 3, HMGA1 sur le chromosome 6 et HMGA2 sur le chromosome 12.
