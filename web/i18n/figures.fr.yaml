: 'Un diagramme alluvial suivant 1 000 nouvelles inscriptions sur trois axes : canal d''acquisition, offre choisie et résultat à 90 jours. La largeur du ruban est proportionnelle au nombre d''utilisateurs sur ce chemin ; le brin Recommandation vers Conservé est le plus large, et les utilisateurs en essai gratuit partent bien plus que les payants. Survolez un ruban pour mettre en évidence un chemin.'
? 'An animated bubble chart in homage to Hans Rosling, built from real data for all countries, one frame per year from 1950 to 2025. Each bubble is a country: horizontal is GDP per capita (log scale), vertical is life expectancy, area is population, colour is world region. A year counter ticks year by year as the bubbles sweep up and to the right — Asia (red) moves the most, Africa (blue) stays lower-left, Europe (amber) and the Americas (green) sit rich and high. Historical federations (USSR, Yugoslavia, Czechoslovakia) show as one bubble until they dissolve, then their successor states appear; divided nations (East/West Germany, North/South Vietnam and Yemen) show as two bubbles until they merge into one. Recent years are part-projected: life expectancy and population for 2024-2025 are UN medium-variant projections and income for 2025 is a short trend extrapolation.'
: 'Bulles animées en hommage à Hans Rosling, construites à partir de données réelles pour tous les pays, une image par année de 1950 à 2025. Chaque bulle est un pays : l''horizontale est le PIB par habitant (échelle logarithmique), la verticale l''espérance de vie, l''aire la population, la couleur la région du monde. Un compteur d''années défile tandis que les bulles filent vers le haut et la droite · l''Asie (rouge) bouge le plus, l''Afrique (bleu) reste en bas à gauche, l''Europe (ambre) et les Amériques (vert) siègent riches et hautes. Les fédérations historiques (URSS, Yougoslavie, Tchécoslovaquie) apparaissent comme une seule bulle jusqu''à leur dissolution, puis leurs États successeurs surgissent ; les nations divisées (Allemagne de l''Est et de l''Ouest, Vietnam et Yémen du Nord et du Sud) apparaissent comme deux bulles jusqu''à leur réunification. Les années récentes sont en partie projetées : l''espérance de vie et la population de 2024-2025 sont des projections médianes de l''ONU et le revenu de 2025 une courte extrapolation de tendance.'
? 'An animated bubble chart in homage to Hans Rosling, one frame per year from 1950 to 2025. Each bubble is a country: horizontal is GDP per capita on a log scale, vertical is the share of children who reach their fifth birthday, area is population, colour is world region. The vertical axis uses a spread scale so that 90, 99 and 99.9 percent are evenly spaced, keeping the last hard-won gains visible instead of piling every country against the top. As the years tick by the whole cloud sweeps up and to the right: as countries grow richer, far more of their children live. Historical federations (USSR, Yugoslavia, Czechoslovakia) show as one bubble until they dissolve; divided nations (East and West Germany, North and South Vietnam and Yemen) show as two until they merge. Recent years are part-projected.'
: 'Bulles animées en hommage à Hans Rosling, une image par année de 1950 à 2025. Chaque bulle est un pays : l''horizontale est le PIB par habitant en échelle logarithmique, la verticale la part d''enfants qui atteignent leur cinquième anniversaire, l''aire la population, la couleur la région du monde. L''axe vertical emploie une échelle étalée pour que 90, 99 et 99,9 pour cent soient également espacés, gardant visibles les derniers gains durement acquis au lieu d''entasser tous les pays contre le sommet. À mesure que les années défilent, tout le nuage file vers le haut et la droite : plus les pays s''enrichissent, plus leurs enfants survivent. Les fédérations historiques (URSS, Yougoslavie, Tchécoslovaquie) apparaissent comme une seule bulle jusqu''à leur dissolution ; les nations divisées (Allemagne de l''Est et de l''Ouest, Vietnam et Yémen du Nord et du Sud) apparaissent comme deux jusqu''à leur réunification. Les années récentes sont en partie projetées.'
? 'An animated bubble chart in homage to Hans Rosling, one frame per year from 1950 to 2025. Each bubble is a country: horizontal is the fertility rate (births per woman, falling from right to left), vertical is life expectancy, area is population, colour is world region. As the years tick by the whole cloud sweeps up and to the left: families get smaller and lives get longer, together. In 1950 most countries sit on the right with five to seven children per woman and short lives; by 2025 nearly all have moved left below three children and up past seventy years. Africa (blue) still holds the high-fertility right edge but is closing the gap. Historical federations (USSR, Yugoslavia, Czechoslovakia) show as one bubble until they dissolve; divided nations (East and West Germany, North and South Vietnam and Yemen) show as two until they merge. Recent years are part-projected.'
: 'Bulles animées en hommage à Hans Rosling, une image par année de 1950 à 2025. Chaque bulle est un pays : l''horizontale est l''indice de fécondité (naissances par femme, décroissant de droite à gauche), la verticale l''espérance de vie, l''aire la population, la couleur la région du monde. À mesure que les années défilent, tout le nuage file vers le haut et la gauche : les familles rétrécissent et les vies s''allongent, ensemble. En 1950, la plupart des pays se tiennent à droite avec cinq à sept enfants par femme et des vies courtes ; en 2025, presque tous ont glissé à gauche sous trois enfants et au-dessus de soixante-dix ans. L''Afrique (bleu) tient encore le bord droit de forte fécondité mais comble l''écart. Les fédérations historiques (URSS, Yougoslavie, Tchécoslovaquie) apparaissent comme une seule bulle jusqu''à leur dissolution ; les nations divisées (Allemagne de l''Est et de l''Ouest, Vietnam et Yémen du Nord et du Sud) apparaissent comme deux jusqu''à leur réunification. Les années récentes sont en partie projetées.'
