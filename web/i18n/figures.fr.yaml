? 'Radar chart comparing three managed cloud databases — Aurora, Cloud SQL and Cosmos — across six criteria arranged as spokes: query speed, auto-scaling, ecosystem, ease of use, global reach and price, each scored 0 to 100 where the outer ring is best. Aurora forms a tall profile on query speed and auto-scaling; Cloud SQL peaks on ecosystem and ease of use; Cosmos reaches furthest on global reach and price. The three profiles cross, so no single database dominates.'
: 'Graphique radar comparant trois bases de données cloud managées, Aurora, Cloud SQL et Cosmos, sur six critères disposés en rayons : vitesse des requêtes, mise à l''échelle automatique, écosystème, facilité d''usage, portée mondiale et prix, chacun noté de 0 à 100 où l''anneau extérieur est le meilleur. Aurora dessine un profil élevé sur la vitesse des requêtes et la mise à l''échelle ; Cloud SQL culmine sur l''écosystème et la facilité d''usage ; Cosmos va le plus loin sur la portée mondiale et le prix. Les trois profils se croisent, aucune base ne domine.'
? Radial bar chart of an average weekday's bike-share departures, one bar per clock hour arranged around a 24-hour dial from midnight at the top. Bar length is the number of trips. The city is quietest before dawn, spikes at 08:00 as people ride to work, dips at midday, then climbs to its busiest hour at 18:00 as it rides home.
: Diagramme en barres radial des départs de vélos en libre-service un jour de semaine type, une barre par heure disposée autour d'un cadran de 24 heures depuis minuit en haut. La longueur de la barre est le nombre de trajets. La ville est la plus calme avant l'aube, culmine à 08:00 quand on part travailler, retombe à midi, puis grimpe jusqu'à son heure la plus chargée à 18:00 au retour.
