? 'Arc diagram of co-authorship in a research lab. Eleven researchers sit on one horizontal line, ordered so the Vision group clusters on the left and the Language group on the right. Each co-authored pairing is an arc rising above the line, its thickness proportional to the number of joint papers. Both groups collaborate densely inside themselves, drawing short low arcs. Only Nadia, in the centre, co-authors with people in both groups: her two long arcs sweeping across the diagram are the single bridge linking the two communities.'
: 'Diagramme en arcs des cosignatures dans un laboratoire de recherche. Onze chercheurs sont alignés sur une ligne horizontale, ordonnés pour que le groupe Vision se regroupe à gauche et le groupe Langage à droite. Chaque paire ayant cosigné est un arc s''élevant au-dessus de la ligne, d''une épaisseur proportionnelle au nombre d''articles communs. Les deux groupes collaborent densément en interne, dessinant de courts arcs bas. Seule Nadia, au centre, cosigne avec des personnes des deux groupes : ses deux longs arcs qui traversent le diagramme sont l''unique pont reliant les deux communautés.'
