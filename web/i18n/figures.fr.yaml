? Directed interruption matrix between 3 speakers. Each column is a speaker who cuts in, each row a speaker who gets cut off; a cell shows how many times the column speaker cut the row speaker, tinted in the interrupter's colour with an opacity proportional to the count. The diagonal is empty. The right column totals the interruptions received per row, the bottom row the interruptions made per column. Sarah Guo cuts in the most (22 times), Andrej Karpathy is cut off the most (30 times); the most frequent exchange is Sarah Guo cutting Andrej Karpathy 20 times. Illustrative data.
: Matrice d'interruptions orientée entre 3 intervenants. Chaque colonne est un intervenant qui coupe la parole, chaque ligne un intervenant qui se fait couper ; une cellule indique combien de fois l'intervenant en colonne a coupé celui en ligne, teintée dans la couleur de l'interrupteur avec une opacité proportionnelle au décompte. La diagonale est vide. La colonne de droite totalise les interruptions reçues par ligne, la ligne du bas les interruptions faites par colonne. Sarah Guo coupe le plus (22 fois), Andrej Karpathy est coupé le plus (30 fois) ; l'échange le plus fréquent est Sarah Guo coupant Andrej Karpathy 20 fois. Données illustratives.
