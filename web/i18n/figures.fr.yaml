? Coxcomb (polar-area) chart of army mortality in the Crimean War, April 1854 to March 1855. Twelve equal-angle wedges, one per month, sweep clockwise from the top; each wedge's radius is that month's annual death rate per 1,000 men, stacked and coloured by cause. The pale-blue preventable-disease band dwarfs the red wounds band in every month and balloons to its peak in Jan 1855, then shrinks through the spring after sanitary reform.
: Diagramme polaire (coxcomb) de la mortalité de l'armée pendant la guerre de Crimée, d'avril 1854 à mars 1855. Douze secteurs d'angle égal, un par mois, tournent dans le sens horaire depuis le haut ; le rayon de chaque secteur est le taux annuel de décès du mois pour 1 000 hommes, empilé et coloré par cause. La bande bleu pâle des maladies évitables écrase la bande rouge des blessures chaque mois et enfle jusqu'à son sommet en janvier 1855, puis se rétracte au printemps après la réforme sanitaire.
