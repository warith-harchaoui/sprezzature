? 'Cumulative-gain chart for a churn-prevention campaign (illustrative). The horizontal axis is the share of customers contacted, working down a list ranked by the model’s predicted churn risk; the vertical axis is the share of all churners reached. Three curves: a dashed grey diagonal is the random baseline (contacting X % reaches X % of churners); a thin green line is the perfect model, the ceiling, rising steeply then flattening once every churner is captured; and a thick blue line is the actual model, sitting between the two. The shaded blue band between the model and the diagonal is the value the model adds. A marker shows the operating point: contacting the riskiest 20 % reaches 63 % of churners, 3.16× better than random. Illustrative figures.'
: 'Courbe de gain cumulé pour une campagne de prévention de l''attrition (illustrative). L''axe horizontal est la part des clients contactés, en descendant une liste classée par le risque d''attrition prédit ; l''axe vertical est la part de tous les partants touchés. Trois courbes : une diagonale grise pointillée est la référence aléatoire (contacter X % touche X % des partants) ; une fine ligne verte est le modèle parfait, le plafond, qui monte vite puis s''aplatit une fois tous les partants capturés ; et une épaisse ligne bleue est le modèle réel, entre les deux. La bande bleue ombrée entre le modèle et la diagonale est la valeur ajoutée par le modèle. Un repère montre le point de fonctionnement : contacter les 20 % les plus à risque touche 63 % des partants, 3,16× mieux que le hasard. Données illustratives.'
