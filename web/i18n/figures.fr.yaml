? 'Connected scatter tracing carbon-dioxide emissions per person (vertical, tonnes) against economic output per person (horizontal, thousands of US dollars) for the United Kingdom, one point every five years from 1990 to 2022. The path first moves right as income rises, then turns sharply left and downward: output per person climbed about 66% while emissions per person fell about 53%, from 10.0 to 4.7 tonnes. The left-turning hook shows growth and carbon decoupling. Illustrative figures.'
