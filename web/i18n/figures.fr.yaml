? Geographic hexbin map of the world. The globe is tiled with regular hexagons; each is shaded by the number of magnitude-5.5-and-above earthquakes that fell inside it, from 9,000 events in all. The warm ramp runs from pale straw (one or two quakes) through orange to deep red (the busiest cell, 218 quakes). The red cells draw a near-continuous horseshoe around the Pacific — the Ring of Fire — from the Andes up through Alaska and the Aleutians, down past Japan, the Philippines and Indonesia to Tonga, with a second belt along the Himalaya and the Mediterranean. Continental interiors and the deep ocean stay almost empty. Equal-area Equal Earth projection.
: Carte hexagonale géographique du monde. Le globe est pavé d'hexagones réguliers ; chacun est coloré par le nombre de séismes de magnitude 5,5 et plus qui y sont tombés, sur 9 000 au total. Le dégradé chaud va du paille pâle (un ou deux séismes) à l'orange puis au rouge profond (la cellule la plus active, 218 séismes). Les cellules rouges dessinent un fer à cheval presque continu autour du Pacifique, la ceinture de feu, des Andes vers l'Alaska et les Aléoutiennes, en descendant par le Japon, les Philippines et l'Indonésie jusqu'aux Tonga, avec une seconde ceinture le long de l'Himalaya et de la Méditerranée. Les intérieurs continentaux et l'océan profond restent presque vides. Projection Equal Earth à aires égales.
