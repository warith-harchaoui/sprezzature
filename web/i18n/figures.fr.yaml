? Precision-recall curves for two fraud-detection classifiers on an imbalanced problem (fraud prevalence 3%). The horizontal axis is recall (share of fraud caught); the vertical axis is precision (share of flagged transactions that are fraud); both run from 0 to 1. The strong gradient-boosted model (solid blue, circle marker, average precision 0.93) sits well above the weaker logistic baseline (dashed orange, square marker, average precision 0.20) across the whole recall range. A dashed grey no-skill baseline runs flat at precision equal to the 3% prevalence; the vertical gap above it is the signal each model has learned. Faint iso-F1 contours arc through the plot, and each model is marked at its shipped maximum-F1 operating point. Illustrative data.
: Courbes précision-rappel de deux classifieurs de détection de fraude sur un problème déséquilibré (prévalence de fraude 3 %). L'axe horizontal est le rappel (part des fraudes détectées) ; l'axe vertical est la précision (part des transactions signalées qui sont des fraudes) ; les deux vont de 0 à 1. Le modèle de gradient boosting fort (bleu plein, marqueur rond, précision moyenne 0,93) se situe bien au-dessus de la régression logistique plus faible (orange pointillé, marqueur carré, précision moyenne 0,20) sur toute la plage de rappel. Une référence sans compétence grise pointillée est plate à une précision égale à la prévalence de 3 % ; l'écart vertical au-dessus est le signal appris par chaque modèle. De faibles courbes iso-F1 traversent le graphique, et chaque modèle est repéré à son point de fonctionnement F1 maximal retenu. Données illustratives.
