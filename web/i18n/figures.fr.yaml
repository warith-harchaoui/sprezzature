? A circular liquid-fill gauge shaped like a water tank. Wavy blue liquid fills the vessel to 63 percent of its height, with a bold percentage readout at the centre. A dashed line marks the ten-year seasonal median of 68 percent, which sits just above the current level.
: Jauge circulaire à remplissage en forme de citerne. Un liquide bleu ondulé remplit la cuve à 63 pour cent de sa hauteur, avec un pourcentage en gras au centre. Une ligne pointillée marque la médiane saisonnière décennale de 68 pour cent, juste au-dessus du niveau actuel.
