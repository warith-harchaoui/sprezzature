? Hemicycle chart of a 289-seat national assembly after a general election. Each dot is one seat, arranged in 10 arced rows and coloured by party. Seats run left to right across the political spectrum. A majority needs 145 seats; the largest party, Social Democrats, holds 136 and falls 9 short, so no party can govern alone and a coalition is required.
: Hémicycle d'une assemblée nationale de 289 sièges après des législatives. Chaque point est un siège, disposé en 10 rangées arquées et coloré par parti. Les sièges vont de gauche à droite sur l'échiquier politique. Une majorité requiert 145 sièges ; le plus grand parti, les Sociaux-démocrates, en détient 136 et en manque 9, donc aucun parti ne peut gouverner seul et une coalition est nécessaire.
? 'Hexbin density map: the coastal-metro service area is tiled with 164 regular hexagons, each shaded by the number of morning bike-share trips that started inside it, from 3,200 trips in all. The single-hue blue ramp runs from pale (few trips) to deep blue (the busiest cell, 116 trips). Trips concentrate in the downtown core and along the waterfront and fade toward the suburban edge.'
: 'Carte de densité en hexagones : la zone de service du métro côtier est pavée de 164 hexagones réguliers, chacun coloré par le nombre de trajets de vélos en libre-service du matin qui y ont débuté, sur 3 200 trajets au total. Le dégradé de bleu à une teinte va du pâle (peu de trajets) au bleu profond (la cellule la plus active, 116 trajets). Les trajets se concentrent au centre-ville et le long du front de mer et s''estompent vers la périphérie.'
? 'Hierarchical circle-packing diagram of a Python web-service source tree. Six top-level packages are drawn as large circles, each tinted its own color, and every module inside is a nested circle sized by its lines of code. The services package is the largest and holds payments.py, the single biggest module at 2,410 lines, followed by api, models, workers, core, and tests. The packing is gap-free: bigger balls mean more code.'
: 'Diagramme hiérarchique en cercles imbriqués d''une arborescence source de service web Python. Six paquets de premier niveau sont dessinés en grands cercles, chacun avec sa teinte, et chaque module à l''intérieur est un cercle imbriqué dimensionné par ses lignes de code. Le paquet services est le plus grand et contient payments.py, le plus gros module unique à 2 410 lignes, suivi de api, models, workers, core et tests. Le remplissage est sans espace : de plus grosses billes signifient plus de code.'
? Hierarchical edge-bundling diagram of the module-dependency graph of a web application. Modules sit on a circle grouped into six subsystems (Web UI, API, Auth, Billing, Data, Infra); each dependency between two modules is drawn as a smooth curve pulled toward the tree's common ancestor so that dependencies between the same two subsystems bundle into a single cable. The thickest cables run from every subsystem into Auth and from Billing into Data, marking the couplings a refactor must untangle first.
: Diagramme hiérarchique de regroupement d'arêtes du graphe de dépendances de modules d'une application web. Les modules sont sur un cercle groupés en six sous-systèmes (Interface web, API, Auth, Billing, Data, Infra) ; chaque dépendance entre deux modules est une courbe lisse tirée vers l'ancêtre commun de l'arbre, si bien que les dépendances entre les deux mêmes sous-systèmes se groupent en un seul câble. Les câbles les plus épais vont de chaque sous-système vers Auth et de Billing vers Data, marquant les couplages qu'un remaniement doit démêler en premier.
