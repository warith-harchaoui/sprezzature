? Letter-value (boxen) plot of request latency for three service tiers, 24,000 sampled requests each. Nested boxes step outward from the median through the middle 50%, 75%, 87.5% and deeper tails; a tick marks each tier's p99. Free tier has the widest, longest tail; Enterprise the tightest. Free-tier p99 latency (875 ms) runs 3.7× the Enterprise tail (239 ms), yet the median barely moves.
: Diagramme en valeurs de lettres (boxen) de la latence des requêtes pour trois niveaux de service, 24 000 requêtes échantillonnées chacun. Des boîtes imbriquées s'écartent de la médiane à travers les 50 %, 75 %, 87,5 % centraux et les traînes plus profondes ; un repère marque le p99 de chaque niveau. Le niveau gratuit a la traîne la plus large et la plus longue ; Enterprise la plus resserrée. La latence p99 du niveau gratuit (875 ms) vaut 3,7× la traîne Enterprise (239 ms), pourtant la médiane bouge à peine.
