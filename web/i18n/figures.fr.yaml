? A Bland-Altman agreement plot of paired systolic-pressure readings from a wrist monitor and an arm cuff. The horizontal axis is the mean of the two readings; the vertical axis is their difference (wrist minus arm). Each dot is one of 90 patients. A solid blue line marks the mean bias (-7.3 mmHg) and two dashed red lines mark the 95 percent limits of agreement (-15.3 to +0.7 mmHg). The bias sits below zero and the cloud tilts down to the right, so the wrist tends to read low, and more so at higher pressure. Illustrative data.
: Diagramme d'accord de Bland-Altman de mesures appariées de pression systolique par un tensiomètre au poignet et un brassard au bras. L'axe horizontal est la moyenne des deux mesures ; l'axe vertical est leur différence (poignet moins bras). Chaque point est l'un des 90 patients. Une ligne bleue pleine marque le biais moyen (-7,3 mmHg) et deux lignes rouges pointillées marquent les limites d'accord à 95 pour cent (-15,3 à +0,7 mmHg). Le biais est sous zéro et le nuage penche vers le bas à droite, donc le poignet a tendance à sous-estimer, davantage à haute pression. Données illustratives.
