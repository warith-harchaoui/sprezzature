<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="416" viewBox="0 0 1200 416" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="dp-title dp-desc">
<title id="dp-title">Support ticket first-response times, one dot per ticket</title>
<desc id="dp-desc">Wilkinson dot plot of 30 first-response times in hours. Each dot is one ticket, binned every 0.5 h and stacked. 63% of tickets were answered within the 4-hour target (blue); the 11 past it form the long tail (red).</desc>
<style>.dot{cursor:pointer}.dot:hover,.dot:focus{stroke:#FFFFFF;stroke-width:2.5}.dot:focus{outline:none}</style>
<rect width="1200" height="416" fill="#FFFFFF"/>
<text x="96" y="60" font-size="32" font-weight="700" fill="#1D1D1F">Most tickets get a reply within hours</text>
<text x="96" y="96" font-size="20" fill="#6E6E73">63% of 30 support tickets clear the 4-hour target; a thin red tail drags on · illustrative</text>
<line x1="518.4" y1="138.0" x2="518.4" y2="308.0" stroke="#6E6E73" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="528.4" y="136.0" font-size="17" fill="#6E6E73">4-hour target</text>
<line x1="96" y1="308.0" x2="1152" y2="308.0" stroke="#1D1D1F" stroke-width="1.5"/>
