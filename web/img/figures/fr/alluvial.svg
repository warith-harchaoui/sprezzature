<svg role="img" aria-label="Alluvial diagram of a SaaS sign-up cohort across acquisition channel, plan, and 90-day outcome" xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>Où finissent les nouvelles inscriptions après 90 jours</title><desc>Un diagramme alluvial suivant 1 000 nouvelles inscriptions sur trois axes : canal d'acquisition, offre choisie et résultat à 90 jours. La largeur du ruban est proportionnelle au nombre d'utilisateurs sur ce chemin ; le brin Recommandation vers Conservé est le plus large, et les utilisateurs en essai gratuit partent bien plus que les payants. Survolez un ruban pour mettre en évidence un chemin.</desc><style>.ribbon{transition:opacity .18s ease;}.flows:hover .ribbon{opacity:.14;}.flows .ribbon:hover{opacity:.95;}.flows .ribbon:focus{opacity:.95;outline:none;}@media (prefers-reduced-motion: reduce){.ribbon{transition:none;}}</style><rect width="1440" height="900" fill="#FFFFFF"/><text x="46" y="60" font-family="Roboto, system-ui, sans-serif" font-size="38" font-weight="600" fill="#1D1D1F">Où finissent les nouvelles inscriptions après 90 jours</text><text x="46" y="98" font-family="Roboto, system-ui, sans-serif" font-size="22" fill="#6E6E73">La recommandation génère le plus de rétention ; les utilisateurs en essai gratuit partent bien plus que les payants</text><text x="46" y="128" font-family="Roboto, system-ui, sans-serif" font-size="16" fill="#6E6E73">Cohorte illustrative de 1 000 inscriptions · largeur du ruban = nombre d'utilisateurs sur ce chemin</text><text x="46.0" y="154.0" font-family="Roboto Mono, monospace" font-size="15" letter-spacing="0.6" fill="#6E6E73" text-anchor="start">CANAL D'ACQUISITION</text><text x="757.0" y="154.0" font-family="Roboto Mono, monospace" font-size="15" letter-spacing="0.6" fill="#6E6E73" text-anchor="start">OFFRE CHOISIE</text><text x="1224.0" y="154.0" font-family="Roboto Mono, monospace" font-size="15" letter-spacing="0.6" fill="#6E6E73" text-anchor="s