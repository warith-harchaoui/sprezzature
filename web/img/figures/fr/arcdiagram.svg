<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="arc-title arc-desc"><title id="arc-title">Une chercheuse tient ensemble deux groupes de recherche</title><desc id="arc-desc">Diagramme en arcs des cosignatures dans un laboratoire de recherche. Onze chercheurs sont alignés sur une ligne horizontale, ordonnés pour que le groupe Vision se regroupe à gauche et le groupe Langage à droite. Chaque paire ayant cosigné est un arc s'élevant au-dessus de la ligne, d'une épaisseur proportionnelle au nombre d'articles communs. Les deux groupes collaborent densément en interne, dessinant de courts arcs bas. Seule Nadia, au centre, cosigne avec des personnes des deux groupes : ses deux longs arcs qui traversent le diagramme sont l'unique pont reliant les deux communautés.</desc><style>.arc{transition:stroke-opacity.18s ease,stroke-width.18s ease}#arcs:hover.arc{stroke-opacity:.12}#arcs.arc:hover,#arcs.arc:focus{stroke-opacity:1;stroke-width:9}.arc:focus,.node:focus{outline:none}</style><rect width="1240" height="760" fill="#FFFFFF"/><text x="92" y="62" font-size="32" font-weight="700" fill="#1D1D1F">Une chercheuse tient ensemble deux groupes de recherche</text><text x="92" y="94" font-size="18" fill="#6E6E73">Cosignatures dans un laboratoire cette année · nœuds ordonnés par groupe</text><line x1="70.0" y1="512" x2="1170.0" y2="512" stroke="#D2D2D7" stroke-width="1.5"/><g id="arcs" fill="none" stroke-linecap="round"><path class="arc" tabindex="0" role="img" aria-label="Nadia &amp; Haddad: 3 joint papers" d="M620.00,512.00 A52.80,203.33 0 0 1 725.60,512.00" stroke="#AF52DE" stroke-width="7.70" stroke-opacity="0.9"><title>Nadia &amp; Haddad : 3 articles communs</title></path><path class="arc" tabindex="0" role="img" aria-label="Park &amp; Lund: 3 joint papers" d="M1042.40,512.00 A52.80,203.33 0 0 1 1148.00,512.00" stroke="#FF9500" stroke-width="7.70" stroke-opacity="0.5"><title>Park &amp; Lund : 3 articles communs</title></path><path class="arc" tabindex="0" role="img" aria-label="Okafor &amp; Chen: 2 joint papers" d="M303.20,512.00 A52.80,203.33 0 0 1 408.80,512.00" stroke="#007AFF" stroke-width="6.00" stroke-opacity="0.5"><title>Okafor &amp; Chen : 2 articles communs</title></path><path class="arc" tabindex="0" role="img" aria-label="Ito &amp; Reyes: 4 joint papers" d="M92.00,512.00 A52.80,203.33 0 0 1 197.60,512.00" stroke="#007AFF" stroke-width="9.40" stroke-opacity="0.5"><title>Ito &amp; Reyes : 4 articles communs</title></path><path class="arc" tabindex="0" role="img" aria-label="Reyes &amp; Okafor: 3 joint papers" d="M197.60,512.00 A52.80,203.33 0 0 1 303.20,512.00" stroke="#007AFF" stroke-width="7.70" stroke-opacity="0.5"><title>Reyes &amp; Okafor : 3 articles communs</title></path><path class="arc" tabindex="0" role="img" aria-label="Chen &amp; Novak: 3 joint papers" d="M408.80,512.00 A52.80,203.33 0 0 1 514.40,512.00" stroke="#007AFF" stroke-width="7.70" stroke-opacity="0.5"><title>Chen &amp; Novak : 3 articles communs</title></path><path class="arc" tabindex="0" role="img" aria-label="Novak &amp; Nadia: 2 joint papers" d="M514.40,512.00 A52.80,203.33 0 0 1 620.00,512.00" stroke="#AF52DE" stroke-width="6.00" stroke-opacity="0.9"><title>Novak &amp; Nadia : 2 articles communs</title></path><path class="arc" tabindex="0" role="img" aria-label="Haddad &amp; Silva: 4 joint papers" d="M725.60,512.00 A52.80,203.33 0 0 1 831.20,512.00" stroke="#FF9500" stroke-width="9.40" stroke-opacity="0.5"><title>Haddad &amp; Silva : 4 articles communs</title></path><path class="arc" tabindex="0" role="img" aria-label="Silva &amp; Weber: 3 joint papers" d="M831.20,512.00 A52.80,203.33 0 0 1 936.80,512.00" stroke="#FF9500" stroke-width="7.70" stroke-opacity="0.5"><title>Silva &amp; Weber : 3 articles communs</title></path><path class="arc" tabindex="0" role="img" aria-label="Weber &amp; Park: 2 joint papers" d="M936.80,512.00 A52.80,203.33 0 0 1 1042.40,512.00" stroke="#FF9500" stroke-width="6.00" stroke-opacity="0.5"><title>Weber &amp; Park : 2 articles communs</title></path><path class="arc" tabindex="0" role="img" aria-label="Nadia &amp; Silva: 2 joint papers" d="M620.00,512.00 A105.60,263.52 0 0 1 831.20,512.00" stroke="#AF52DE" stroke-width="6.00" stroke-opacity="0.9"><title>Nadia &amp; Silva : 2 articles communs</title></path><path class="arc" tabindex="0" role="img" aria-label="Reyes &amp; Chen: 1 joint paper" d="M197.60,512.00 A105.60,263.52 0 0 1 408.80,512.00" stroke="#007AFF" stroke-width="4.30" stroke-opacity="0.5"><title>Reyes &amp; Chen : 1 article commun</title></path><path class="arc" tabindex="0" role="img" aria-label="Ito &amp; Okafor: 2 joint papers" d="M92.00,512.00 A105.60,263.52 0 0 1 303.20,512.00" stroke="#007AFF" stroke-width="6.00" stroke-opacity="0.5"><title>Ito &amp; Okafor : 2 articles communs</title></path><path class="arc" tabindex="0" role="img" aria-label="Haddad &amp; Weber: 2 joint papers" d="M725.60,512.00 A105.60,263.52 0 0 1 936.80,512.00" stroke="#FF9500" stroke-width="6.00" stroke-opacity="0.5"><title>Haddad &amp; Weber : 2 articles communs</title></path><path class="arc" tabindex="0" role="img" aria-label="Silva &amp; Park: 1 joint paper" d="M831.20,512.00 A105.60,263.52 0 0 1 1042.40,512.00" stroke="#FF9500" stroke-width="4.30" stroke-opacity="0.5"><title>Silva &amp; Park : 1 article commun</title></path></g><g id="nodes"><circle class="node" tabindex="0" role="img" aria-label="Ito — Vision group, 2 co-authors" cx="92.00" cy="512" r="11" fill="#007AFF" stroke="#FFFFFF" stroke-width="3"><title>Ito — groupe Vision, 2 coauteurs</title></circle><text x="92.00" y="542.00" font-size="17" font-weight="500" fill="#6E6E73" text-anchor="end" transform="rotate(-30 92.00 542.00)">Ito</text><circle class="node" tabindex="0" role="img" aria-label="Reyes — Vision group, 3 co-authors" cx="197.60" cy="512" r="11" fill="#007AFF" stroke="#FFFFFF" stroke-width="3"><title>Reyes — groupe Vision, 3 coauteurs</title></circle><text x="197.60" y="542.00" font-size="17" font-weight="500" fill="#6E6E73" text-anchor="end" transform="rotate(-30 197.60 542.00)">Reyes</text><circle class="node" tabindex="0" role="img" aria-label="Okafor — Vision group, 3 co-authors" cx="303.20" cy="512" r="11" fill="#007AFF" stroke="#FFFFFF" stroke-width="3"><title>Okafor — groupe Vision, 3 coauteurs</title></circle><text x="303.20" y="542.00" font-size="17" font-weight="500" fill="#6E6E73" text-anchor="end" transform="rotate(-30 303.20 542.00)">Okafor</text><circle class="node" tabindex="0" role="img" aria-label="Chen — Vision group, 3 co-authors" cx="408.80" cy="512" r="11" fill="#007AFF" stroke="#FFFFFF" stroke-width="3"><title>Chen — groupe Vision, 3 coauteurs</title></circle><text x="408.80" y="542.00" font-size="17" font-weight="500" fill="#6E6E73" text-anchor="end" transform="rotate(-30 408.80 542.00)">Chen</text><circle class="node" tabindex="0" role="img" aria-label="Novak — Vision group, 2 co-authors" cx="514.40" cy="512" r="11" fill="#007AFF" stroke="#FFFFFF" stroke-width="3"><title>Novak — groupe Vision, 2 coauteurs</title></circle><text x="514.40" y="542.00" font-size="17" font-weight="500" fill="#6E6E73" text-anchor="end" transform="rotate(-30 514.40 542.00)">Novak</text><circle class="node" tabindex="0" role="img" aria-label="Nadia — bridge between both groups, 3 co-authors" cx="620.00" cy="512" r="13.5" fill="#AF52DE" stroke="#FFFFFF" stroke-width="3"><title>Nadia — pont entre les deux groupes, 3 coauteurs</title></circle><text x="620.00" y="542.00" font-size="17" font-weight="700" fill="#1D1D1F" text-anchor="end" transform="rotate(-30 620.00 542.00)">Nadia</text><circle class="node" tabindex="0" role="img" aria-label="Haddad — Language group, 3 co-authors" cx="725.60" cy="512" r="11" fill="#FF9500" stroke="#FFFFFF" stroke-width="3"><title>Haddad — groupe Langage, 3 coauteurs</title></circle><text x="725.60" y="542.00" font-size="17" font-weight="500" fill="#6E