<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="bx-title bx-desc">
<title id="bx-title">Où chaque niveau de service cache sa traîne de latence</title><desc id="bx-desc">Diagramme en valeurs de lettres (boxen) de la latence des requêtes pour trois niveaux de service, 24 000 requêtes échantillonnées chacun. Des boîtes imbriquées s'écartent de la médiane à travers les 50 %, 75 %, 87,5 % centraux et les traînes plus profondes ; un repère marque le p99 de chaque niveau. Le niveau gratuit a la traîne la plus large et la plus longue ; Enterprise la plus resserrée. La latence p99 du niveau gratuit (875 ms) vaut 3,7× la traîne Enterprise (239 ms), pourtant la médiane bouge à peine.</desc>
 <style>.lv { transition: opacity.12s ease; }
.stack:hover.lv { opacity:.6; }
.lv:hover { opacity: 1; }
 @media (prefers-reduced-motion: reduce) {.lv { transition: none; } }
 text { fill: #1D1D1F; }</style>
