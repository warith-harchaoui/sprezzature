    <text x="104.0" y="282.3" font-size="15" fill="#6E6E73" text-anchor="end" font-family="Roboto Mono, monospace">600</text>
    <line x1="120.0" y1="197.7" x2="1000.0" y2="197.7" stroke="#E5E5EA" stroke-width="1"/>
    <text x="104.0" y="202.7" font-size="15" fill="#6E6E73" text-anchor="end" font-family="Roboto Mono, monospace">750</text>
