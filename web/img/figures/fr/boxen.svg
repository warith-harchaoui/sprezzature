<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="bx-title bx-desc">
<title id="bx-title">Where each service tier hides its latency tail</title><desc id="bx-desc">Letter-value (boxen) plot of request latency for three service tiers, 24,000 sampled requests each. Nested boxes step outward from the median through the middle 50%, 75%, 87.5% and deeper tails; a tick marks each tier's p99. Free tier has the widest, longest tail; Enterprise the tightest. Free-tier p99 latency (875 ms) runs 3.7× the Enterprise tail (239 ms), yet the median barely moves.</desc>
  <style>
    .lv { transition: opacity .12s ease; }
    .stack:hover .lv { opacity: .6; }
    .lv:hover { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .lv { transition: none; } }
    text { fill: #1D1D1F; }
  </style>
  <rect width="1040" height="700" fill="#FFFFFF"/>
  <text x="120" y="48" font-size="26" font-weight="700" fill="#1D1D1F">Where each service tier hides its latency tail</text>
  <text x="120" y="77" font-size="17" fill="#6E6E73">Free-tier p99 latency (875 ms) runs 3.7× the Enterprise tail (239 ms), yet the median barely moves</text>
  <text x="120" y="99" font-size="14" fill="#6E6E73" font-family="Roboto Mono, monospace">Letter-value plot · 24,000 requests per tier · illustrative</text>
