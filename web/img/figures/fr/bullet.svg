<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="814" viewBox="0 0 1240 814" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="bl-title bl-desc">
<title id="bl-title">Q3 growth scorecard as five bullet graphs</title>
<desc id="bl-desc">Five key performance indicators drawn as bullet graphs. Each row has three shaded qualitative bands (poor, satisfactory, good), a dark measure bar for the value reached, and an orange tick for the target. 2 of 5 metrics met or beat their target this quarter; trial signups and p95 latency fell short.</desc>
