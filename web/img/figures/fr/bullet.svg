<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="814" viewBox="0 0 1240 814" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="bl-title bl-desc">
<title id="bl-title">Tableau de bord de croissance du T3 en cinq graphiques à puce</title>
<desc id="bl-desc">Cinq indicateurs clés dessinés en graphiques à puce. Chaque ligne comporte trois plages qualitatives ombrées (faible, correct, bon), une barre de mesure foncée pour la valeur atteinte et un repère orange pour la cible. 2 des 5 indicateurs ont atteint ou dépassé leur cible ce trimestre ; les inscriptions à l'essai et la latence p95 sont restées en deçà.</desc>
<style>.bar{cursor:pointer}.bar:hover,.bar:focus{stroke:#1D1D1F;stroke-width:2}.bar:focus{outline:none}</style>
