<svg xmlns="http://www.w3.org/2000/svg" width="1098" height="1450" viewBox="0 0 1098 1450" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="cal-title cal-desc"><rect width="1098" height="1450" fill="#FFFFFF"/><g transform="translate(59,0)">
<title id="cal-title">Le modèle d'attrition est trop confiant : ses prédictions à haut risque ratent la diagonale</title>
<desc id="cal-desc">Diagramme de fiabilité (courbe de calibration) pour un classifieur d’attrition trop confiant. L’axe horizontal est la probabilité d’attrition prédite par le modèle ; l’axe vertical, le taux d’attrition observé dans chaque tranche. Une ligne pointillée à 45 degrés marque la calibration parfaite, entourée d’une faible bande de tolérance grise. La courbe de fiabilité passe sous la diagonale du côté confiant, donc les prédictions à forte probabilité surviennent moins souvent qu’annoncé (trop confiant, en rouge à droite) ; erreur de calibration attendue 10 %. Du côté timide elle flotte au-dessus de la diagonale, donc il sous-estime l’attrition (pas assez confiant, en bleu à gauche). Chaque point est dimensionné par le nombre de prédictions tombées dans la tranche, et un histogramme en dessous montre où le modèle place ses prédictions</desc>
<style>.pt{cursor:pointer}.pt.halo{opacity:0}.pt:hover.halo,.pt:focus.halo{opacity:1}.pt:focus{outline:none}.bar{cursor:pointer}</style>
