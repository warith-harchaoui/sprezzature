<svg xmlns="http://www.w3.org/2000/svg" width="2001" height="1000" viewBox="0 0 2001 1000" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="cs-title cs-desc"><rect width="2001" height="1000" fill="#FFFFFF"/><g transform="translate(360,0)">
<title id="cs-title">Le Royaume-Uni a fait croître son économie tout en réduisant de près de moitié le carbone par habitant</title>
<desc id="cs-desc">Nuage de points connectés retraçant les émissions de dioxyde de carbone par habitant (vertical, tonnes) face à la production économique par habitant (horizontal, milliers de dollars US) pour le Royaume-Uni, un point tous les cinq ans de 1990 à 2022. La trajectoire va d'abord vers la droite à mesure que le revenu augmente, puis vire nettement vers la gauche et le bas : la production par habitant a grimpé d'environ 66 % tandis que les émissions par habitant ont reculé d'environ 53 %, de 10,0 à 4,7 tonnes. Le crochet vers la gauche montre le découplage entre croissance et carbone. Données illustratives.</desc>
<style>.wp{cursor:pointer}.wp .halo{opacity:0}.wp:hover .halo,.wp:focus .halo{opacity:1}.wp:focus{outline:none}</style>
<rect width="1280" height="1000" fill="#FFFFFF"/>
