<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="dendro-title dendro-desc"><title id="dendro-title">Three natural shelves emerge from how households shop</title><desc id="dendro-desc">Rectangular dendrogram from average-linkage hierarchical clustering of ten grocery product lines. The vertical axis is the merge dissimilarity (0 = identical basket behaviour, 1 = uncorrelated). Cutting the tree at 0.46 yields three clusters: fresh and health, household staples, and treats. Frozen ready-meals stays unclustered, joining only at the root. Each cluster is set apart by its branch grouping, not by colour alone, so it reads in greyscale and for colour-blind viewers.</desc><style>.branch{transition:opacity .15s ease}#tree:hover .cluster .branch{opacity:.2}#tree .cluster:hover .branch,#tree .cluster:focus-within .branch{opacity:1}.leaf-hit:focus{outline:none}</style><rect width="1480" height="900" fill="#FFFFFF"/><text x="60" y="54" font-size="30" font-weight="700" fill="#1D1D1F">Three natural shelves emerge from how households shop</text><text x="60" y="88" font-size="19" fill="#6E6E73">Private-label lines clustered by co-purchase similarity · illustrative data</text><g id="axis"><line x1="100.0" y1="690.0" x2="100.0" y2="158.0" stroke="#1D1D1F" stroke-width="1.4"/><line x1="118.0" y1="690.0" x2="1224.0" y2="690.0" stroke="#ECECF0" stroke-width="1.4"/><text x="90.0" y="695.0" text-anchor="end" font-family="Roboto Mono, ui-monospace, monospace" font-size="15" fill="#6E6E73">0.0</text><line x1="118.0" y1="588.7" x2="1224.0" y2="588.7" stroke="#ECECF0" stroke-width="1.4"/><text x="90.0" y="593.7" text-anchor="end" font-family="Roboto Mono, ui-monospace, monospace" font-size="15" fill="#6E6E73">0.2</text><line x1="118.0" y1="487.4" x2="1224.0" y2="487.4" stroke="#ECECF0" stroke-width="1.4"/><text x="90.0" y="492.4" text-anchor="end" font-family="Roboto Mono, ui-monospace, monospace" font-size="15" fill="#6E6E73">0.4</text><line x1="118.0" y1="386.0" x2="1224.0" y2="386.0" stroke="#ECECF0" stroke-width="1.4"/><text x="90.0" y="391.0" text-anchor="end" font-family="Roboto Mono, ui-monospace, monospace" font-size="15" fill="#6E6E73">0.6</text><line x1="118.0" y1="284.7" x2="1224.0" y2="284.7" stroke="#ECECF0" stroke-width="1.4"/><text x="90.0" y="289.7" text-anchor="end" font-family="Roboto Mono, ui-monospace, monospace" font-size="15" fill="#6E6E73">0.8</text><text x="34" y="429.0" font-size="18" font-weight="600" fill="#6E6E73" text-anchor="middle" transform="rotate(-90 34 429.0)">Merge dissimilarity</text></g><line x1="112.0" y1="457.0" x2="1224.0" y2="457.0" stroke="#1D1D1F" stroke-width="1.8" stroke-dasharray="7 5" opacity="0.55"/><text x="1224.0" y="445.0" text-anchor="end" font-size="16" font-style="italic" fill="#6E6E73">cut @ 0.46 → 3 clusters</text><g id="tree"><g id="spine"><path class="branch" d="M309.4,533.0 L309.4,396.2 L637.6,396.2 L637.6,517.8" fill="none" stroke="#A6A6AE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><title>Merge at dissimilarity 0.58 — joins 6 lines</title></path><path class="branch" d="M473.5,396.2 L473.5,315.1 L965.9,315.1 L965.9,543.1" fill="none" stroke="#A6A6AE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><title>Merge at dissimilarity 0.74 — joins 9 lines</title></path><path class="branch" d="M719.7,315.1 L719.7,223.9 L1157.3,223.9 L1157.3,690.0" fill="none" stroke="#A6A6AE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><title>Merge at dissimilarity 0.92 — joins 10 lines</title></path></g><g class="cluster" tabindex="0" role="img" aria-label="Fresh &amp; health cluster"><path class="branch" d="M172.7,690.0 L172.7,598.8 L282.1,598.8 L282.1,690.0" fill="none" stroke="#28CD41" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><title>Merge at dissimilarity 0.18 — joins 2 lines</title></path><path class="branch" d="M227.4,598.8 L227.4,533.0 L391.5,533.0 L391.5,690.0" fill="none" stroke="#28CD41" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><title>Merge at dissimilarity 0.31 — joins 3 lines</title></path></g><g class="cluster" tabindex="0" role="img" aria-label="Household staples cluster"><path class="branch" d="M500.9,690.0 L500.9,614.0 L610.3,614.0 L610.3,690.0" fill="none" stroke="#007AFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><title>Merge at dissimilarity 0.15 — joins 2 lines</title></path><path class="branch" d="M555.6,614.0 L555.6,517.8 L719.7,517.8 L719.7,690.0" fill="none" stroke="#007AFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><title>Merge at dissimilarity 0.34 — joins 3 lines</title></path></g><g class="cluster" tabindex="0" role="img" aria-label="Treats cluster"><path class="branch" d="M829.1,690.0 L829.1,583.6 L938.5,583.6 L938.5,690.0" fill="none" stroke="#AF52DE" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><title>Merge at dissimilarity 0.21 — joins 2 lines</title></path><path class="branch" d="M883.8,583.6 L883.8,543.1 L1047.9,543.1 L1047.9,690.0" fill="none" stroke="#AF52DE" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><title>Merge at dissimilarity 0.29 — joins 3 lines</title></path></g></g><g id="leaves"><circle cx="172.7" cy="690.0" r="6" fill="#28CD41" stroke="#FFFFFF" stroke-width="2"><title>Fresh produce — Fresh &amp; health</title></circle><text class="leaf-hit" tabindex="0" x="172.7" y="716.0" font-size="18" fill="#1D1D1F" text-anchor="end" transform="rotate(-32 172.7 716.0)">Fresh produce<title>Fresh produce — Fresh &amp; health</title></text><circle cx="282.1" cy="690.0" r="6" fill="#28CD41" stroke="#FFFFFF" stroke-width="2"><title>Yoghurt &amp; dairy — Fresh &amp; health</title></circle><text class="leaf-hit" tabindex="0" x="282.1" y="716.0" font-size="18" fill="#1D1D1F" text-anchor="end" transform="rotate(-32 282.1 716.0)">Yoghurt &amp; dairy<title>Yoghurt &amp; dairy — Fresh &amp; health</title></text><circle cx="391.5" cy="690.0" r="6" fill="#28CD41" stroke="#FFFFFF" stroke-width="2"><title>Breakfast cereal — Fresh &amp; health</title></circle><text class="leaf-hit" tabindex="0" x="391.5" y="716.0" font-size="18" fill="#1D1D1F" text-anchor="end" transform="rotate(-32 391.5 716.0)">Breakfast cereal<title>Breakfast cereal — Fresh &amp; health</title></text><circle cx="500.9" cy="690.0" r="6" fill="#007AFF" stroke="#FFFFFF" stroke-width="2"><title>Cleaning supplies — Household staples</title></circle><text class="leaf-hit" tabindex="0" x="500.9" y="716.0" font-size="18" fill="#1D1D1F" text-anchor="end" transform="rotate(-32 500.9 716.0)">Cleaning supplies<title>Cleaning supplies — Household staples</title></text><circle cx="610.3" cy="690.0" r="6" fill="#007AFF" stroke="#FFFFFF" stroke-width="2"><title>Paper goods — Household staples</title></circle><text class="leaf-hit" tabindex="0" x="610.3" y="716.0" font-size="18" fill="#1D1D1F" text-anchor="end" transform="rotate(-32 610.3 716.0)">Paper goods<title>Paper goods — Household staples</title></text><circle cx="719.7" cy="690.0" r="6" fill="#007AFF" stroke="#FFFFFF" stroke-width="2"><title>Pet food — Household staples</title></circle><text class="leaf-hit" tabindex="0" x="719.7" y="716.0" font-size="18" fill="#1D1D1F" text-anchor="end" transform="rotate(-32 719.7 716.0)">Pet food<title>Pet food — Household staples</title></text><circle cx="829.1" cy="690.0" r="6" fill="#AF52DE" stroke="#FFFFFF" stroke-width="2"><title>Chocolate &amp; sweets — Treats</title></circle><text class="leaf-hit" tabindex="0" x="829.1" y="716.0" font-size="18" fill="#1D1D1F" text-anchor="end" transform="rotate(-32 829.1 716.0)">Chocolate &amp; sweets<title>Chocolate &amp; sweets — Treats</title></text><circle cx="938.5" cy="690.0" r="6" fill="#AF52DE" stroke="#FFFFFF" stroke-width="2"><title>Soft drinks — Treats</title></circle><text class="leaf-hit" tabindex="0" x="938.5" y="716.0" font-size="18" fill="#1D1D1F" text-anchor="end" transform="rotate(-32 938.5 716.0)">Soft drinks<title>Soft drinks — Treats</title></text><circle cx="1047.9" cy="690.0" r="6" fill="#AF52DE" stroke="#FFFFFF" stroke-width="2"><title>Crisps &amp; snacks — Treats</title></circle><text class="leaf-hit" tabindex="0" x="1047.9" y="716.0" font-size="18" fill="#1D1D1F" text-anchor="end" transform="rotate(-32 1047.9 716.0)">Crisps &amp; snacks<title>Crisps &amp; snacks — Treats</title></text><circle cx="1157.3" cy="690.0" r="6" fill="#FF9500" stroke="#FFFFFF" stroke-width="2"><title>Frozen ready-meals — Unclustered</title></circle><text class="leaf-hit" tabindex="0" x="1157.3" y="716.0" font-size="18" fill="#1D1D1F" text-anchor="end" transform="rotate(-32 1157.3 716.0)">Frozen ready-meals<title>Frozen ready-meals — Unclustered</title></text></g><g id="legend"><text x="1256.0" y="178.0" font-size="15" font-weight="700" letter-spacing="0.7" fill="#6E6E73">CLUSTERS</text><rect x="1256.0" y="198.0" width="18" height="18" rx="5" fill="#28CD41"/><text x="1284.0" y="212.0" font-size="17" fill="#1D1D1F">Fresh &amp; health</text><text x="1284.0" y="232.0" font-family="Roboto Mono, ui-monospace, monospace" font-size="13.5" fill="#6E6E73">3 lines</text><rect x="1256.0" y="260.0" width="18" height="18" rx="5" fill="#007AFF"/><text x="1284.0" y="274.0" font-size="17" fill="#1D1D1F">Household staples</text><text x="1284.0" y="294.0" font-family="Roboto Mono, ui-monospace, monospace" font-size="13.5" fill="#6E6E73">3 lines</text><rect x="1256.0" y="322.0" width="18" height="18" rx="5" fill="#AF52DE"/><text x="1284.0" y="336.0" font-size="17" fill="#1D1D1F">Treats</text><text x="1284.0" y="356.0" font-family="Roboto Mono, ui-monospace, monospace" font-size="13.5" fill="#6E6E73">3 lines</text><circle cx="1265.0" cy="393.0" r="8" fill="#FF9500" stroke="#FFFFFF" stroke-width="2.5"/><text x="1284.0" y="398.0" font-size="17" fill="#1D1D1F">Unclustered</text><text x="1284.0" y="418.0" font-fami