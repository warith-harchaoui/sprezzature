<text x="24" y="58" font-size="12.5" fill="#6E6E73">Rapport de cotes groupé 1,44 (IC 95 % 1,26-1,64) sur 8 essais randomisés · I² = 34 %</text>
<text x="24" y="92" font-size="11.5" font-weight="700" fill="#6E6E73">Essai</text>
