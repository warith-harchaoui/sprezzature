<svg xmlns="http://www.w3.org/2000/svg" width="720" height="506" viewBox="0 0 720 506" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="fp-title fp-desc">
<title id="fp-title">Forest plot : la télésurveillance de la pression artérielle à domicile augmente les chances d'atteindre la cible</title>
<desc id="fp-desc">Forest plot de méta-analyse de 8 essais randomisés. Chaque ligne montre le rapport de cotes d'un essai pour atteindre la cible tensionnelle sous forme de boîte (aire ∝ poids de l'étude) avec une moustache d'intervalle de confiance à 95 %, sur un axe logarithmique avec une ligne nulle à 1,0. Le losange groupé en effets aléatoires est centré sur 1,44 (IC 95 % 1,26 à 1,64), nettement à droite de la valeur nulle, donc le programme augmente globalement les chances d'atteindre la cible.</desc>
<style>.row{cursor:pointer}.row.whisker,.row.cap{stroke:#6E6E73;stroke-width:1.6}.row:hover.whisker,.row:focus.whisker,.row:hover.cap,.row:focus.cap{stroke:#6E6E73;stroke-width:2.4}.row:hover.box,.row:focus.box,.row:hover.diamond,.row:focus.diamond,.row:hover.dot,.row:focus.dot{stroke:#FFFFFF;stroke-width:2.4}.row:focus{outline:none}.row:hover.rowbg,.row:focus.rowbg{fill:#F5F5F7}@media (prefers-reduced-motion:reduce){.grow{animation:none}[data-anim]{opacity:1 !important}}</style>
