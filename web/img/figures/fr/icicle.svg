<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="ice-t ice-d">
<title id="ice-t">Une requête SQL lente dévore 45 % de chaque paiement</title>
<desc id="ice-d">Graphique en stalactites / flame graph d'une requête GET /api/checkout totalisant 480 millisecondes. La barre racine occupe toute la largeur ; chaque ligne en dessous divise son parent par le temps. La tour chaude en surbrillance load_cart vers fetch_user_orders vers run_sql vers wait_on_lock est le chemin critique : wait_on_lock à lui seul fait 176 ms, environ 37 pour cent de la requête, et run_sql dans son ensemble fait 214 ms, environ 45 pour cent. Les appels hors chemin (authenticate, render_response) sont en gris atténué.</desc>
<style>.bar{transition:transform .16s ease, filter .16s ease;transform-box:fill-box;transform-origin:center;cursor:pointer;}.bar:hover,.bar:focus{filter:brightness(1.07);transform:scaleY(1.04);outline:none;}.bar:focus{stroke:#1D1D1F;stroke-width:2.5;}@media (prefers-reduced-motion: reduce){.bar{transition:none;}.bar:hover,.bar:focus{transform:none;}}</style>
<rect width="1300" height="860" fill="#FFFFFF"/>
<text x="88" y="72" font-size="38" font-weight="700" fill="#1D1D1F">Une requête SQL lente dévore 45 % de chaque paiement</text>
<text x="88" y="110" font-size="18" fill="#6E6E73">Flame graph CPU d'une requête GET /api/checkout (480 ms) · la largeur de la barre est le temps passé ; la tour la plus large est où optimiser en premier</text>
<text x="88" y="156" font-size="15" fill="#6E6E73" font-family="Roboto Mono, monospace">Temps dans la requête (largeur de barre = millisecondes)</text>
