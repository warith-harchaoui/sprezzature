<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1040" viewBox="0 0 1100 1040" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="lg-title lg-desc">
<title id="lg-title">Niveau de remplissage : 63 pour cent de la capacité utile, juste sous la normale saisonnière de 68 pour cent</title>
<desc id="lg-desc">Jauge circulaire à remplissage en forme de citerne. Un liquide bleu ondulé remplit la cuve à 63 pour cent de sa hauteur, avec un pourcentage en gras au centre. Une ligne pointillée marque la médiane saisonnière décennale de 68 pour cent, juste au-dessus du niveau actuel.</desc>
<defs><clipPath id="lg-disc"><circle cx="550.0" cy="600.0" r="340.0"/></clipPath></defs>
<rect width="1100" height="1040" fill="#FFFFFF"/>
<text x="60" y="78" font-size="36" font-weight="700" fill="#1D1D1F">Un réservoir un peu bas</text>
<text x="60" y="114" font-size="19" fill="#6E6E73">Lac de Serre-Ponçon · capacité utile au 1er juillet · médiane décennale 68 % · relevé illustratif</text>
<circle cx="550.0" cy="600.0" r="340.0" fill="#EEF1F6"/>
<g clip-path="url(#lg-disc)">
