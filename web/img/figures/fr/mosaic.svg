<text x="78" y="612" font-size="15" fill="#6E6E73" text-anchor="end" font-family="Roboto Mono, monospace">75%</text>
<line x1="84" y1="606" x2="96" y2="606" stroke="#E5E5EA" stroke-width="1.5"/>
<text x="78" y="742" font-size="15" fill="#6E6E73" text-anchor="end" font-family="Roboto Mono, monospace">100%</text>
