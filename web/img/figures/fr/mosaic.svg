<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="mosaic-t mosaic-d">
<title id="mosaic-t">Sur mobile, les portefeuilles ont dépassé les cartes</title>
<desc id="mosaic-d">Mosaïque de Marimekko : la largeur de chaque colonne est la part de l'appareil dans tous les paiements en ligne (Mobile le plus large à 54 pour cent), et chaque colonne empile les moyens de paiement selon leur part au sein de l'appareil. Sur Mobile, le Portefeuille est le segment le plus haut, dépassant la Carte.</desc>
<style>.tile{transition:transform .18s ease, filter .18s ease;transform-box:fill-box;transform-origin:center;}.tile:hover,.tile:focus{filter:brightness(1.06);transform:scale(1.015);outline:none;}.tile:focus{stroke:#1D1D1F;stroke-width:2;}@media (prefers-reduced-motion: reduce){.tile{transition:none;}.tile:hover,.tile:focus{transform:none;}}</style>
<rect width="1120" height="820" fill="#FFFFFF"/>
<text x="96" y="66" font-size="34" font-weight="700" fill="#1D1D1F">Sur mobile, les portefeuilles ont dépassé les cartes</text>
<text x="96" y="102" font-size="20" fill="#6E6E73">Part des paiements en boutique en ligne par appareil et moyen de paiement · trimestre illustratif</text>
<text x="34" y="476" font-size="18" fill="#6E6E73" text-anchor="middle" transform="rotate(-90 34 476)">Part au sein de l'appareil</text>
