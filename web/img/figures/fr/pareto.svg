<svg xmlns="http://www.w3.org/2000/svg" width="1435" height="920" viewBox="0 0 1435 920" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="pa-title pa-desc"><rect width="1435" height="920" fill="#FFFFFF"/><g transform="translate(78,0)">
<title id="pa-title">Quelques motifs de tickets provoquent l'essentiel de l'arriéré hebdomadaire</title>
<desc id="pa-desc">Diagramme de Pareto d'une semaine de tickets de support client (1 205 au total, illustratif). Les barres montrent la part de tickets de chaque motif, triées de la plus haute à la plus basse contre l'axe des pourcentages de gauche ; les 4 plus hautes sont en bleu comme les « quelques essentiels » et les 5 restantes s'estompent en gris comme les « nombreux secondaires ». Une ligne orange trace la part cumulée contre l'axe des pourcentages de droite, montant à 100 %. La ligne de Pareto pointillée à 80 % marque le seuil 80/20 : la courbe cumulée le franchit d'abord au motif 4, donc 4 motifs représentent 82 % des tickets (991 sur 1 205). Données illustratives.</desc>
<style>.bar{cursor:pointer}.bar rect{transition:opacity .12s}.bar:hover rect,.bar:focus rect{opacity:.82}.bar:focus{outline:none}.pt{cursor:pointer}.pt .halo{opacity:0}.pt:hover .halo,.pt:focus .halo{opacity:1}.pt:focus{outline:none}</style>
