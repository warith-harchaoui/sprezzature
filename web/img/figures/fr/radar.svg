<svg xmlns="http://www.w3.org/2000/svg" width="1086" height="1080" viewBox="0 0 1086 1080" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="radar-title radar-desc"><rect width="1086" height="1080" fill="#FFFFFF"/><g transform="translate(43,0)"><title id="radar-title">Aucune base de données ne gagne sur tous les fronts</title><desc id="radar-desc">Graphique radar comparant trois bases de données cloud managées, Aurora, Cloud SQL et Cosmos, sur six critères disposés en rayons : vitesse des requêtes, mise à l'échelle automatique, écosystème, facilité d'usage, portée mondiale et prix, chacun noté de 0 à 100 où l'anneau extérieur est le meilleur. Aurora dessine un profil élevé sur la vitesse des requêtes et la mise à l'échelle ; Cloud SQL culmine sur l'écosystème et la facilité d'usage ; Cosmos va le plus loin sur la portée mondiale et le prix. Les trois profils se croisent, aucune base ne domine.</desc><rect width="1000" height="1080" rx="22" fill="#FFFFFF"/><style>@media (prefers-contrast: more){
  .rad-0{fill:#004CCE;stroke:#004CCE;}
  .rad-1{fill:#993600;stroke:#993600;}
  .rad-2{fill:#831FAF;stroke:#831FAF;}
}@media (forced-colors: active){
  .rad-0{fill:url(#radar-fcp-0);forced-color-adjust:none;}
  .rad-1{fill:url(#radar-fcp-1);forced-color-adjust:none;}
  .rad-2{fill:url(#radar-fcp-2);forced-color-adjust:none;}
}@media (prefers-color-scheme: dark){
  [fill="#FFFFFF"]{fill:#0B0B0C;}
  [fill="#1D1D1F"]{fill:#F2F2F7;}
  [fill="#6E6E73"]{fill:#9C9CA3;}
  [style*="multiply"]{mix-blend-mode:screen;}
  [stroke="#E5E5EA"]{stroke:#2C2C2E;}[stroke="#C7C7CC"]{stroke:#3A3A3C;}
}</style><defs><pattern id="radar-fcp-0" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="Canvas"/><path d="M0,8L8,0" stroke="CanvasText" stroke-width="1.6"/></pattern><pattern id="radar-fcp-1" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="Canvas"/><path d="M0,0L8,8" stroke="CanvasText" stroke-width="1.6"/></pattern><pattern id="radar-fcp-2" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="Canvas"/><path d="M0,4L8,4" stroke="CanvasText" stroke-width="1.6"/></pattern></defs><text x="64" y="80" font-size="38" font-weight="700" fill="#1D1D1F">Aucune base de données ne gagne sur tous les fronts</text><text x="64" y="120" font-size="21" fill="#6E6E73">Trois bases de données cloud managées notées de 0 à 100 sur six critères d'achat · données illustratives</text><polygon points="500,519.2 559.6,553.6 559.6,622.4 500,656.8 440.4,622.4 440.4,553.6" fill="none" stroke="#E5E5EA" stroke-width="1.0"/><text x="510" y="524.2" font-size="15" font-family="Roboto Mono, ui-monospace, monospace" fill="#6E6E73">20</text><polygon points="500,450.4 619.2,519.2 619.2,656.8 500,725.6 380.8,656.8 380.8,519.2" fill="none" stroke="#E5E5EA" stroke-width="1.0"/><text x="510" y="455.4" font-size="15" font-family="Roboto Mono, ui-monospace, monospace" fill="#6E6E73">40</text><polygon points="500,381.6 678.7,484.8 678.7,691.2 500,794.4 321.3,691.2 321.3,484.8" fill="none" stroke="#E5E5EA" stroke-width="1.0"/><text x="510" y="386.6" font-size="15" font-family="Roboto Mono, ui-monospace, monospace" fill="#6E6E73">60</text><polygon points="500,312.8 738.3,450.4 738.3,725.6 500,863.2 261.7,725.6 261.7,450.4" fill="none" stroke="#E5E5EA" stroke-width="1.0"/><text x="510" y="317.8" font-size="15" font-family="Roboto Mono, ui-monospace, monospace" fill="#6E6E73">80</text><polygon points="500,244 797.9,416 797.9,760 500,932 202.1,760 202.1,416" fill="none" stroke="#C7C7CC" stroke-width="1.6"/><text x="510" y="249" font-size="15" font-family="Roboto Mono, ui-monospace, monospace" fill="#6E6E73">100</text><line x1="500" y1="588" x2="500" y2="244" stroke="#E5E5EA" stroke-width="1"/><text x="500" y="202" text-anchor="middle" font-size="21" font-weight="600" fill="#1D1D1F">Vitesse des requêtes</text><line x1="500" y1="588" x2="797.9" y2="416" stroke="#E5E5EA" stroke-width="1"/><text x="827.4" y="406" text-anchor="start" font-size="21" font-weight="600" fill="#1D1D1F">Mise à l'échelle auto</text><line x1="500" y1="588" x2="797.9" y2="760" stroke="#E5E5EA" stroke-width="1"/><text x="827.4" y="784" text-anchor="start" font-size="21" font-weight="600" fill="#1D1D1F">Écosystème</text><line x1="500" y1="588" x2="500" y2="932" stroke="#E5E5EA" stroke-width="1"/><text x="500" y="990" text-anchor="middle" font-size="21" font-weight="600" fill="#1D1D1F">Facilité d'usage</text><line x1="500" y1="588" x2="202.1" y2="760" stroke="#E5E5EA" stroke-width="1"/><text x="172.6" y="784" text-anchor="end" font-size="21" font-weight="600" fill="#1D1D1F">Portée mondiale</text><line x1="500" y1="588" x2="202.1" y2="416" stroke="#E5E5EA" stroke-width="1"/><text x="172.6" y="406" text-anchor="end" font-size="21" font-weight="600" fill="#1D1D1F">Prix</text><polygon class="rad-0" points="500,271.5 762.2,436.6 708.5,708.4 500,808.2 327.2,687.8 345.1,498.6" fill="#007AFF" fill-opacity="0.07" stroke="#007AFF" stroke-width="3.6" stroke-linejoin="round"/><g><title>Aurora · Vitesse des requêtes : 92/100</title><circle cx="500" cy="271.5" r="6.5" fill="#007AFF" stroke="#FFFFFF" stroke-width="2.2"/></g><g><title>Aurora · Mise à l'échelle auto : 88/100</title><circle cx="762.2" cy="436.6" r="6.5" fill="#007AFF" stroke="#FFFFFF" stroke-width="2.2"/></g><g><title>Aurora · Écosystème : 70/100</title><circle cx="708.5" cy="708.4" r="6.5" fill="#007AFF" stroke="#FFFFFF" stroke-width="2.2"/></g><g><title>Aurora · Facilité d'usage : 64/100</title><circle cx="500" cy="808.2" r="6.5" fill="#007AFF" stroke="#FFF