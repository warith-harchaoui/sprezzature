<svg xmlns="http://www.w3.org/2000/svg" width="1417" height="900" viewBox="0 0 1417 900" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="rose-title rose-desc"><rect width="1417" height="900" fill="#FFFFFF"/><g transform="translate(118,0)">
<title id="rose-title">Rose de Nightingale : la maladie évitable, non le combat, a tué le plus de soldats pendant la guerre de Crimée</title>
<desc id="rose-desc">Diagramme polaire (coxcomb) de la mortalité de l'armée pendant la guerre de Crimée, d'avril 1854 à mars 1855. Douze secteurs d'angle égal, un par mois, tournent dans le sens horaire depuis le haut ; le rayon de chaque secteur est le taux annuel de décès du mois pour 1 000 hommes, empilé et coloré par cause. La bande bleu pâle des maladies évitables écrase la bande rouge des blessures chaque mois et enfle jusqu'à son sommet en janvier 1855, puis se rétracte au printemps après la réforme sanitaire.</desc>
<style>.wedge { transition: opacity.18s ease; }
svg:hover.cause, svg:focus-within.cause { opacity:.16; }
svg:has(.cause-disease:hover).cause-disease, svg:has(.cause-disease:focus).cause-disease { opacity: 1; }
svg:has(.cause-wounds:hover).cause-wounds, svg:has(.cause-wounds:focus).cause-wounds { opacity: 1; }
svg:has(.cause-other:hover).cause-other, svg:has(.cause-other:focus).cause-other { opacity: 1; }
.legend-row { cursor: pointer; }
.legend-row:focus { outline: 3px solid #0A4DA0; outline-offset: 3px; }
.wedge:focus { outline: none; }
.wedge:focus { stroke: #0A4DA0; stroke-width: 2.4; }
@media (prefers-reduced-motion: reduce) {.wedge { transition: none; } }</style>
<rect width="1180" height="900" fill="#FFFFFF"/>
<text x="56" y="66" font-size="33" font-weight="700" fill="#1D1D1F">La plupart des morts n'ont jamais vu de champ de bataille</text>
<text x="56" y="100" font-size="18" fill="#6E6E73">Diagramme polaire de Florence Nightingale · mortalité de l'armée britannique en Orient · décès annuels pour 1 000 hommes, par cause · avr. 1854-mars 1855</text>
