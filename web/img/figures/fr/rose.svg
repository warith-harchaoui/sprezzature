<text x="880" y="438" font-size="16" font-weight="700" fill="#1D1D1F">Comment le lire</text>
<text x="880" y="468" font-size="15" fill="#6E6E73">Chaque secteur a la même largeur, un mois.</text>
<text x="880" y="490" font-size="15" fill="#6E6E73">Le rayon est le taux de mortalité de ce mois ;</text>
<text x="880" y="512" font-size="15" fill="#6E6E73">la couleur le répartit par cause. Plus grand pétale,</text>
<text x="880" y="534" font-size="15" fill="#6E6E73">mois plus meurtrier. Survolez une couleur pour l'isoler.</text>
