<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="820" viewBox="0 0 1360 820" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="sankey-title sankey-desc"><title id="sankey-title">La recherche organique remplit l'entonnoir, mais les annonces payantes convertissent</title><desc id="sankey-desc">Diagramme de Sankey du flux de visiteurs à travers quatre étapes : canal d'acquisition, engagement, intention d'inscription et résultat. La largeur du ruban est proportionnelle au nombre de visiteurs. La recherche organique est la plus grande source ; les visiteurs venus d'annonces payantes atteignent une offre payante à un taux plus élevé.</desc><style>.link{transition:opacity .15s ease}#links:hover .link{opacity:.18}#links .link:hover,#links .link:focus{opacity:1}.link:focus{outline:none}</style><rect width="1360" height="820" fill="#FFFFFF"/><text x="44" y="58" font-size="34" font-weight="700" fill="#1D1D1F">La recherche organique remplit l'entonnoir, mais les annonces payantes convertissent</text><text x="44" y="92" font-size="20" fill="#6E6E73">Une semaine de visiteurs du site, du canal au résultat · données illustratives</text><text x="44.0" y="146.0" font-size="16" font-weight="600" letter-spacing="1.0" fill="#6E6E73" text-anchor="start">CANAL</text><text x="460.0" y="146.0" font-size="16" font-weight="600" letter-spacing="1.0" fill="#6E6E73" text-anchor="start">ENGAGEMENT</text><text x="876.0" y="146.0" font-size="16" font-weight="600" letter-spacing="1.0" fill="#6E6E73" text-anchor="start">INTENTION</text><text x="1316.0" y="146.0" font-size="16" font-weight="600" letter-spacing="1.0" fill="#6E6E73" text-anchor="end">ISSUE</text><g id="links"><path class="link" tabindex="0" role="img" aria-label="Browsed → Left: 5,100 visitors" d="M484.0,329.6 C680.0,329.6 680.0,440.3 876.0,440.3 L876.0,673.2 C680.0,673.2 680.0,562.4 484.0,562.4 Z" fill="#808080" fill-opacity="0.55" stroke="#FFFFFF" stroke-width="1.25" stroke-opacity="0.9"><title>Browse