<svg role="img" aria-label="Hip-Hop overtakes Rock as streaming reshapes the charts" xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Roboto, system-ui, sans-serif"><title>Le hip-hop dépasse le rock à mesure que le streaming redessine les classements</title><desc>Streamgraph on a wiggle baseline: recorded-music streaming share by genre, 2000 to 2024. Each ribbon's thickness is its share of listening that year. The Hip-Hop / R&amp;B ribbon swells to become the widest band while the Rock ribbon thins, as the format shifts from the compact disc to on-demand streaming. Illustrative data.</desc><rect width="1280" height="800" rx="18" fill="#FFFFFF"/><text x="60" y="66" font-size="31" font-weight="700" fill="#1D1D1F">Le hip-hop dépasse le rock à mesure que le streaming redessine les classements</text><text x="60" y="98" font-size="17.5" fill="#6E6E73">Part du streaming de musique enregistrée par genre, épaisseur de la bande = part d'écoute cette année-là</text><text x="60" y="121" font-size="17.5" fill="#6E6E73">Données illustratives, 2000-2024</text><line x1="60" y1="158" x2="60" y2="718" stroke="#F0F0F3" stroke-width="1.4"/><line x1="270.4" y1="158" x2="270.4" y2="718" stroke="#F0F0F3" stroke-width="1.4"/><line x1="480.8" y1="158" x2="480.8" y2="718" stroke="#F0F0F3" stroke-width="1.4"/><line x1="691.2" y1="158" x2="691.2" y2="718" stroke="#F0F0F3" stroke-width="1.4"/><line x1="901.7" y1="158" x2="901.7" y2="718" stroke="#F0F0F3" stroke-width="1.4"/><line x1="1070" y1="158" x2="1070" y2="718" stroke="#F0F0F3" stroke-width="1.4"/><defs></defs><g><path d="M60,396.7 C67,396.9 88.1,397.7 102.1,398.3 C116.1,398.9 130.1,399.5 144.2,400.3 C158.2,401 172.2,401.8 186.2,402.7 C200.3,403.6 214.3,404.6 228.3,405.8 C242.4,406.9 256.4,408.1 270.4,409.5 C284.4,410.8 298.5,412.3 312.5,413.9 C326.5,415.6 340.6,417.3 354.6,419.3 C368.6,421.2 382.6,423.3 396.7,425.5 C410.7,427.8 424.7,430.2 438.8,432.7 C452.8,435.3 466.8,438 480.8,440.9 C494