<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="820" viewBox="0 0 1040 820" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="tn-title tn-desc">
<title id="tn-title">La texture du sol en diagramme ternaire de sable, limon et argile</title>
<desc id="tn-desc">Diagramme ternaire : un triangle équilatéral dont les coins sont 100 % argile (haut), 100 % sable (bas-gauche) et 100 % limon (bas-droite). Chaque point est un échantillon de terre arable, positionné par ses pourcentages de sable / limon / argile, dont la somme fait toujours 100. Les échantillons se regroupent en trois classes de texture : Limon sableux, Limon fin, Argile. Le limon sableux se place vers le coin du sable, le limon fin vers le coin du limon, et l'argile près du haut.</desc>
