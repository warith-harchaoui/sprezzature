.grp-C:hover.lobe-C,.grp-C:focus.lobe-C,.grp-C:hover.setlabel-C,.grp-C:focus.setlabel-C { opacity: 1; }
.grp { cursor: pointer; }
.grp:focus { outline: 3px solid #0A4DA0; outline-offset: 3px; border-radius: 12px; }
@media (prefers-reduced-motion: reduce) {.lobe,.setlabel { transition: none; } }</style>
