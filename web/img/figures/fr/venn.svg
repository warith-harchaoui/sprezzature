<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="940" viewBox="0 0 1080 940" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="vn-title vn-desc">
<title id="vn-title">Compétences croisées des professionnels de la donnée</title>
<desc id="vn-desc">Diagramme de Venn à trois ensembles des compétences de 1 000 professionnels de la donnée interrogés. Python 619 au total ; SQL 539 ; Cloud 456. La région centrale, à l'aise dans les trois, est la plus grande avec 214, et Python et SQL réunis en ajoutent 188.</desc>
<style>.lobe { transition: opacity.18s ease; }
