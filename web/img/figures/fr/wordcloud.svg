<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="wc-title wc-desc">
<title id="wc-title">Word cloud of coffee-grinder reviews: buyers love how quietly it grinds, and the one gripe is noise</title>
<desc id="wc-desc">Un nuage de mots en spirale d'une année d'avis produit sur un moulin à café à meules. Chaque mot est dimensionné par le nombre d'avis qui le mentionnent et étiqueté par thème avec une couleur et un signe : un plus en tête et du vert pour l'éloge, un moins en tête et du rouge pour la plainte, et aucun signe en bleu pour les mots produit neutres. Les plus gros mots sont mouture, silencieux et régulier ; le plus gros mot de plainte est bruyant.</desc>
