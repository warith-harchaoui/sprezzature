.word { transition: opacity .18s ease; }
svg:has(.legend-row:hover) .word, svg:has(.legend-row:focus) .word { opacity: .12; }
svg:has(.legend-praise:hover) .grp-praise, svg:has(.legend-praise:focus) .grp-praise { opacity: 1; }
svg:has(.legend-gripe:hover) .grp-gripe, svg:has(.legend-gripe:focus) .grp-gripe { opacity: 1; }
svg:has(.legend-neutral:hover) .grp-neutral, svg:has(.legend-neutral:focus) .grp-neutral { opacity: 1; }
.legend-row { cursor: pointer; }
.legend-row:focus { outline: 3px solid #0A4DA0; outline-offset: 3px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { .word { transition: none; } }
</style>
