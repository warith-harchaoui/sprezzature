<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="940" viewBox="0 0 1040 940" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="lg-title lg-desc">
<title id="lg-title">A churn model reaches most churners from a small fraction of the ranked list</title>
<desc id="lg-desc">Cumulative-gain chart for a churn-prevention campaign. The horizontal axis is the share of customers contacted, working down a list ranked by the model’s predicted churn risk; the vertical axis is the share of all churners reached. Three curves: a dashed grey diagonal is the random baseline (contacting X % reaches X % of churners); a thin green line is the perfect model, the ceiling, rising steeply then flattening once every churner is captured; and a thick blue line is the actual model, sitting between the two. The shaded blue band between the model and the diagonal is the value the model adds. A marker shows the operating point: contacting the riskiest 20 % reaches 63 % of churners, 3.16× better than random</desc>
<style>.pt{cursor:pointer}.pt.halo{opacity:0}.pt:hover.halo,.pt:focus.halo{opacity:1}.pt:focus{outline:none}</style>
