<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="pb-title pb-desc"><title id="pb-title">JavaScript and Python still anchor the working web</title><desc id="pb-desc">Packed-bubble chart of programming languages. Each bubble is a language, labelled with its name and share, so it reads without relying on colour. Its area is the share of professional developers who report using it, and its colour marks the language family: web and scripting, data and scientific, systems, and enterprise / JVM. The web and scripting family (JavaScript, HTML/CSS, TypeScript) and the data family (Python, SQL) hold the largest bubbles, while the systems and enterprise families form smaller but distinct clusters. Hover or focus any bubble to lift its whole family and dim the rest.</desc><style>.bubble{transition:opacity.18s ease}.bubble:focus{outline:none}#pack:has(.bubble.f0:is(:hover,:focus-within)).bubble{opacity:.26}#pack:has(.bubble.f0:is(:hover,:focus-within)).bubble.f0{opacity:1}#pack:has(.bubble.f1:is(:hover,:focus-within)).bubble{opacity:.26}#pack:has(.bubble.f1:is(:hover,:focus-within)).bubble.f1{opacity:1}#pack:has(.bubble.f2:is(:hover,:focus-within)).bubble{opacity:.26}#pack:has(.bubble.f2:is(:hover,:focus-within)).bubble.f2{opacity:1}#pack:has(.bubble.f3:is(:hover,:focus-within)).bubble{opacity:.26}#pack:has(.bubble.f3:is(:hover,:focus-within)).bubble.f3{opacity:1}</style><rect width="1280" height="1040" fill="#FFFFFF"/><text x="56" y="74" font-size="37" font-weight="700" fill="#1D1D1F">JavaScript and Python still anchor the working web</text><text x="56" y="112" font-size="20" fill="#6E6E73">Share of professional developers using each language, by family</text><g id="pack"><g id="bubbles"><g class="bubble f0" tabindex="0" role="img" aria-label="JavaScript — 62.3% of developers · Web &amp; scripting"><title>JavaScript — 62.3% of developers · Web &amp; scripting</title