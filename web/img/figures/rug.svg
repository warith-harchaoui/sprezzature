<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="rug-title rug-desc">
<title id="rug-title">Rug plot of checkout API response times</title>
<desc id="rug-desc">A kernel-density curve over a rug of raw observations. A dense band of fast requests near 120 ms sits beside a thin, unmistakable tail of slow requests past 300 ms that a single average would hide.</desc>
<rect width="1160" height="700" fill="#FFFFFF"/>
<text x="96" y="60" font-size="30" font-weight="700" fill="#1D1D1F">The slow tail hides behind a fast average</text>
<text x="96" y="94" font-size="20" fill="#6E6E73">Checkout API response times &#8212; every tick is one real request</text>
