<text x="30" y="498.0" font-size="19" fill="#1D1D1F" font-weight="600" text-anchor="middle" transform="rotate(-90 30 498.0)">Height = GDP per capita (US$ thousands)</text>
<text x="92" y="72" font-size="38" font-weight="700" fill="#1D1D1F">Two ways to build a multi-trillion economy</text>
<text x="92" y="112" font-size="21" fill="#6E6E73">Column area is total GDP: the United States reaches it with high output per person, China with sheer population &#183; World Bank / IMF 2023</text>
<rect x="92" y="147" width="6" height="30" rx="3" fill="#1D1D1F"/>
<text x="110" y="167" font-size="17" fill="#1D1D1F">height = output per person</text>
